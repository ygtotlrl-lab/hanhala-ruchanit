<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1a3c6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title></title>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.f0bbfa3a.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.59b21341.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.fd071042.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.3.11/build/pdfmake.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.3.11/build/vfs_fonts.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/style.screens.css">
</head>
<body>

<!-- הקליפה מתחילה חשופה, והמסגרת נחשפת רק יחד עם המסך הפנימי. -->
<div id="shell" class="is-bare">
<header>
  <div class="hl">
    <img class="hdr-logo logo" src="icons/icon-512.092edf48.png" alt="לוגו ישיבה">
    <div class="hdiv"></div>
    <div class="hdr-titles htxt">
      <span class="hdr-bh">ב"ה</span>
      <strong class="hdr-name">הנהלה רוחנית</strong>
      <span class="hdr-motto">יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד</span>
    </div>
  </div>
  <nav>
    <button class="nb on" data-pg="home" data-act="page" data-page="home">🏠 ראשי</button>
    <button class="nb" data-pg="students" data-act="page" data-page="students">👥 מצבת</button>
    <button class="nb" data-pg="attend" data-act="page" data-page="attend">✅ סדרים</button>
    <button class="nb" data-pg="sleep" data-act="page" data-page="sleep">🌙 שינה</button>
    <button class="nb" data-pg="exams" data-act="page" data-page="exams">📝 מבחנים</button>
    <button class="nb" data-pg="files" data-act="page" data-page="files">📁 תיקים</button>
    <button class="nb" data-pg="reports" data-act="page" data-page="reports">📊 דוחות</button>
    <button class="nb" data-pg="settings" title="הגדרות" data-act="page" data-page="settings">⚙️</button>
    <button class="nb" data-act="logout" title="התנתק">🚪</button>
  </nav>
  <div id="user-avatar-wrap" class="hidden avatar-wrap" data-menu="user">
    <button data-act="user-menu-toggle" class="avatar-btn">
      <span class="avatar-ico">👤</span>
      <span id="hdr-username"></span>
    </button>
    <div id="user-menu" class="hidden user-menu">
      <div id="user-menu-name" class="user-menu-name"></div>
      <div id="user-menu-role" class="user-menu-role"></div>
      <div id="user-menu-others" class="user-menu-others"></div>
      <button data-act="my-pass" class="user-menu-item">שינוי הסיסמה שלי 🔑</button>
      <button data-act="menu-logout" class="user-menu-logout">יציאה מהמערכת 🚪</button>
    </div>
  </div>
</header>
<nav class="bottom-nav">
  <button class="bn on" data-pg="home" data-act="page-nav" data-page="home">
    <span class="bn-ic">🏠</span><span>ראשי</span>
  </button>
  <button class="bn" data-pg="students" data-act="page-nav" data-page="students">
    <span class="bn-ic">👥</span><span>מצבת</span>
  </button>
  <button class="bn" data-pg="attend" data-act="page-nav" data-page="attend">
    <span class="bn-ic">✅</span><span>סדרים</span>
  </button>
  <button class="bn" data-pg="sleep" data-act="page-nav" data-page="sleep">
    <span class="bn-ic">🌙</span><span>שינה</span>
  </button>
  <button class="bn" data-pg="exams" data-act="page-nav" data-page="exams">
    <span class="bn-ic">📝</span><span>מבחנים</span>
  </button>
  <button class="bn" data-pg="reports" data-act="page-nav" data-page="reports">
    <span class="bn-ic">📊</span><span>דוחות</span>
  </button>
  <button class="bn" data-pg="settings" data-act="page-nav" data-page="settings">
    <span class="bn-ic">⚙️</span><span>הגדרות</span>
  </button>
</nav>
<main id="view"><div class="view-loading" role="status" aria-label="טוען"><span class="view-spin"></span></div></main>
</div>


<div id="modal" class="veil" data-veil="modal">
  <div class="sheet" data-ks role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>
<div id="ask" class="veil" data-veil="ask">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>

<script type="module" src="app/main.js"></script>


</body>
</html>
