<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1a3c6e">
<meta name="robots" content="noindex">
<title>אנשי קשר — צוות הישיבה</title>
<link rel="icon" href="../icons/favicon-32.8ac5f44c.png" sizes="32x32">
<!-- דף ציבורי ועצמאי: רשימת אנשי הקשר בלבד, מתוך ההגדרה contacts; אין בו קישור לאפליקציה ואין כניסה. -->
<script src="../app.config.js"></script>
<style>
:root{--brand:#1a3a6b;--deep:#0f2347;--bg:#f0f4fa;--card:#fff;--line:#d8e2f0;--text:#1a2340;--text-2:#4a5568;--text-3:#8a97b0;--wa:#1f9d55;--soft:#e8eef8}
@media (prefers-color-scheme:dark){:root{--bg:#0d151d;--card:#131e29;--line:#24333f;--text:#e8eef5;--text-2:#c2cfdc;--text-3:#93a5b8;--soft:#111d2a;--wa:#5fd394}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,var(--deep),var(--brand));color:#fff;padding:22px 16px 26px;text-align:center}
header img{height:58px;width:auto;display:block;margin:0 auto 10px}
header .bh{font-size:12px;opacity:.75;letter-spacing:.08em}
header h1{font-size:21px;font-weight:700;margin-top:4px}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.grp{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.grp h2{font-size:14px;font-weight:700;color:var(--brand);background:var(--soft);padding:10px 16px;border-bottom:1.5px solid var(--line)}
@media (prefers-color-scheme:dark){.grp h2{color:#7fb2f0}}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.who{flex:1;min-width:0}
.role{font-size:12px;color:var(--text-3);font-weight:600}
.name{font-size:15px;font-weight:700;margin-top:1px}
.mail{display:inline-block;font-size:13px;color:#2b6cb0;text-decoration:none;margin-top:3px;word-break:break-all}
@media (prefers-color-scheme:dark){.mail{color:#93c3f7}}
.acts{display:flex;align-items:center;gap:6px;flex-shrink:0}
.num{font-size:13px;color:var(--text-2);direction:ltr;margin-left:4px;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--card);color:var(--brand);text-decoration:none}
@media (prefers-color-scheme:dark){.ib{color:#7fb2f0}}
.ib.wa{color:var(--wa)}
.ib svg{width:19px;height:19px}
.foot{text-align:center;font-size:12.5px;color:var(--text-2);margin-top:6px}
.foot .y{margin-top:10px;font-weight:700;color:var(--brand)}
@media (prefers-color-scheme:dark){.foot .y{color:#7fb2f0}}
.msg{text-align:center;color:var(--text-2);padding:40px 0}
@media (max-width:420px){.num{display:none}}
</style>
</head>
<body>
<header>
  <img src="img/logo-white.png" alt="ישיבת תומכי תמימים ראשון לציון">
  <div class="bh">ב״ה, ימות המשיח</div>
  <h1>אנשי קשר — צוות הישיבה</h1>
</header>
<main id="list"><div class="msg">טוען…</div></main>
<script>
(function(){
  var IC={
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>',
    tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>'
  };
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  // מספר ישראלי לוואטסאפ — בלי האפס המוביל, עם קידומת 972
  function waNum(p){var d=String(p||'').replace(/\D/g,'');if(d.charAt(0)==='0')d='972'+d.slice(1);return d;}
  function telNum(p){return String(p||'').replace(/[^\d+]/g,'');}
  function render(v){
    var el=document.getElementById('list');
    var groups=(v&&Array.isArray(v.groups))?v.groups:[];
    if(!groups.length){el.innerHTML='<div class="msg">הרשימה ריקה</div>';return;}
    // שם שהוא שם של תפקיד («ראש הישיבה», «מנהל הלימודים») — בעל התפקיד, בשמו ובפרטיו, ובתפקיד שבשורה
    var holder={};
    groups.forEach(function(g){(g.rows||[]).forEach(function(r){if(r.role&&r.name&&!holder[r.role])holder[r.role]=r;});});
    el.innerHTML=groups.map(function(g){
      return '<section class="grp"><h2>'+esc(g.title)+'</h2>'+(g.rows||[]).map(function(r0){
        var h=holder[r0.name], r=h&&h!==r0?{role:r0.role,name:h.name,phone:r0.phone||h.phone,email:r0.email||h.email}:r0;
        var acts='';
        if(r.phone){
          var mob=/^05/.test(String(r.phone).replace(/\D/g,''));
          acts='<span class="num">'+esc(r.phone)+'</span>'+
            (mob?'<a class="ib wa" href="https://wa.me/'+waNum(r.phone)+'" target="_blank" rel="noopener" aria-label="וואטסאפ ל'+esc(r.name)+'">'+IC.wa+'</a>':'')+
            '<a class="ib" href="tel:'+telNum(r.phone)+'" aria-label="חיוג ל'+esc(r.name)+'">'+IC.tel+'</a>';
        }
        return '<div class="row"><div class="who"><div class="role">'+esc(r.role)+'</div><div class="name">'+esc(r.name)+'</div>'+
          (r.email?'<a class="mail" href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'')+'</div>'+
          '<div class="acts">'+acts+'</div></div>';
      }).join('')+'</section>';
    }).join('')+
    '<div class="foot">'+esc(v.footer||'')+'<div class="y">יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד!</div></div>';
  }
  var A=self.APP&&self.APP.supabase;
  if(!A){document.getElementById('list').innerHTML='<div class="msg">הרשימה אינה זמינה</div>';return;}
  fetch(A.url+'/rest/v1/hr_settings?select=value&key=eq.contacts',{headers:{apikey:A.key,Authorization:'Bearer '+A.key}})
    .then(function(r){return r.json();})
    .then(function(rows){var v=null;try{v=JSON.parse(rows[0].value);}catch(e){}render(v);})
    .catch(function(){document.getElementById('list').innerHTML='<div class="msg">אין חיבור — נסו שוב מאוחר יותר</div>';});
})();
</script>
</body>
</html>
