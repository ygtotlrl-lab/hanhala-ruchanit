function atSupNav(dir) {
  var hy=window._atSupHY, mi=window._atSupMI;
  mi+=dir;
  var curMax=(_hcBase(hy)||{ml:[]}).ml.length-1;
  if(mi<0){hy--;var pb=_hcBase(hy);if(!pb)return;mi=pb.ml.length-1;}
  if(mi>curMax){hy++;if(!_hcBase(hy))return;mi=0;}
  window._atSupHY=hy;window._atSupMI=mi;
  atRenderSupervision();
};

async function atRenderSupervision() {
  var el=document.getElementById('at-sup-content');
  if(!el) return;
  if(!hrSupervisionAccess()){
    el.innerHTML='<div class="empty-note">🔒 גישה לחניכים בכירים ומנהלים בלבד</div>';return;
  }
  /*  ⛔ מציג מיד ⛔ ומרענן ברקע — ⚠️ עד כאן המסך המתין לרשת
   *  **לפני** הציור הראשון, ⭐ ולכן גם ניווט בין חודשים — שאינו נוגע
   *  בנתונים כלל — נראה תקוע עד שהמשיכה חזרה. ⛔ והרענון עצמו לא בוטל:
   *  המשגיח חייב נתונים טריים, ⚠️ ומה שהשתנה הוא **הסדר**. */
  var cD=hrCachedArr('_atData','hr_sessions');
  var cT=hrCachedArr('_atTreats','hr_attend_treats');
  if(cD&&cT) _atSupPaint(el,cD,cT,'');
  else el.innerHTML='<div class="loading-note">⏳ טוען...</div>';
  /*  ⛔ שתי המשיכות במקביל ⛔ ולא בזו אחר זו — ⚠️ אין ביניהן תלות,
   *  ⭐ וההמתנה היא של האיטית מבין השתיים ⛔ ולא של סכומן. */
  var okA=await Promise.all([_atPullSessions(hrHebMonthWin(_atSupMonth(), window._atSupMI)), _atPullTreats()]);
  /*  ⛔ כשל משיכה מסומן גלוי ⛔ ולא בשקט — ⚠️ מסך שמציג נתון ישן בלי לומר
   *  זאת הוא הכשל השקט עצמו: ⭐ המשגיח מחליט על סמך מה שהוא רואה. */
  _atSupPaint(el, hrCachedArr('_atData','hr_sessions')||[],
                  hrCachedArr('_atTreats','hr_attend_treats')||[],
                  (okA[0]&&okA[1])?'':'⚠️ הרענון מהענן נכשל — המוצג הוא העותק שבמכשיר');
};

function _atSupPaint(el, rawData, rawTreats, warn) {
  // סדרים מחוקים לא נספרים בהשגחה
  var data=(rawData||[]).filter(function(r){ return !(r && r.deleted); });
  var students=hrSortStudents(getStudents());
  // טיפולים מחוקים (tombstones) לא מוצגים ולא נספרים
  var treats=atLiveTreats(rawTreats);

  _atSupMonth();
  var hy=window._atSupHY,mi=window._atSupMI;
  var mNames=_hcMN(hy);
  var mLabel=mNames[mi]+' '+_hcYL(hy);

  // בדיקת ניווט
  var curMax=(_hcBase(hy)||{ml:[]}).ml.length-1;
  var hasPrev=mi>0||!!_hcBase(hy-1);
  var hasNext=mi<curMax||!!_hcBase(hy+1);

  // כותרת ניווט
  var navStyle='sup-nav';
  var navHtml='<div class="sup-nav-bar">'+
    '<button data-act="at-sup-nav" data-dir="-1" class="'+navStyle+(hasPrev?'':' sup-nav-off')+'"'+(hasPrev?'':' disabled')+'>›</button>'+
    '<span class="sup-nav-label">'+mLabel+'</span>'+
    '<button data-act="at-sup-nav" data-dir="1" class="'+navStyle+(hasNext?'':' sup-nav-off')+'"'+(hasNext?'':' disabled')+'>‹</button>'+
  '</div>';
  if(warn) navHtml='<div class="warn-note">'+esc(warn)+'</div>'+navHtml;

  if(!data||!data.length){
    el.innerHTML=navHtml+'<div class="empty-note">אין נתונים עדיין</div>';return;
  }

  // חישוב סיכומים לחודש הנוכחי
  var stats={};
  students.forEach(function(s){stats[s.id]={name:s.name,cls:s.cls,absent:0,lateMin:0,records:[]};});
  data.forEach(function(rec){
    var dh=rec.date_heb;
    if(!dh||!dh.hy){var p=(rec.date_iso||'').split('-');if(p.length===3)dh=_hcH(new Date(+p[0],+p[1]-1,+p[2]));}
    if(!dh||dh.hy!==hy||dh.mi!==mi) return;
    Object.entries(hrMarks(rec)).forEach(function(e){
      var sid=e[0],m=e[1];
      if(!stats[sid]) return;
      // ספור רק חיסור (e/-) והיעדרות (x) — לא אישור/בבית/מנוחה
      if(m.s==='e' || m.s==='x'){
        stats[sid].absent++;
        stats[sid].records.push({recId:rec.id,session:rec.session,date_iso:rec.date_iso,date_heb:dh,mark:m.s,min:m.min||0});
      }
      if(m.s==='l'){
        stats[sid].lateMin+=m.min||0;
        stats[sid].records.push({recId:rec.id,session:rec.session,date_iso:rec.date_iso,date_heb:dh,mark:m.s,min:m.min||0});
      }
    });
  });

  /*  ⛔ הרשימה נבנית מסדר התלמידים ⛔ ולא מ-`Object.entries` — ⚠️ מפתח שנראה
   *  כמספר שלם מסודר ב-JS **מספרית** לפני כל שאר המפתחות, ⭐ ולכן השוויון
   *  בין שני תלמידים עם אותו מספר חיסורים נשבר לפי המזהה. */
  var rows=students.map(function(s){return [String(s.id), stats[s.id]];})
    .filter(function(e){return e[1]&&(e[1].absent>0||e[1].lateMin>0);})
    .sort(function(a,b){return (b[1].absent-a[1].absent)||b[1].lateMin-a[1].lateMin;});

  if(!rows.length){
    el.innerHTML=navHtml+'<div class="empty-note">אין חיסורים ב'+mLabel+'</div>';return;
  }

  // שמור רשומות לכל תלמיד (לכפתור 🔍)
  window._atSupRecords={};
  rows.forEach(function(e){window._atSupRecords[e[0]]=e[1].records||[];});

  var html=navHtml+'<div class="status-choice-list">';
  rows.forEach(function(e){
    var sid=e[0],st=e[1];
    var stuTreats=treats.filter(function(t){return String(t.sid)===String(sid);});
    // תאריך + יום הערה אחרונה
    var lastTreat=stuTreats.length?stuTreats.slice().sort(function(a,b){return HE.compare(b.date_iso||'',a.date_iso||'');})[0]:null;
    var lastHtml='';
    if(lastTreat){
      var ltHd=lastTreat.date_heb;
      var ltIso=lastTreat.date_iso||'';
      var ltDateStr=ltHd?_hcFmt(ltHd.hy,ltHd.mi,ltHd.day):ltIso;
      lastHtml='<span class="badge-ok">📝 יום '+atDow(ltIso)+' '+esc(ltDateStr)+'</span>';
    }
    var alert20=st.absent>=20?'<span class="badge-bad">⚠️ 20+</span>':'';
    var alert300=st.lateMin>=300?'<span class="badge-warn">⏰ 300+</span>':'';
    var clsLabel=st.cls==='a'?'א':st.cls==='b'?'ב':st.cls==='g'?'ג':st.cls||'';
    var cardId='sup-card-'+sid;
    html+='<div id="'+cardId+'" class="sup-card-pane sup-card">';
    html+='<div class="sup-card-head" data-act="toggle-next" data-chev="sup-chev">';
    html+='<div class="sup-card-class">'+esc(clsLabel)+'</div>';
    html+='<div class="rec-main"><div class="rec-title">'+esc(st.name)+alert20+alert300+'</div>'+(lastHtml?'<div class="rec-last">'+lastHtml+'</div>':'')+'</div>';
    html+='<div class="sup-card-stats">';
    html+='<span class="rec-abs">חיסורים: <b>'+st.absent+'</b></span>';
    html+='<span class="rec-late">איחורים: <b>'+st.lateMin+'</b>ד׳</span>';
    html+='<span class="rec-muted">טיפולים: <b>'+stuTreats.length+'</b></span>';
    html+='<button data-act="at-sup-detail" data-id="'+esc(sid)+'" class="sup-detail-btn">🔍 פירוט</button>';
    html+='</div>';
    html+='<span class="sup-chev-icon sup-chev">›</span>';
    html+='</div>';
    // פאנל פרטים
    html+='<div class="sup-card-body hidden">';
    html+='<div class="treat-add">';
    html+='<div class="panel-head-sm">➕ הוסף טיפול</div>';
    html+='<div class="chip-row ksave">';
    var cfg=window._atCfg||atDefaultCfg();
    html+='<select aria-label="סוג הטיפול" id="at-treat-type-'+sid+'" class="treat-select">'+
      cfg.treats.map(function(t){return '<option>'+esc(t)+'</option>';}).join('')+'</select>';
    html+='<input aria-label="הערה (אופציונלי)" id="at-treat-note-'+sid+'" placeholder="הערה (אופציונלי)" class="treat-note-input">';
    html+='<button data-act="at-add-treat" data-ksave data-id="'+esc(sid)+'" class="treat-save-btn">שמור</button>';
    html+='</div></div>';
    if(stuTreats.length){
      html+='<div class="panel-head-sm">📋 היסטוריית טיפולים</div>';
      html+=stuTreats.slice().reverse().map(function(t){
        var hd=t.date_heb;
        var dl=hd?_hcFmt(hd.hy,hd.mi,hd.day):t.date_iso;
        return '<div class="treat-row">'+
          '<span class="rec-muted">'+esc(dl)+'</span>'+
          '<span class="treat-type">'+esc(t.type)+'</span>'+
          (t.note?'<span class="rec-muted">— '+esc(t.note)+'</span>':'')+
          '<span class="gap"></span>'+
          '<span class="unit-hint">'+esc(t.by_name)+'</span>'+
          '<button data-act="at-del-treat" data-id="'+esc(t.id)+'" class="treat-del-btn">✕</button>'+
        '</div>';
      }).join('');
    }
    html+='</div></div>';
  });
  html+='</div>';
  el.innerHTML=html;
};

/* ══════════════════════════════════════════════════════════════════════════

async function atAddTreat(sid) {
  var typeEl=document.getElementById('at-treat-type-'+sid);
  var noteEl=document.getElementById('at-treat-note-'+sid);
  if(!typeEl) return;
  var now=new Date();
  var rec={
    id:Date.now()+'_'+Math.random().toString(36).substr(2,5),
    sid:sid,
    date_iso:dayToday(),
    date_heb:_hcH(now),
    type:typeEl.value,
    note:noteEl?noteEl.value:'',
    by:AUTH.user?AUTH.user.client_id:'',
    by_name:AUTH.user?AUTH.user.full_name:'',
    created_at:now.toISOString(),
    updatedAt:now.getTime() // חובה למיזוג — רשומה בלי updatedAt נחשבת legacy ונופלת
  };
  var treats=await atLoadTreats();
  treats.push(rec);
  // ⚠️ סימון ⏳ נרשם לפני הדחיפה; `atSaveTreats` מאשרת רק אם הכתיבה לענן הצליחה.
  pendMark(PK_AT_TREAT+rec.id);
  await atSaveTreats(treats);
  if(noteEl) noteEl.value='';
  atRenderSupervision();
  toast(MSG_CARE_SAVED, null, 'good');
};

function atDeleteTreat(id) {
  ask(MSG_DEL_CARE_TITLE, MSG_DEL_CARE_BODY, MSG_DELETE)
    .then(function (yes) { if (yes) atDeleteTreatConfirmed(id); });
};

async function atDeleteTreatConfirmed(id) {
  closeModal();
  var treats=await atLoadTreats();
  // tombstone ולא filter פיזי: רשומה שנעלמת מהמערך בלי סימון חוזרת מהענן
  // במיזוג הבא (hrMergeRecords מחזיר כל רשומה מרוחקת שאין לה מקבילה מקומית).
  var ts=Date.now(), by=hrWho(), found=false;
  treats.forEach(function(t){
    if(!t||String(t.id)!==String(id)||t.deleted) return;
    t.deleted=true; t.updatedAt=ts; t.deletedBy=by; found=true;
  });
  if(!found){ toast(MSG_CARE_MISSING, null, 'bad'); atRenderSupervision(); return; }
  pendMark(PK_AT_TREAT+id);   // מחיקה היא כתיבה — ממתינה לאישור כמו כל שינוי
  await atSaveTreats(treats);
  atRenderSupervision();
  toast(MSG_DELETED_MARK, null, 'good');
};

// -------- פירוט חודשי לתלמיד (🔍) --------
var ARC_LBL_DET={p:'נוכח',l:'איחור',e:'חיסור',x:'היעדרות',ap:'אישור',ak:'בבית',a:'מנוחה'};

function atSupDetail(sid) {
  var students=getStudents();
  var st=students.find(function(s){return String(s.id)===String(sid);});
  var name=st?st.name:'תלמיד';
  var records=(window._atSupRecords&&window._atSupRecords[sid])||[];

  var rowsHtml='';

function atCheckAlert() {
  // סדרים מחוקים לא מפעילים את התראת הסף
  var data=(window._atData||[]).filter(function(r){ return !(r && r.deleted); });
  var students=getStudents();
  if(!data.length) return;

  var todH=_hcH(new Date());
  var curHY=todH.hy, curMI=todH.mi;
  // חישוב תחילת חודש — חצות מקומית (לא צהריים) כדי לא לפסול רשומות מה-1 בחודש
  // new Date("2026-04-28") = UTC midnight = 03:00 Israel, קטן מ-12:00 מקומי
  var _mG=_hcG(curHY,curMI,1);
  var monthBeg=new Date(_mG.getFullYear(),_mG.getMonth(),_mG.getDate(),0,0,0);
  console.log('[atCheckAlert] חודש עברי:', _hcMN(curHY)[curMI], curHY,
    '| תחילת חודש גרגוריאנית:', monthBeg.toISOString(),
    '| רשומות סה"כ:', data.length);

  var alerts=[];
  var stats={};
  students.forEach(function(s){stats[s.id]={name:s.name,absent:0,lateMin:0};});
  data.forEach(function(rec){
    if(new Date(rec.date_iso)<monthBeg) return;
    Object.entries(hrMarks(rec)).forEach(function(e){
      var sid=e[0],m=e[1];
      if(!stats[sid]) return;
      if(m.s==='e'||m.s==='x') stats[sid].absent++;
      if(m.s==='l') stats[sid].lateMin+=m.min||0;
    });
  });
  Object.values(stats).forEach(function(s){
    if(s.absent>=20||s.lateMin>=300) alerts.push(s);
  });
  if(!alerts.length) return;

  var listHtml=alerts.slice(0,10).map(function(s){
    return '<div class="alert-row">'+esc(s.name)+
      (s.absent>=20?'<span class="alert-abs"> — '+s.absent+' חיסורים</span>':'')+
      (s.lateMin>=300?'<span class="alert-late"> — '+s.lateMin+' דק׳ איחור</span>':'')+
      '</div>';
  }).join('');
  openModal(MSG_ABSENCE_ALERT,
    '<p class="alert-lead">התלמידים הבאים חרגו מהסף מתחילת החודש:</p>'+
    '<div class="alert-list">'+listHtml+'</div>',
    '<button data-act="modal-close" class="alert-ok">הבנתי</button>');
}

async function atSaveSettingsCfg() {
  var cfg=window._atCfg||atDefaultCfg();
  var oldSessions=(cfg.sessions||[]).slice();
  // קרא סדרים
  var sc=document.getElementById('at-cfg-sessions');
  if(sc){
    var newSess=[];
    sc.querySelectorAll('[data-sess-row]').forEach(function(row,i){
      var nameInp=row.querySelector('[data-sess-name]');
      var timeInp=row.querySelector('[data-sess-time]');
      var name=(nameInp?nameInp.value.trim():''); if(!name) return;
      /*  ⛔ סדר באותו שם אינו נאסף פעמיים — ⚠️ השם הוא הזהות כאן,
       *  ⭐ והשורה השנייה הייתה מקבלת את **אותו** `id` מהקיים. */
      if(uniqHas(newSess, {name:name}, function(x){return x.name;})) return;
      var startTime=(timeInp?timeInp.value.trim():'');
      var existing=oldSessions.find(function(s){return s.name===name;});
      var entry={id:existing?existing.id:('s_'+Date.now()+'_'+i),name:name};
      if(startTime) entry.startTime=startTime;
      newSess.push(entry);
    });
    cfg.sessions=newSess;
  }
  // קרא טיפולים
  var tc=document.getElementById('at-cfg-treats');
  if(tc){
    var newTreats=[];
    // ⛔ טיפול באותו שם אינו נאסף פעמיים — הרשימה מזינה בורר, ושתי אפשרויות
    //    זהות בו אינן ניתנות להבחנה
    tc.querySelectorAll('input').forEach(function(inp){
      var v=inp.value.trim();
      if(!v||uniqHas(newTreats, v)) return;
      newTreats.push(v);
    });
    cfg.treats=newTreats;
  }
  window._atCfg=null; // כפיית טעינה מחדש
  await atSaveCfg(cfg);
  window._atCfg=cfg;
  toast(MSG_SETTINGS_SAVED, null, 'good');
};

function _hrCleanCfg(cfg) {

// ⛔ אין «ניקוי» שמתאים רשומות **לפי שם הסדר** — ⚠️ סדר לגיטימי בשם כזה
// מסומן למחיקה, ⭐ ו-hrSaveData ממזג עם הענן, כך שהרשומות «המנוקות» חוזרות
// מיד. ⛔ מחיקה = tombstone מפורש בלבד.
async function hrSaveData(data) {
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק אחרי כל המתנה — ⚠️ הרישום שאחרי
   *  ה-`await` הוא מה שנזקף לחשבון ההקשר, ⭐ ומשתמש שהתחלף באמצע
   *  היה מקבל לחשבונו את הצלחת הדחיפה של הקודם. */
  var _ep = ctxEpoch();
  var _t0=Date.now();   // ראה ההערה ב-atSaveData
  window._hrData=data;
  _hrSlDiskSave(data);
  try {
    // מיזוג עם הענן לפני כתיבה — לא דורסים רשומות של מכשיר אחר
    var _hrLocalN=hrCount(data);
    var _hrRemote=null; try { _hrRemote=await hrCloudGet('hr_sleep_sessions'); } catch(eR){}
    if (Array.isArray(_hrRemote)) {
      data=_hrSessionsMerge(_hrRemote, data, 'hr_sleep_sessions');
      window._hrData=data;
      _hrSlDiskSave(data);
    }
    /* ⛔ שכבת השורות היא הכתיבה ⛔ ולא עותק שני שלה — ⚠️ עד כאן ה-`kv`
       היה המאסטר והטבלאות בצל: ⭐ מרגע שהשקילות נמדדה, ⛔ כתיבה שנייה
       לערך שלם היא מקור אמת שני, ⚠️ ומיזוג בין השניים הוא הכרעה בלי
       מפתח. ⛔ ומערך ריק אינו כישלון — ⚠️ הוא «אין מה לדחוף». */
    var _rSl=await pushTable('hr_sleep_sessions',data);
    if(!(_rSl&&_rSl.ok)&&hrCount(data)) { _hrQueueAdd('hr_sleep_sessions',data); hrUpdateQueueBadge(); }
    if(_rSl&&_rSl.ok&&!ctxStale(_ep)) pendConfirmPush(PK_SL_SESS,_t0);
    hrSyncLog('push','hr_sleep_sessions',hrCount(data),{local_count:_hrLocalN,remote_count:hrCount(_hrRemote),result_count:hrCount(data)});
    await hrTouchLastChanged();
  } catch (e) { hrWriteFail('hrSaveData', e); }
}

async function hrSaveTreats(data) {

   *  ה-`await` הוא מה שנזקף לחשבון ההקשר, ⭐ ומשתמש שהתחלף באמצע
   *  היה מקבל לחשבונו את הצלחת הדחיפה של הקודם. */
  var _ep = ctxEpoch();

function _hrPaintReg() {
  // בורר תאריך — תאריך לוגי (לפני 12:00 = אמש)
  var dw=document.getElementById('sl-date-wrap');
  if(dw){

function hrAutoMark(student, sessDateIso, sessStartTime) {
  // בנה תאריך עזר מזמן הסדר (כמו atAutoMark) — כדי לבדוק סטטוסים לפי זמן הסדר ולא שעון-קיר
  var sessRef = null;
  if (sessDateIso) { sessRef = new Date(sessDateIso + 'T' + (sessStartTime || '12:00') + ':00'); }
  var aa=getActiveAbsences(student, sessRef);
  if(!aa||!aa.length) return null;
  for(var i=0;i<aa.length;i++){
    var t=aa[i].type;
    if(t==='suspended'||t==='left') return 'ak';
    if(t==='approved'){
      if(!sessDateIso) return 'ap';
      var fromDate=aa[i].from?(aa[i].from.split('T')[0]):'';
      var toDate=aa[i].to?(aa[i].to.split('T')[0]):'';
      if(fromDate&&sessDateIso<fromDate) continue;
      if(toDate&&sessDateIso>toDate) continue;
      if(sessStartTime){
        if(fromDate&&sessDateIso===fromDate){
          var fromTime=aa[i].from&&aa[i].from.indexOf('T')>=0?aa[i].from.split('T')[1].substr(0,5):'00:00';
          if(sessStartTime<fromTime) continue;
        }
        if(toDate&&sessDateIso===toDate){
          var toTime=aa[i].to&&aa[i].to.indexOf('T')>=0?aa[i].to.split('T')[1].substr(0,5):'23:59';
          if(sessStartTime>toTime) continue;
        }
      }
      return 'ap';
    }
  }
  return null;
}


/* ══════════════════════════════════════════════════════════════════════════

function hrRenderTodaySessions() {
  var el=document.getElementById('sl-today-sessions');
  if(!el) return;
  var data=window._hrData||[];
  var selIso=(document.getElementById('sl_date_iso')||{}).value;
  var logIso=hrGetLogicalDate();
  var filterIso=selIso||logIso;
  var isToday=filterIso===dayToday();
  var isLogical=filterIso===logIso;
  var cfg=window._hrCfg||hrDefaultCfg();
  var sessOrder={};
  hrSortedSessions(cfg).forEach(function(s,i){sessOrder[s.name]=i;});
  var daySess=data.filter(function(r){return !r.deleted&&r.date_iso===filterIso;})
    .slice().sort(function(a,b){
      var ia=sessOrder[a.session]!=null?sessOrder[a.session]:999;
      var ib=sessOrder[b.session]!=null?sessOrder[b.session]:999;
      return ia-ib;
    });
  if(!daySess.length){el.innerHTML='';return;}
  var dowLabel=isToday?'היום':(isLogical&&!isToday?'אמש':'יום '+hrDow(filterIso));
  var html='<div class="day-sess-block">'+
    '<div class="day-sess-title">📋 דוחות שמולאו '+dowLabel+':</div>'+
    '<div class="reason-list">';
  daySess.forEach(function(rec){
    var cnts={};
    Object.values(hrMarks(rec)).forEach(function(m){if(m.s)cnts[m.s]=(cnts[m.s]||0)+1;});
    var summaryHtml=hrSummaryHtml(cnts);
    html+='<div data-act="sl-edit-session" data-id="'+esc(rec.id)+'" class="day-sess-row">'+
      '<span class="day-sess-name">'+esc(rec.session)+'</span>'+
      pendTag(PK_SL_SESS+rec.id)+
      '<div class="day-sess-summary">'+summaryHtml+'</div>'+
      '<span class="day-sess-edit">✏️ ערוך</span>'+
    '</div>';
  });
  html+='</div></div>';
  el.innerHTML=html;
}

/*  ⛔ הרשומה נקראת מהמטמון ⛔ ואין המתנה לרשת — ⚠️ הכפתור שנלחץ צויר
 *  מאותו עותק בדיוק, ⭐ ולכן הרשומה נמצאת בו בוודאות: ⛔ `await` כאן היה
 *  משהה את פתיחת הסדר עד שהרשת עונה. */
async function hrEditSession(recId) {
  var data=hrCachedArr('_hrData','hr_sleep_sessions')||[];
  var rec=data.find(function(r){return idEq(r.id,recId);});
  if(!rec) return;
  window._hrMarks={};window._hrPending={};window._hrCleared={};
  Object.entries(hrMarks(rec)).forEach(function(e){
    var sid=e[0],m=e[1];
    if(m.s){window._hrMarks[sid]={s:m.s,min:m.min||0,note:m.note||''};window._hrCleared[sid]=true;}
  });
  // רענון אישורים לתלמידים ללא סימון — לפי השעה הנוכחית
  try {
    var _nowT2=new Date();
    var _hhmm2=('0'+_nowT2.getHours()).slice(-2)+':'+('0'+_nowT2.getMinutes()).slice(-2);
    // עדיפות ל-startTime של הסדר מההגדרות; שעה נוכחית רק כנפילה-חזרה
    var _cfgS2=(window._hrCfg&&Array.isArray(window._hrCfg.sessions))?window._hrCfg.sessions:[];
    for(var _ci2=0;_ci2<_cfgS2.length;_ci2++){ if(_cfgS2[_ci2].name===rec.session&&_cfgS2[_ci2].startTime){_hhmm2=_cfgS2[_ci2].startTime;break;} }
    var _apChanged2=false;
    getStudents().forEach(function(st){
      if(st.active===false) return;
      var k=String(st.id);
      if(window._hrMarks[k]&&window._hrMarks[k].s) return;
      var am=atAutoMark(st, rec.date_iso, _hhmm2);
      if(am){
        window._hrMarks[k]={s:am,min:0,note:''};
        window._hrCleared[k]=true;
        if(!rec.marks) rec.marks={};
        rec.marks[k]={s:am,min:0,note:''};
        _apChanged2=true;
      }
    });
    if(_apChanged2){
      rec.updatedAt=Date.now();
      _hrSlDiskSave(data);
      window._hrData=data;
      hrSaveData(data);
    }
  } catch(eAp2){ console.warn('[approval-refresh:sl-edit]', eAp2); }
  var dw=document.getElementById('sl-date-wrap');
  if(dw&&rec.date_heb) dw.innerHTML=_hcBuild('sl_date',rec.date_heb);
  var fl=document.getElementById('sl-filler');
  if(fl) fl.value=rec.filled_by_name||'';
  window._hrPendingRec=null;
  window._hrCurrentSessionId=recId;
  var hdr=document.getElementById('sl-reg-header');
  if(hdr) hdr.innerHTML=
    '<span class="rec-title">'+esc(rec.session)+'</span>'+
    '<span class="rec-date">'+_hcFmt(rec.date_heb.hy,rec.date_heb.mi,rec.date_heb.day)+'</span>';
  document.getElementById('sl-reg-picker').classList.add('hidden');
  document.getElementById('sl-reg-list').classList.remove('hidden');
  hrRenderStudents();
};

async function hrOpenSession(sessId, sessName) {
  if(window._hrCurrentSessionId){toast(MSG_CLOSE_REPORT_FIRST, null, 'bad');return;}
  var dateIso=(document.getElementById('sl_date_iso')||{}).value||hrGetLogicalDate();
  if(!dateIso){toast(MSG_PICK_DATE_FIRST, null, 'bad');return;}

  // ⛔ ההמתנה מכוונת — ⚠️ והחיווי מהניתוב, כמו בפתיחת סדר נוכחות
  // ⛔ ר' הנימוק ב-atOpenSession — משיכה אחת מסוננת ליום שנבחר
  await _hrPullSessions(hrDayWin(dateIso));
  var allData=window._hrData||[];
  var existing=atFindLiveSession(allData,sessName,dateIso);
  if(existing){
    openModal(MSG_REPORT_DONE,
      '<p class="md-note-center">'+esc(sessName)+' כבר מולא היום.<br>האם לפתוח לעריכה?</p>',
      '<button data-act="modal-close" class="md-btn-ghost">ביטול</button>'+
      '<button data-act="sl-resume-go" data-id="'+esc(existing.id)+'" class="md-btn-primary">ערוך</button>');
    return;
  }

  var _oCfg=window._hrCfg||hrDefaultCfg();
  var _oSessObj=_oCfg.sessions.find(function(s){return s.name===sessName||idEq(s.id, sessId);});
  var _oSessTime=_oSessObj&&_oSessObj.startTime?_oSessObj.startTime:'';
  var students=hrSortStudents(getStudents());
  window._hrMarks={};window._hrPending={};window._hrCleared={};
  students.filter(function(s){return s.active!==false;}).forEach(function(s){
    var am=hrAutoMark(s,dateIso,_oSessTime);
    if(am) window._hrMarks[s.id]={s:am,min:0,note:''};
  });

  var filler=document.getElementById('sl-filler');
  var dateHeb=_hcH(new Date(dateIso));
  var initMarks={};
  students.filter(function(s){return s.active!==false;}).forEach(function(s){
    var m=window._hrMarks[s.id];
    initMarks[String(s.id)]={s:m?m.s:'',min:0,note:''};
  });
  var rec={
    id:Date.now()+'_'+Math.random().toString(36).substr(2,5),
    session:sessName,
    date_iso:dateIso,
    date_heb:dateHeb,
    filled_by:AUTH.user?AUTH.user.client_id:'',
    filled_by_name:filler?filler.value:(AUTH.user?AUTH.user.full_name:''),
    marks:initMarks,
    created_at:new Date().toISOString(),
    updatedAt:Date.now(),
    createdBy:hrWho(),
    open:true
  };

  // מניעת רישומי רפאים: הרשומה תישמר רק בסימון הראשון בפועל (hrMarkDirty)
  // ⛔ ואין כאן קריאת טעינה שנייה — ר' הנימוק ב-atOpenSession
  window._hrPendingRec=rec;
  window._hrCurrentSessionId=rec.id;

  _hrMountOpenSession(sessName, dateHeb);
};
/*  ⛔ ההרכבה נפרדת מהבדיקה — ⚠️ הפתיחה **חייבת** להמתין למשיכה: ⭐ היא
 *  מחליטה אם נוצרת רשומה שנייה לאותו סדר, ⛔ וציור לפני התשובה היה פותח
 *  מסך רישום על סדר שכבר קיים במכשיר אחר. ⛔ ולכן ההמתנה אינה במסלול
 *  הציור — ⚠️ ההרכבה עצמה סינכרונית. */
function _hrMountOpenSession(sessName, dateHeb) {
  var hdr=document.getElementById('sl-reg-header');
  if(hdr) hdr.innerHTML=
    '<span class="rec-title">'+esc(sessName)+'</span>'+
    '<span class="rec-date">'+_hcFmt(dateHeb.hy,dateHeb.mi,dateHeb.day)+'</span>';

}

// שמירה מקומית מיידית (ללא רשת)
function hrSaveLocalNow() {
  if(!window._hrCurrentSessionId||!window._hrData) return null;
  var rec=window._hrData.find(function(r){return idEq(r.id,window._hrCurrentSessionId);});
  if(!rec) return null;
  var marks={};
  getStudents().forEach(function(s){
    if(s.active===false) return;
    var m=window._hrMarks[s.id];
    marks[s.id]=m?{s:m.s,min:m.s==='l'?(m.min||0):0,note:m.note||''}:{s:'',min:0,note:''};
  });
  rec.marks=marks;
  rec.updatedAt=Date.now();
  // מסלול קריטי — רישום זמן שינה. אותה סמנטיקה כמו atSaveLocalNow.
  if(!_hrSlDiskSave(window._hrData)) return null;
  pendMark(PK_SL_SESS + rec.id);
  return rec;
}
async function hrAutoSaveNow() {
  if(hrSaveLocalNow()===null) return;
  await hrSaveData(window._hrData);
}
// כל סימון: שמירה מקומית מיידית + דחיפה מרוכזת לענן (debounce)
function hrMarkDirty() {
  // סימון ראשון בפועל — ממש את רשומת הסשן הממתינה (מניעת רישומי רפאים)
  if(window._hrPendingRec && idEq(window._hrCurrentSessionId,window._hrPendingRec.id)){
    if(!window._hrData) window._hrData=[];
    // ⛔ אותה הגנה כמו בנוכחות — נקודת היצירה בפועל, לא הפתיחה.
    var _hrDup=atFindLiveSession(window._hrData,window._hrPendingRec.session,
                                 window._hrPendingRec.date_iso,window._hrPendingRec.id);
    if(_hrDup){
      hrAdoptSession(_hrDup);
      toast(MSG_REPORT_OPEN_ELSEWHERE, null, 'bad');
    } else if(!window._hrData.some(function(r){return r&&idEq(r.id,window._hrPendingRec.id);})) {
      window._hrData.push(window._hrPendingRec);
    }
    window._hrPendingRec=null;
  }
  hrSaveLocalNow();
  clearTimeout(window._hrSaveTimer);
  window._hrSaveTimer=setTimeout(hrAutoSaveNow,3000);
}

function hrShowOverrideDialog(sid, student) {

    '<button data-act="modal-close" class="md-btn-close">סגור</button>'+
    '<button data-act="sl-status-cancel" data-id="'+esc(sid)+'" class="md-btn-danger">בטל סטטוס</button>');
}

/*  ⛔ ביטול סטטוס מתוך לשונית הרישום — ⚠️ הקורא הוא `sl-status-cancel`,
 *  ⛔ ואין להסירה בלי להסיר גם אותו: כפתור שקורא לשם שאינו מוגדר זורק,
 *  ⭐ והמודאל נסגר — והמשגיח קורא את הסגירה כהצלחה. */
function hrCancelStudentStatusFromReg(sid) {
  var students=getStudents();
  var s=students.find(function(x){return idEq(x.id, sid);});
  if(!s) return;
  s.status=null; s.statusReason=null; s.statusFrom=null; s.statusTo=null;
  // tombstone לכל היעדרות (deleted=true+updatedAt) במקום ריקון פיזי — מונע תחיית-מתים במיזוג
  if(Array.isArray(s.absences)) s.absences.forEach(function(a){ a.deleted=true; a.updatedAt=Date.now(); a.deletedBy=hrWho(); });
  s.present=true;
  s.updatedAt=Date.now();
  saveStudents(students);
  schedulePush();
  delete window._hrMarks[sid];
  delete window._hrCleared[sid];
  delete window._hrPending[sid];
  hrMarkDirty();
  hrRenderStudents();
  renderStudents();
  toast(MSG_STATUS_REVERTED+s.name, null, 'good');
};

function hrApplyMark(sid, code) {
  var s=String(sid);
  var existNote=(window._hrMarks[s]||{}).note||'';
  window._hrMarks[s]={s:code,min:code==='l'?null:0,note:existNote};
  window._hrCleared[s]=true;
  window._hrPending[s]=true;
  hrRenderStudents();
  if(code!=='l'){
    setTimeout(function(){
      delete window._hrPending[s];
      hrRenderStudents();
    },600);
  }
  hrMarkDirty();
};

function hrConfirmLate(sid) {
  var s=String(sid);
  var inp=document.getElementById('sl-min-'+sid);
  var val=readNum(inp, 0);
  if(!val||val<=0){toast(MSG_NEED_MINUTES, null, 'bad');return;}
  if(val>30){toast(MSG_LATE_OVER_30, null, 'bad');return;}
  hrSetLateMin(sid,val);
  delete window._hrPending[s];
  hrRenderStudents();
  hrMarkDirty();
};

/* ══════════════════════════════════════════════════════════════════════════
   שינה — רשימת התלמידים שבסדר וכפתורי הסימון
   ══════════════════════════════════════════════════════════════════════════ */
function hrRenderStudents() {
  var el=document.getElementById('sl-students');
  if(!el) return;
  var students=hrSortStudents(getStudents());
  if(!students||!students.length){el.innerHTML='<div class="empty-note">אין תלמידים</div>';return;}

  var active=students.filter(function(s){return s.active!==false;});
  var unmarked=[], marked=[];
  active.forEach(function(s){
    var cur=window._hrMarks[s.id];
    var isPending=!!window._hrPending[s.id];
    if(cur&&cur.s&&!isPending) marked.push(s);
    else unmarked.push(s);
  });

  var bs='mark-btn';
  function mkBtn(sid,code,label){
    var cur=(window._hrMarks[sid]||{}).s;
    var isOn=(cur===code);
    var cls=bs+' '+atvCls(code)+(isOn?' mark-on':' mark-off');
    return '<button data-act="sl-set-mark" data-id="'+esc(sid)+'" data-code="'+esc(code)+'" class="'+cls+'">'+label+'</button>';
  }
  function mkClearBtn(sid){
    return '<button data-act="sl-clear-mark" data-id="'+esc(sid)+'" title="נקה סימון" '+
      'class="at-clear-btn clr-btn">✕</button>';
  }

  function renderRow(s, isMark) {
    var marks=window._hrMarks[s.id]||{};
    var isLate=marks.s==='l';
    var hasMark=!!(marks.s);
    var cls=s.cls==='a'?'א':s.cls==='b'?'ב':s.cls==='g'?'ג':s.cls||'';
    var autoHintHtml='';
    var am=hrAutoMark(s);
    if(am&&isMark&&!window._hrCleared[s.id]){
      var aLbl=am==='ap'?'באישור':am==='ak'?'נעדר ידוע':'';
      if(aLbl) autoHintHtml='<span class="mark-hint">('+aLbl+')</span>';
    }
    var isPendingLate=isLate&&!!window._hrPending[String(s.id)];
    var lateFieldHtml=isLate?
      '<div class="late-field">'+
        '<input aria-label="דק׳" type="text" inputmode="numeric" maxlength="2" value="'+(marks.min!=null?marks.min:'')+'" id="sl-min-'+s.id+'" placeholder="דק׳" '+
        'data-inp="sl-late" data-kent="sl-late" data-id="'+esc(s.id)+'" '+
        ' class="late-input">'+
        '<span class="unit-hint">דק׳</span>'+
        (isPendingLate?'<button data-act="sl-confirm-late" data-id="'+esc(s.id)+'" class="late-ok-btn">✓ אשר</button>':'')+
      '</div>':'';
    var noteVal=esc(marks.note||'');
    var noteField='<input aria-label="הערה" type="text" placeholder="הערה" value="'+noteVal+'" '+
      'id="sl-note-'+s.id+'" '+
      'data-inp="sl-note" data-id="'+esc(s.id)+'" '+
      ' class="late-min-inp">';
    var rowBg=isMark?'mark-row-on':'mark-row';
    return '<div class="'+rowBg+' mark-line">'+
      '<div class="at-row-class">'+esc(cls)+'</div>'+
      '<div class="at-row-name">'+esc(s.name)+autoHintHtml+'</div>'+
      lateFieldHtml+
      noteField+
      '<div class="at-row-marks">'+
        (hasMark?mkClearBtn(s.id):'')+
        mkBtn(s.id,'p','✓')+
        mkBtn(s.id,'l','איחור')+
        mkBtn(s.id,'e','-')+
        mkBtn(s.id,'x','x')+
        mkBtn(s.id,'ap','א')+
        mkBtn(s.id,'ak','ב')+
        mkBtn(s.id,'a','ג')+
      '</div>'+
    '</div>';
  }

  var html='';
  if(unmarked.length) html+=unmarked.map(function(s){return renderRow(s,false);}).join('');
  if(marked.length){
    html+='<div class="at-group-sep">'+
      '<span class="rule-line"></span>סומנו<span class="rule-line"></span></div>';
    html+=marked.map(function(s){return renderRow(s,true);}).join('');
  }
  el.innerHTML=html||'<div class="empty-note">אין תלמידים פעילים</div>';
};

function hrSetMark(sid, code) {
  var student=getStudents().find(function(s){return String(s.id)===String(sid);});
  var curRec=window._hrData&&window._hrCurrentSessionId?
    window._hrData.find(function(r){return idEq(r.id,window._hrCurrentSessionId);}):null;
  var sessDateIso=curRec?curRec.date_iso:null;
  var _cfg=window._hrCfg||hrDefaultCfg();
  var sessObj=curRec?(_cfg.sessions||[]).find(function(s){return s.name===curRec.session;}):null;
  var sessTime=sessObj&&sessObj.startTime?sessObj.startTime:'';
  var autoM=student?hrAutoMark(student,sessDateIso,sessTime):null;
  var cur=window._hrMarks[sid];
  if(autoM&&cur&&cur.s===autoM&&!window._hrCleared[sid]){
    hrShowOverrideDialog(sid,student);
    return;
  }
  hrApplyMark(sid,code);
};

function hrClearMark(sid) {
  var existNote=(window._hrMarks[sid]||{}).note||'';
  delete window._hrMarks[sid];
  if(existNote) window._hrMarks[sid]={s:'',min:0,note:existNote};
  delete window._hrPending[sid];
  window._hrCleared[sid]=true;
  hrRenderStudents();
  hrMarkDirty();
};

function hrSetLateMin(sid, val) {
  var n=parseInt(val)||0;
  if(n<0)n=0;if(n>30)n=30;
  if(!window._hrMarks[sid])window._hrMarks[sid]={s:'l',min:n,note:''};
  else window._hrMarks[sid].min=n;
  hrMarkDirty();
};

function hrSetNote(sid, val) {
  var s=String(sid);
  if(!window._hrMarks[s]) window._hrMarks[s]={s:'',min:0,note:''};
  window._hrMarks[s].note=val;
  hrMarkDirty();
};

async function hrCloseSession() {
  clearTimeout(window._hrSaveTimer);
  // "שמור וסגור" = סימון הסשן כסגור (open=false)
  var _cRec=window._hrData&&window._hrData.find(function(r){return idEq(r.id,window._hrCurrentSessionId);});
  if(_cRec){_cRec.open=false;}
  await hrAutoSaveNow();
  var rec=window._hrData&&window._hrData.find(function(r){return idEq(r.id,window._hrCurrentSessionId);});
  var msg=rec?('✅ '+rec.session+' — '+_hcFmt(rec.date_heb.hy,rec.date_heb.mi,rec.date_heb.day)+' נשמר'):'✅ הבדיקה נשמרה';
  window._hrCurrentSessionId=null;
  window._hrMarks={};
  window._hrPendingRec=null;
  document.getElementById('sl-reg-list').classList.add('hidden');
  document.getElementById('sl-reg-picker').classList.remove('hidden');
  hrRenderTodaySessions();
  toast(msg, null, 'good');
};

/*  ⛔ מציג מיד ⛔ ומרענן ברקע — ⚠️ עד כאן הארכיון המתין למשיכה לפני הציור
 *  הראשון, ⛔ ולכן ניווט אליו נראה תקוע עד שהרשת חזרה. ⛔ וקורא שמסר
 *  רשומות מקבל אותן כפי שהן — ⚠️ הוא כבר סינן, ⭐ ורענון היה דורס אותו. */
async function hrRenderArchive(records) {
  var el=document.getElementById('sl-arc-list');
  if(!el) return;
  if(records){ _hrPaintArchive(el, records, ''); return; }
  _hrPaintArchive(el, hrCachedArr('_hrData','hr_sleep_sessions')||[], '');
  var _okArc=await _hrPullSessions(hrHebYearWin(_hcH(new Date()).hy));
  _hrPaintArchive(el, hrCachedArr('_hrData','hr_sleep_sessions')||[], _okArc?'':'⚠️ הרענון מהענן נכשל — המוצג הוא העותק שבמכשיר');
};
function _hrPaintArchive(el, records, warn) {
  var warnHtml=warn?'<div class="warn-note">'+esc(warn)+'</div>':'';
  if(records) records=records.filter(function(r){return !(r&&r.deleted);});
  if(!records||!records.length){
    el.innerHTML=warnHtml+'<div class="empty-note">אין רשומות</div>';return;
  }
  var students=getStudents();
  function nameById(id){var s=students.find(function(x){return String(x.id)===String(id);});return s?s.name:'?';}
  var ARC_LBL={p:'נוכח',l:'איחור',e:'חיסור',x:'אירוע',ap:'אישור',ak:'בבית',a:'מנוחה'};

  var todG=new Date();
  var todayIso=dayToday();
  var todH=_hcH(todG);
  var curHY=todH.hy, curMI=todH.mi;

  var byYear={};
  records.forEach(function(rec){
    var hd=rec.date_heb;
    if(!hd||!hd.hy){var p=rec.date_iso.split('-');hd=_hcH(new Date(+p[0],+p[1]-1,+p[2]));}
    var hy=hd.hy,mi=hd.mi,iso=rec.date_iso;
    if(!byYear[hy]) byYear[hy]={};
    if(!byYear[hy][mi]) byYear[hy][mi]={};
    if(!byYear[hy][mi][iso]) byYear[hy][mi][iso]=[];
    byYear[hy][mi][iso].push({rec:rec,hd:hd});
  });

  var years=Object.keys(byYear).map(Number).sort(function(a,b){return b-a;});
  var idCtr=0; function uid(){return 'sl-arc-col-'+(idCtr++);}

  var html='<div>';
  years.forEach(function(hy){
    var yId=uid();
    var isYearCur=hy===curHY;
    html+='<div class="arc-year">';
    html+='<div data-act="toggle-panel" data-panel="'+esc(yId)+'" '+
      ' class="arc-year-head">'+
      '<span class="arc-head-lbl">📅 '+_hcYL(hy)+'</span><span class="arc-year-chev">▾</span>'+
    '</div>';
    html+='<div id="'+yId+'" class="'+(isYearCur?'':'hidden')+' arc-year-body">';

    var months=Object.keys(byYear[hy]).map(Number).sort(function(a,b){return b-a;});
    months.forEach(function(mi){
      var mId=uid();
      var isMonthCur=isYearCur&&mi===curMI;
      var mName=_hcMN(hy)[mi];
      html+='<div class="arc-month">';
      html+='<div data-act="toggle-panel" data-panel="'+esc(mId)+'" '+
        ' class="arc-month-head">'+
        '<span class="arc-head-lbl">📆 '+mName+'</span><span class="arc-month-chev">▾</span>'+
      '</div>';
      html+='<div id="'+mId+'" class="'+(isMonthCur?'':'hidden')+' arc-month-body">';

      var _arcSessOrder={};
      hrSortedSessions().forEach(function(s,i){_arcSessOrder[s.name]=i;});
      var days=Object.keys(byYear[hy][mi]).sort(function(a,b){return HE.compare(b,a);});
      days.forEach(function(iso){
        var dId=uid();
        var entries=byYear[hy][mi][iso].slice().sort(function(a,b){
          var ia=_arcSessOrder[a.rec.session]!=null?_arcSessOrder[a.rec.session]:999;
          var ib=_arcSessOrder[b.rec.session]!=null?_arcSessOrder[b.rec.session]:999;
          return ia-ib;
        });
        var hd0=entries[0].hd;
        var dayLabel=window.hebDayLabel(hd0.day)+' '+mName;
        var isToday=iso===todayIso;
        html+='<div class="arc-day">';
        html+='<div data-act="toggle-panel" data-panel="'+esc(dId)+'" '+
          'class="arc-day-head '+(isToday?'arc-day-today':'arc-day-plain')+'">'+
          '<span class="arc-head-lbl">'+dayLabel+(isToday?' — <span class="arc-today">היום</span>':'')+
          ' <span class="arc-day-count">('+entries.length+' דוחות)</span></span>'+
          '<span class="arc-day-chev">▾</span>'+
        '</div>';
        html+='<div id="'+dId+'" class="'+(isToday?'':'hidden')+' arc-day-body">';

        entries.forEach(function(entry){
          var rec=entry.rec;
          var cnts={};
          Object.values(hrMarks(rec)).forEach(function(m){if(m.s)cnts[m.s]=(cnts[m.s]||0)+1;});
          var summaryHtml=hrSummaryHtml(cnts);
          var sId=uid();
          html+='<div class="arc-sess-card">';
          html+='<div class="arc-sess-head" data-act="toggle-panel" data-panel="'+esc(sId)+'">';
          html+='<span class="arc-sess-name">'+esc(rec.session)+'</span>';
          html+='<div class="arc-sess-summary">'+summaryHtml+'</div>';
          html+='<button data-act="sl-del-session" data-id="'+esc(rec.id)+'" class="arc-sess-del">✕</button>';
          html+='</div>';
          html+='<div id="'+sId+'" class="arc-sess-body hidden">';
          var _mk2=hrMarks(rec);
          var rows=hrSortStudents(Object.keys(_mk2).map(function(sid2){
            var _st2=students.find(function(x){return String(x.id)===String(sid2);});
            // ⚠️ תלמיד שנמחק אחרי הסדר אינו במצבת ⛔ ואינו נשמט מהשורה —
            //    הסדר שנרשם הוא עובדה, ו«חסר» בארכיון נקרא כמי שלא סומן.
            return _st2||{id:sid2,name:nameById(sid2),cls:''};
          })).map(function(_s2){
            var sid2=String(_s2.id),m2=_mk2[sid2]||{};
            var sn=_s2.name;
            var lbl=m2.s==='l'?('איחור — '+(m2.min||0)+' ד׳'):(ARC_LBL[m2.s]||'לא סומן');
            var noteStr=m2.note?(' — '+m2.note):'';
            var mkc=atvCls(m2.s);
            return '<div class="arc-mark-row">'+
              '<span>'+esc(sn)+'</span><span class="'+mkc+' arc-mark">'+esc(lbl)+esc(noteStr)+'</span></div>';
          });
          html+=rows.join('')+'</div></div>';
        });
        html+='</div></div>';
      });
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  el.innerHTML=warnHtml+html;
}

function hrDeleteSession(id) {
  ask(MSG_DEL_ROW_TITLE, MSG_DEL_ROW_BODY, MSG_DELETE)
    .then(function (yes) { if (yes) hrDeleteSessionConfirmed(id); });
};

async function hrDeleteSessionConfirmed(id) {
  var data=await hrLoadData();
  // מחיקה = tombstone, לא הסרה פיזית — כדי שהמחיקה תסתנכרן לכל המכשירים
  var _dRec=data.find(function(r){return idEq(r.id,id);});
  if(_dRec){_dRec.deleted=true;_dRec.updatedAt=Date.now();_dRec.deletedBy=hrWho();}
  await hrSaveData(data);
  hrRenderArchive();
  hrRenderTodaySessions();
  toast(MSG_ROW_DELETED, null, 'good');
};

async function hrExportExcel(fromIso,toIso) {
  try {
    var data=await hrLoadData();
    var students=getStudents();
    if(!data||!data.length){toast(MSG_NO_EXPORT_DATA);return;}
    data=data.filter(function(r){return !(r&&r.deleted);});
    if(fromIso) data=data.filter(function(r){return r.date_iso>=fromIso;});
    if(toIso)   data=data.filter(function(r){return r.date_iso<=toIso;});
    if(!data.length){toast(MSG_NO_DATA_IN_RANGE);return;}
    var sorted=data.slice().sort(function(a,b){return HE.compare(a.date_iso,b.date_iso);});
    function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function cell(v){return '<Cell><Data ss:Type="String">'+xmlEsc(v)+'</Data></Cell>';}
    function numCell(v){return '<Cell><Data ss:Type="Number">'+xmlEsc(v)+'</Data></Cell>';}
    function hdrCell(v){return '<Cell ss:StyleID="hdr"><Data ss:Type="String">'+xmlEsc(v)+'</Data></Cell>';}
    var HDR=['תאריך','דו"ח','שם תלמיד','סטאטוס','דקות איחור','הערה','ממלא'];
    var xmlRows='<Row>'+HDR.map(hdrCell).join('')+'</Row>';
    sorted.forEach(function(rec){
      var hd=rec.date_heb;
      var dLabel=hd?_hcFmt(hd.hy,hd.mi,hd.day):rec.date_iso;
      Object.entries(hrMarks(rec)).forEach(function(e){
        var sid=e[0],m=e[1];
        var sn=(students.find(function(x){return String(x.id)===String(sid);})||{}).name||sid;
        var lbl=m.s==='p'?'נוכח':m.s==='l'?'איחור':m.s==='e'?'חיסור':m.s==='x'?'אירוע':m.s==='ap'?'אישור':m.s==='ak'?'בבית':m.s==='a'?'מנוחה':'';
        var mins=m.s==='l'?(m.min||0):'';
        xmlRows+='<Row>'+cell(dLabel)+cell(rec.session)+cell(sn)+cell(lbl)+(mins!==''?numCell(mins):cell(''))+cell(m.note||'')+cell(rec.filled_by_name||'')+'</Row>';
      });
    });
    var xml='<?xml version="1.0" encoding="UTF-8"?>';
    xml+='<?mso-application progid="Excel.Sheet"?>';
    xml+='<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"';
    xml+=' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"';
    xml+=' xmlns:x="urn:schemas-microsoft-com:office:excel">';
    xml+='<Styles>';
    xml+='<Style ss:ID="hdr"><Font ss:Bold="1"/><Alignment ss:Horizontal="Right"/></Style>';
    xml+='<Style ss:ID="def"><Alignment ss:Horizontal="Right"/></Style>';
    xml+='</Styles>';
    xml+='<Worksheet ss:Name="שינה" ss:RightToLeft="1">';
    xml+='<Table ss:DefaultColumnWidth="80">';
    xml+='<Column ss:Width="100"/><Column ss:Width="80"/><Column ss:Width="160"/><Column ss:Width="70"/><Column ss:Width="70"/><Column ss:Width="120"/><Column ss:Width="110"/>';
    xml+=xmlRows;
    xml+='</Table></Worksheet></Workbook>';
    var blob=new Blob(['\uFEFF'+xml],{type:'application/vnd.ms-excel;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='shinah-'+dayToday()+'.xls';
    document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
    toast(MSG_EXPORT_OK, null, 'good');
  } catch(e){toast(MSG_EXPORT_FAIL+e.message, null, 'bad');}
};

async function hrExportPdf(fromIso,toIso) {
  try {
    var data=await hrLoadData();
    var students=getStudents();
    if(!data||!data.length){toast(MSG_NO_EXPORT_DATA);return;}
    data=data.filter(function(r){return !(r&&r.deleted);});
    if(fromIso) data=data.filter(function(r){return r.date_iso>=fromIso;});
    if(toIso)   data=data.filter(function(r){return r.date_iso<=toIso;});
    if(!data.length){toast(MSG_NO_DATA_IN_RANGE);return;}
    var sorted=data.slice().sort(function(a,b){return HE.compare(a.date_iso,b.date_iso);});
    var NB=' ';
    var fontName=hrPdfFont();
    function nb(s){return (s||'').replace(/ /g,NB);}
    function cell(s,opts){return Object.assign({text:nb(String(s==null?'':s)),alignment:'right'},opts||{});}
    var hdrRow=[
      cell('#',{bold:true}),cell('תאריך',{bold:true}),cell('דו"ח',{bold:true}),
      cell('נוכחים',{bold:true,color:'#276749'}),cell('אירועים',{bold:true,color:'#742a2a'}),cell('מאחרים',{bold:true,color:'#dd6b20'})
    ];
    var body=[hdrRow];
    sorted.forEach(function(rec,i){
      var hd=rec.date_heb;
      var dLabel=hd?_hcFmt(hd.hy,hd.mi,hd.day):rec.date_iso;
      var p=Object.values(hrMarks(rec)).filter(function(m){return m.s==='p';}).length;
      var ab=Object.values(hrMarks(rec)).filter(function(m){return m.s==='e'||m.s==='x';}).length;
      var l=Object.values(hrMarks(rec)).filter(function(m){return m.s==='l';}).length;
      body.push([cell(i+1),cell(dLabel),cell(rec.session),cell(p),cell(ab),cell(l)]);
    });
    var contentArr=[
      {text:nb('ארכיון זמן שינה'),fontSize:18,bold:true,alignment:'center',margin:[0,0,0,4],color:'#1a3a6b'}
    ];
    if(fromIso||toIso){
      contentArr.push({text:[
        {text:'('},
        {text:fromIso||'תחילה',direction:'ltr'},
        {text:' — '},
        {text:toIso||'סוף',direction:'ltr'},
        {text:')'}
      ],alignment:'center',fontSize:10,color:'#777',margin:[0,0,0,14]});
    } else {
      contentArr[0].margin=[0,0,0,14];
    }
    contentArr.push({table:{widths:['auto','auto','*','auto','auto','auto'],body:body},margin:[0,0,0,10]});
    var dd={pageSize:'A4',pageMargins:[40,40,40,40],
      content:contentArr,defaultStyle:{font:fontName,alignment:'right'}};
    pdfMake.createPdf(dd).download('shinah-'+dayToday()+'.pdf');
  } catch(e){toast(MSG_EXPORT_FAIL+e.message, null, 'bad');}
};

function hrSupNav(dir) {
  var hy=window._hrSupHY, mi=window._hrSupMI;
  mi+=dir;
  var curMax=(_hcBase(hy)||{ml:[]}).ml.length-1;
  if(mi<0){hy--;var pb=_hcBase(hy);if(!pb)return;mi=pb.ml.length-1;}
  if(mi>curMax){hy++;if(!_hcBase(hy))return;mi=0;}
  window._hrSupHY=hy;window._hrSupMI=mi;
  hrRenderSupervision();
};

async function hrRenderSupervision() {
  var el=document.getElementById('sl-sup-content');
  if(!el) return;
  if(!hrSupervisionAccess()){
    el.innerHTML='<div class="empty-note">🔒 גישה לחניכים בכירים ומנהלים בלבד</div>';return;
  }
  /*  ⛔ מציג מיד ומרענן ברקע — ר' `atRenderSupervision`. */
  var cD=hrCachedArr('_hrData','hr_sleep_sessions');
  var cT=hrCachedArr('_hrTreats','hr_sleep_treats');
  if(cD&&cT) _hrSupPaint(el,cD,cT,'');
  else el.innerHTML='<div class="loading-note">⏳ טוען...</div>';
  var okS=await Promise.all([_hrPullSessions(hrHebMonthWin(_hrSupMonth(), window._hrSupMI)), _hrPullTreats()]);
  _hrSupPaint(el, hrCachedArr('_hrData','hr_sleep_sessions')||[],
                  hrCachedArr('_hrTreats','hr_sleep_treats')||[],
                  (okS[0]&&okS[1])?'':'⚠️ הרענון מהענן נכשל — המוצג הוא העותק שבמכשיר');
};

function _hrSupPaint(el, rawData, rawTreats, warn) {
  // סדרי שינה מחוקים לא נספרים בהשגחה (תאום של atSupNav)
  var data=(rawData||[]).filter(function(r){ return !(r && r.deleted); });
  var students=hrSortStudents(getStudents());
  // טיפולים מחוקים (tombstones) לא מוצגים ולא נספרים
  var treats=hrLiveTreats(rawTreats);

  _hrSupMonth();
  var hy=window._hrSupHY,mi=window._hrSupMI;
  var mNames=_hcMN(hy);
  var mLabel=mNames[mi]+' '+_hcYL(hy);

  var curMax=(_hcBase(hy)||{ml:[]}).ml.length-1;
  var hasPrev=mi>0||!!_hcBase(hy-1);
  var hasNext=mi<curMax||!!_hcBase(hy+1);

  var navStyle='sup-nav';
  var navHtml='<div class="sup-nav-bar">'+
    '<button data-act="sl-sup-nav" data-dir="-1" class="'+navStyle+(hasPrev?'':' sup-nav-off')+'"'+(hasPrev?'':' disabled')+'>›</button>'+
    '<span class="sup-nav-label">'+mLabel+'</span>'+
    '<button data-act="sl-sup-nav" data-dir="1" class="'+navStyle+(hasNext?'':' sup-nav-off')+'"'+(hasNext?'':' disabled')+'>‹</button>'+
  '</div>';
  if(warn) navHtml='<div class="warn-note">'+esc(warn)+'</div>'+navHtml;

  if(!data||!data.length){
    el.innerHTML=navHtml+'<div class="empty-note">אין נתונים עדיין</div>';return;
  }

  var stats={};
  students.forEach(function(s){stats[s.id]={name:s.name,cls:s.cls,absent:0,lateMin:0,records:[]};});
  data.forEach(function(rec){
    var dh=rec.date_heb;
    if(!dh||!dh.hy){var p=(rec.date_iso||'').split('-');if(p.length===3)dh=_hcH(new Date(+p[0],+p[1]-1,+p[2]));}
    if(!dh||dh.hy!==hy||dh.mi!==mi) return;
    Object.entries(hrMarks(rec)).forEach(function(e){
      var sid=e[0],m=e[1];
      if(!stats[sid]) return;
      if(m.s==='e'||m.s==='x'){
        stats[sid].absent++;
        stats[sid].records.push({recId:rec.id,session:rec.session,date_iso:rec.date_iso,date_heb:dh,mark:m.s,min:m.min||0,note:m.note||''});
      }
      if(m.s==='l'){
        stats[sid].lateMin+=m.min||0;
        stats[sid].records.push({recId:rec.id,session:rec.session,date_iso:rec.date_iso,date_heb:dh,mark:m.s,min:m.min||0,note:m.note||''});
      }
    });
  });

  /*  ⛔ הרשימה נבנית מסדר התלמידים ⛔ ולא מ-`Object.entries` — ⚠️ מפתח שנראה
   *  כמספר שלם מסודר ב-JS **מספרית** לפני כל שאר המפתחות, ⭐ ולכן השוויון
   *  בין שני תלמידים עם אותו מספר חיסורים נשבר לפי המזהה. */
  var rows=students.map(function(s){return [String(s.id), stats[s.id]];})
    .filter(function(e){return e[1]&&(e[1].absent>0||e[1].lateMin>0);})
    .sort(function(a,b){return (b[1].absent-a[1].absent)||b[1].lateMin-a[1].lateMin;});

  if(!rows.length){
    el.innerHTML=navHtml+'<div class="empty-note">אין אירועים ב'+mLabel+'</div>';return;
  }

  window._hrSupRecords={};
  rows.forEach(function(e){window._hrSupRecords[e[0]]=e[1].records||[];});

  var html=navHtml+'<div class="status-choice-list">';
  rows.forEach(function(e){
    var sid=e[0],st=e[1];
    var stuTreats=treats.filter(function(t){return String(t.sid)===String(sid);});
    var lastTreat=stuTreats.length?stuTreats.slice().sort(function(a,b){return HE.compare(b.date_iso||'',a.date_iso||'');})[0]:null;
    var lastHtml='';
    if(lastTreat){
      var ltHd=lastTreat.date_heb;
      var ltIso=lastTreat.date_iso||'';
      var ltDateStr=ltHd?_hcFmt(ltHd.hy,ltHd.mi,ltHd.day):ltIso;
      lastHtml='<span class="badge-ok">📝 יום '+hrDow(ltIso)+' '+esc(ltDateStr)+'</span>';
    }
    var alert20=st.absent>=20?'<span class="badge-bad">⚠️ 20+</span>':'';
    var alert300=st.lateMin>=300?'<span class="badge-warn">⏰ 300+</span>':'';
    var clsLabel=st.cls==='a'?'א':st.cls==='b'?'ב':st.cls==='g'?'ג':st.cls||'';
    var cardId='sl-sup-card-'+sid;
    html+='<div id="'+cardId+'" class="sup-card-pane sup-card">';
    html+='<div class="sup-card-head" data-act="toggle-next" data-chev="sl-sup-chev">';
    html+='<div class="sup-card-class">'+esc(clsLabel)+'</div>';
    html+='<div class="rec-main"><div class="rec-title">'+esc(st.name)+alert20+alert300+'</div>'+(lastHtml?'<div class="rec-last">'+lastHtml+'</div>':'')+'</div>';
    html+='<div class="sup-card-stats">';
    html+='<span class="rec-abs">אירועים: <b>'+st.absent+'</b></span>';
    html+='<span class="rec-late">איחורים: <b>'+st.lateMin+'</b>ד׳</span>';
    html+='<span class="rec-muted">טיפולים: <b>'+stuTreats.length+'</b></span>';
    html+='<button data-act="sl-sup-detail" data-id="'+esc(sid)+'" class="sup-detail-btn">🔍 פירוט</button>';
    html+='</div>';
    html+='<span class="sup-chev-icon sl-sup-chev">›</span>';
    html+='</div>';
    html+='<div class="sup-card-body hidden">';
    html+='<div class="treat-add">';
    html+='<div class="panel-head-sm">➕ הוסף טיפול</div>';
    html+='<div class="chip-row ksave">';
    var hrCfg=window._hrCfg||hrDefaultCfg();
    html+='<select aria-label="סוג הטיפול" id="sl-treat-type-'+sid+'" class="treat-select">'+
      hrCfg.treats.map(function(t){return '<option>'+esc(t)+'</option>';}).join('')+'</select>';
    html+='<input aria-label="הערה (אופציונלי)" id="sl-treat-note-'+sid+'" placeholder="הערה (אופציונלי)" class="treat-note-input">';
    html+='<button data-act="sl-add-treat" data-ksave data-id="'+esc(sid)+'" class="treat-save-btn">שמור</button>';
    html+='</div></div>';
    if(stuTreats.length){
      html+='<div class="panel-head-sm">📋 היסטוריית טיפולים</div>';
      html+=stuTreats.slice().reverse().map(function(t){
        var hd=t.date_heb;
        var dl=hd?_hcFmt(hd.hy,hd.mi,hd.day):t.date_iso;
        return '<div class="treat-row">'+
          '<span class="rec-muted">'+esc(dl)+'</span>'+
          '<span class="treat-type">'+esc(t.type)+'</span>'+
          (t.note?'<span class="rec-muted">— '+esc(t.note)+'</span>':'')+
          '<span class="gap"></span>'+
          '<span class="unit-hint">'+esc(t.by_name)+'</span>'+
          '<button data-act="sl-del-treat" data-id="'+esc(t.id)+'" class="treat-del-btn">✕</button>'+
        '</div>';
      }).join('');
    }
    html+='</div></div>';
  });
  html+='</div>';
  el.innerHTML=html;
};

async function hrAddTreat(sid) {
  var typeEl=document.getElementById('sl-treat-type-'+sid);
  var noteEl=document.getElementById('sl-treat-note-'+sid);
  if(!typeEl) return;
  var now=new Date();
  var rec={
    id:Date.now()+'_'+Math.random().toString(36).substr(2,5),
    sid:sid,
    date_iso:dayToday(),
    date_heb:_hcH(now),
    type:typeEl.value,
    note:noteEl?noteEl.value:'',
    by:AUTH.user?AUTH.user.client_id:'',
    by_name:AUTH.user?AUTH.user.full_name:'',
    created_at:now.toISOString(),
    updatedAt:now.getTime() // ראה atAddTreat
  };
  var treats=await hrLoadTreats();
  treats.push(rec);
  // ⚠️ סימון ⏳ נרשם לפני הדחיפה; `hrSaveTreats` מאשרת רק אם הכתיבה לענן הצליחה.
  pendMark(PK_SL_TREAT+rec.id);
  await hrSaveTreats(treats);
  if(noteEl) noteEl.value='';
  hrRenderSupervision();
  toast(MSG_CARE_SAVED, null, 'good');
};

function hrDeleteTreat(id) {
  ask(MSG_DEL_CARE_TITLE, MSG_DEL_CARE_BODY, MSG_DELETE)
    .then(function (yes) { if (yes) hrDeleteTreatConfirmed(id); });
};

async function hrDeleteTreatConfirmed(id) {
  closeModal();
  var treats=await hrLoadTreats();
  // ראה atDeleteTreatConfirmed — tombstone, לא הסרה פיזית.
  var ts=Date.now(), by=hrWho(), found=false;
  treats.forEach(function(t){
    if(!t||String(t.id)!==String(id)||t.deleted) return;
    t.deleted=true; t.updatedAt=ts; t.deletedBy=by; found=true;
  });
  if(!found){ toast(MSG_CARE_MISSING, null, 'bad'); hrRenderSupervision(); return; }
  pendMark(PK_SL_TREAT+id);   // מחיקה היא כתיבה — ממתינה לאישור כמו כל שינוי
  await hrSaveTreats(treats);
  hrRenderSupervision();
  toast(MSG_DELETED_MARK, null, 'good');
};

// -------- פירוט חודשי לתלמיד --------
var HR_LBL_DET={p:'נוכח',l:'איחור',e:'חיסור',x:'אירוע',ap:'אישור',ak:'בבית',a:'מנוחה'};

function hrSupDetail(sid) {
  var students=getStudents();
  var st=students.find(function(s){return String(s.id)===String(sid);});
  var name=st?st.name:'תלמיד';
  var records=(window._hrSupRecords&&window._hrSupRecords[sid])||[];

  var rowsHtml='';
  if(!records.length){rowsHtml='<div class="loading-note">אין אירועים בחודש זה</div>';}
  else{
    records.slice().sort(function(a,b){return HE.compare(a.date_iso,b.date_iso)||HE.compare(a.session,b.session);}).forEach(function(r){
      var hd=r.date_heb;
      var hbr=hd?_hcFmt(hd.hy,hd.mi,hd.day):r.date_iso;
      var dowStr='יום '+hrDow(r.date_iso);
      var lbl=r.mark==='l'?('איחור — '+(r.min||0)+' ד׳'):(HR_LBL_DET[r.mark]||r.mark);
      var noteStr=r.note?(' — '+r.note):'';
      var mkc=atvCls(r.mark);
      rowsHtml+='<div class="mark-hist-row">';
      rowsHtml+='<span class="mark-hist-dow">'+dowStr+'</span>';
      rowsHtml+='<span class="mark-hist-date">'+esc(hbr)+'</span>';
      rowsHtml+='<span class="mark-hist-sess">'+esc(r.session)+'</span>';
      rowsHtml+='<span class="'+mkc+' hist-mark">'+esc(lbl)+esc(noteStr)+'</span>';
      rowsHtml+='<button data-act="sl-mark-edit" data-rec="'+esc(r.recId)+'" data-sid="'+esc(sid)+'" data-code="'+esc(r.mark)+'" '+
        ' class="mark-edit-btn">✏️ ערוך</button>';
      rowsHtml+='</div>';
    });
  }

  openModal(MSG_MONTH_DETAIL+name,
    '<div class="scroll-pane">'+rowsHtml+'</div>','');
};

function hrSupEditMarkDlg(recId, sid, curMark) {
  var CODES=[
    {c:'p', lbl:'✓ נוכח'},
    {c:'l', lbl:'⏰ איחור'},
    {c:'e', lbl:'− חיסור'},
    {c:'x', lbl:'✕ אירוע'},
    {c:'ap', lbl:'א אישור'},
    {c:'ak', lbl:'ב בבית'},
    {c:'a', lbl:'ג מנוחה'}
  ];
  var btnsHtml=CODES.map(function(cd){
    var active=cd.c===curMark?'mark-on':'mark-off';
    return '<button data-act="sl-mark-set" data-rec="'+esc(recId)+'" data-sid="'+esc(sid)+'" data-code="'+esc(cd.c)+'" '+
      'class="'+atvCls(cd.c)+' '+active+' mark-pick">'+cd.lbl+'</button>';
  }).join('');
  openModal(MSG_EDIT_MARK,
    '<div class="chip-row">'+btnsHtml+'</div>',
    '<button data-act="modal-close" class="md-btn-ghost">ביטול</button>');
};

async function hrEditMark(recId, sid, newCode) {
  var data=await hrLoadData();
  var rec=data.find(function(r){return idEq(r.id,recId);});
  if(!rec){toast(MSG_ROW_MISSING, null, 'bad');return;}
  if(!rec.marks||typeof rec.marks!=='object') rec.marks={};
  if(!rec.marks[sid]) rec.marks[sid]={};
  rec.marks[sid].s=newCode;
  if(newCode!=='l') rec.marks[sid].min=0;
  rec.updatedAt=Date.now();
  /*  ⛔ ההצלחה מסומנת אחרי **השמירה המקומית** ⛔ ולא אחרי הדחיפה —
   *  ⚠️ הנימוק המדוד: הכתיבה לדיסק סינכרונית בראש פונקציית השמירה, ⭐ ולכן
   *  היא הושלמה ברגע שההבטחה חזרה: ⛔ ההמתנה שאחריה היא **הרשת בלבד**,
   *  ⚠️ והמתנה לה לפני הטוסט הראתה מסך שלא הגיב ⛔ והמשתמש לחץ שוב.
   *  ⛔ **וההמתנה נשארת בסוף** — ⚠️ נקודת הניתוב משחררת את הכפתור לפיה,
   *  ⭐ וכשל דחיפה מסומן בתג הממתינים ⛔ ולא בהודעת כשל שנייה. */
  var _p=hrSaveData(data);
  closeModal();
  hrRenderTodaySessions();
  hrRenderArchive();
  hrRenderSupervision();
  toast(MSG_MARK_UPDATED, null, 'good');
  await _p;
};

// -------- הגדרות מודול שינה (טיפולים בלבד) --------
/*  ⛔ מציג מיד ⛔ ומרענן ברקע — ⚠️ ההגדרות יושבות על הדיסק, ⭐ ואין סיבה
 *  שמסך ההגדרות ימתין לרשת כדי לצייר אותן. */
async function renderSleepSettings() {
  hrCachedCfg();
  _hrPaintSettings();
  await _hrPullCfg();
  _hrPaintSettings();
};
function _hrPaintSettings() {
  var cfg=window._hrCfg||hrDefaultCfg();
  var tc=document.getElementById('sl-cfg-treats');
  if(tc){
    tc.innerHTML=cfg.treats.map(function(t,i){
      return '<div class="badge-row">'+
        '<input aria-label="שם הטיפול" value="'+esc(t)+'" id="sl-treat-inp-'+i+'" class="sess-field">'+
        '<button data-act="row-remove" class="row-del-btn">✕</button>'+
      '</div>';
    }).join('');
  }
}

function hrAddTreatRow() {
  var tc=document.getElementById('sl-cfg-treats');
  if(!tc) return;
  var div=document.createElement('div');
  div.className='edit-row';
  div.innerHTML='<input aria-label="שם הטיפול" placeholder="שם הטיפול" class="sess-field"><button data-act="row-remove" class="row-del-btn">✕</button>';
  tc.appendChild(div);div.querySelector('input').focus();
};

async function hrSaveSettingsCfg() {
  var cfg=window._hrCfg||hrDefaultCfg();
  var tc=document.getElementById('sl-cfg-treats');
  if(tc){
    var newTreats=[];
    // ⛔ וגם כאן — טיפול באותו שם אינו נאסף פעמיים, מאותה סיבה בדיוק
    tc.querySelectorAll('input').forEach(function(inp){
      var v=inp.value.trim();
      if(!v||uniqHas(newTreats, v)) return;
      newTreats.push(v);
    });
    cfg.treats=newTreats;
  }
  window._hrCfg=null;
  await hrSaveCfg(cfg);
  window._hrCfg=cfg;
  toast(MSG_SETTINGS_SAVED, null, 'good');
};

bootOk();
