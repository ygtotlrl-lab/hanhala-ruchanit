<!--  ⛔ מיכל המודאל היחיד — ⚠️ מסלול סגירה אחד לכל הדיאלוגים: ⭐ מיכל
      לכל דיאלוג הוא דרך סגירה לכל דיאלוג, ⛔ ומיכל שהוחלף חלקית משאיר
      שני מסלולי סגירה.  -->
<div id="modal" class="veil">

      ⭐ הגוף הוא `textContent`, ⛔ ודיאלוג שדורש HTML עובר ב-`openModal`. -->
<div id="ask" class="veil">

         uniqHas, uniqList, withTimeout } from './core/util.js';

         eraNotePush, idEq, mergeCore, newClientId, pendAlertDismiss,

         lsRemove, lsSet, lsSetArray } from './core/storage.js';
import { MIRROR, mirrorBoot, mirrorKey, mirrorLoadOne, mirrorSave,

import { actRun, ask, busy, closeAsk, closeModal, esc, ksKey, modalBackdrop,
         modalEsc, openModal, pullRender, shellBare, swApply, swHideUpdate,
         toast, uiNoDialog } from './core/ui.js';
import './core/hebrew.js';

/*  ⛔ התצורה נמסרת למודולים בשומרי קריאה — ⚠️ חלקה מוגדר בהמשך הדף,
 *  ⭐ והשומר קורא אותה בזמן הקריאה ⛔ ולא בזמן המסירה. */
document.title = self.APP.name;
appConfigure({
  get BK_CFG() { return BK_CFG; },
  get DATA_ERA() { return DATA_ERA; },
  get DEV_CFG() { return DEV_CFG; },
  get DOM_ACTIONS() { return DOM_ACTIONS; },
  get ERA_CFG() { return ERA_CFG; },
  get HW_CFG() { return HW_CFG; },
  get LK_CFG() { return LK_CFG; },
  get LS_CFG() { return LS_CFG; },
  get MIRROR_CFG() { return MIRROR_CFG; },
  get PEND_CFG() { return PEND_CFG; },
  get PL_CFG() { return PL_CFG; },
  get PUSH_CFG() { return PUSH_CFG; },
  get RTY_CFG() { return RTY_CFG; },
  get TOAST_DEFAULT_MS() { return TOAST_DEFAULT_MS; },
  get USER_CFG() { return USER_CFG; },
  get saveRefresh() { return saveRefresh; }
});

/* ══════════════════════════════════════════════════════════════════════════
   המסכים — מצוירים בקוד, לתוך `#view`
   ══════════════════════════════════════════════════════════════════════════
   ⛔ הקליפה ב-HTML נושאת מבנה בלבד — כותרת · ניווט · מיכל תוכן · שכבות:

   ⛔ ומסך הכניסה הוא מסך כמו כל מסך — ⚠️ במיכל, ⭐ ושכבה מלאה מעל הכותרת. */

/*  ⛔ רישום הגופן ל-PDF יושב כאן ⛔ ובנקודה אחת — ⚠️ שלושה מסלולי ייצוא
 *  רשמו אותו כל אחד לעצמו, ⭐ ושלוש נקודות רישום הן שלושה מקומות לשכוח
 *  בהם כשה-API משתנה. ⛔ **וה-API הוא `addVirtualFileSystem`/`addFonts`** —
 *  ⚠️ השמה ל-`pdfMake.vfs` הייתה הדרך עד 0.2, ⛔ והיא אינה קיימת מ-0.3:
 *  ⭐ היא נכשלת **בשקט** ומחזירה את הדוח לגופן שאין בו עברית. */
function hrPdfFont() {
  if (typeof pdfMake === 'undefined' || !window._alefFontB64) return 'Roboto';
  try {
    if (!window._hrPdfFontDone) {
      pdfMake.addVirtualFileSystem({ 'Alef-Regular.ttf': window._alefFontB64 });
      pdfMake.addFonts({ Alef: { normal: 'Alef-Regular.ttf', bold: 'Alef-Regular.ttf',
                                 italics: 'Alef-Regular.ttf', bolditalics: 'Alef-Regular.ttf' } });
      window._hrPdfFontDone = true;
    }
    return 'Alef';
  } catch (e) { console.warn('[pdf] רישום הגופן נכשל', e); return 'Roboto'; }
}
window._hrPdfFontDone = false;
window._alefFontB64=null;
(function(){
  fetch('https://fonts.gstatic.com/s/alef/v22/FeVfS0NQpLYgrjJbC5FxxbU.ttf')
    .then(function(r){return r.arrayBuffer();})
    .then(function(buf){
      var b=new Uint8Array(buf),chunks=[];
      for(var i=0;i<b.length;i+=8192) chunks.push(String.fromCharCode.apply(null,b.subarray(i,i+8192)));
      window._alefFontB64=btoa(chunks.join(''));
    })
    .catch(function(){});
})();

// ============================================================
/* ══════════════════════════════════════════════════════════════════════════
   כניסה והרשאות — `hr_users` ומטריצת `hr_perms`
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ נקודת האכיפה לניווט היא **אחת**: `showPage` בודק `canAccess`
   ומציג `showDenied()`. ⛔ אין להסתיר כפתורים לפי הרשאה —
   כפתור שנעלם משאיר את איש הצוות בלי לדעת שהמסך קיים, ולכן גם בלי
   לדעת שאפשר לבקש גישה.
   ══════════════════════════════════════════════════════════════════════════ */
// ============================================================
var AUTH = {
  /* ⭐ `AUTH.user` הוא מעכשיו חלון אל מודול הסשן המשותף — הערך
     עצמו יושב שם, בזיכרון בלבד. ⛔ אין להחזיר כאן שדה רגיל: שדה שכל אחד
     יכול להציב בו ערך הוא בדיוק המסלול שדרכו הסשן חזר לדיסק. */
  get user() { return sessGet(); },          // המבנה: {id, username, full_name, role}
  set user(v) { sessSet(v); },
  offlineLogin: false, // true = אומת מול עותק מקומי (ללא רשת); מאומת מחדש כשהרשת חוזרת
  perms: null,         // המבנה: {students:{admin:'edit',manager:'view',junior:'none'}, ...}
  MODULES: [
    {id:'students', label:'👥 מצבת תלמידים'},
    {id:'attend',   label:'✅ שמירת סדרים'},
    {id:'sleep',    label:'🌙 זמן שינה'},
    {id:'exams',    label:'📝 מבחנים'},
    {id:'files',    label:'📁 תיקים אישיים'},
    {id:'reports',  label:'📊 גיליונות חודשיים'},
    {id:'settings', label:'⚙️ הגדרות מערכת'}
  ],

  ROLE_LABELS: {admin:'מנהל', manager:'צוות בכיר', junior:'צוות'},

  DEFAULT_PERMS: {
    students: {admin:'edit', manager:'edit', junior:'view'},
    attend:   {admin:'edit', manager:'edit', junior:'view'},
    sleep:    {admin:'edit', manager:'edit', junior:'view'},
    exams:    {admin:'edit', manager:'edit', junior:'view'},
    files:    {admin:'edit', manager:'edit', junior:'none'},
    reports:  {admin:'edit', manager:'view', junior:'none'},
    settings: {admin:'edit', manager:'none', junior:'none'}
  }
};

// ---- בדוק הרשאה ----
function canAccess(moduleId) {
  if (!AUTH.user) return false;
  var p = AUTH.perms || AUTH.DEFAULT_PERMS;
  var mp = p[moduleId] || {};
  var level = mp[AUTH.user.role] || 'none';
  return level !== 'none';
}
function canEdit(moduleId) {
  if (!AUTH.user) return false;
  var p = AUTH.perms || AUTH.DEFAULT_PERMS;
  var mp = p[moduleId] || {};
  var level = mp[AUTH.user.role] || 'none';
  return level === 'edit';
}

// ---- החלטת מדיניות: כפתורי מסכים חסומים נשארים גלויים ----
// **אין להסתיר כפתורי ניווט או כרטיסי מודולים לפי canAccess** — כפתור שנעלם משאיר את
// איש הצוות בלי לדעת שהמסך בכלל קיים, ולכן גם בלי לדעת שאפשר לבקש גישה. כפתור
// גלוי שמחזיר "אין הרשאה" מוסר את המידע הזה.
// האכיפה לא נחלשת — היא פשוט יושבת בנקודה אחת: `showPage` בודק `canAccess(pg)`
// ומציג `showDenied()`. זו נקודת האכיפה היחידה לניווט.
// (מה שכן נשאר מהרענון החי: אם ההרשאה למסך שכבר **פתוח** נשללה תוך כדי עבודה,
//  `hrApplyPerms` מוציא הביתה עם טוסט — ראה למטה.)

// המסך הפתוח כרגע — showPageInternal מסמן אותו ב-class 'on' על אלמנט ‎.pg
function hrCurrentPage() {
  var el = document.querySelector('.pg.on');
  return (el && el.id.indexOf('pg-') === 0) ? el.id.slice(3) : null;
}

// מקור יחיד לקליטת מטריצת הרשאות חדשה (כניסה או משיכה מהענן):
// AUTH.perms + hr_perms_cache. מחזיר true אם המטריצה השתנתה.
function hrApplyPerms(p) {
  if (!p || typeof p !== 'object' || Array.isArray(p)) return false;
  var next = JSON.stringify(p);
  var changed = (next !== JSON.stringify(AUTH.perms || {}));
  AUTH.perms = p;
  // בלי העותק המקומי כניסה אופליין אחרי עדכון הרשאות מחזירה מטריצה ישנה
  // ⛔ ערך מוחזר שנבדק ולא כשל נבלע — בלי העותק המקומי,
  // כניסה אופליין אחרי עדכון הרשאות מחזירה את המטריצה **הישנה**.
  // `lsSet` כבר מרימה באנר בעצמה; כאן נרשם גם ליומן.
  try {
    if (!lsSet('hr_perms_cache', next)) {
      console.warn('[perms] העותק המקומי של ההרשאות לא נשמר');
    }
  } catch (e) { console.warn('[perms] lsSet זרקה:', e && e.message); }
  // ⚠️ הבדיקה הזו נחוצה גם בלי רענון התצוגה: canAccess מחזירה false כשאין
  // משתמש, ולכן בלעדיה משיכה שרצה **לפני הכניסה** (hrPullFromCloud באתחול)
  // הייתה מפעילה showPage('home') + טוסט מעל מסך הכניסה. אין להסיר.
  if (!AUTH.user) return changed;
  // מסך פתוח שעדיין מותר נשאר כמו שהוא — לא שוברים עבודה באמצע. רק אם
  // ההרשאה למסך הנוכחי נשללה מוציאים הביתה עם הודעה, ולא משאירים מסך ריק.
  if (changed) {
    var cur = hrCurrentPage();
    if (cur && cur !== 'home' && !canAccess(cur)) {
      var lbl = cur;
      for (var i = 0; i < AUTH.MODULES.length; i++) {
        if (AUTH.MODULES[i].id === cur) { lbl = AUTH.MODULES[i].label; break; }
      }
      closeModal();
      showPage('home');
      try { toast(MSG_PERMS_CHANGED_PRE + lbl + MSG_PERMS_CHANGED_POST); } catch (e3) {}
    }
  }
  return changed;
}

// ⛔ אין מסלול שכותב סיסמה מקוד שרץ מעצמו בכל טעינת דף, ⛔ ואין להוסיף אחד —
// `.single()` מחזירה `data:null` גם כשאין התאמה, ולכן כל סיסמה שאינה ברירת
// המחדל מפעילה את הכתיבה, והמנהל אינו יכול להחליף סיסמה כלל.

// ---- כניסה ----
/* ══════════════════════════════════════════════════════════════════════════
   טביעת סיסמה — PBKDF2-SHA256
   ══════════════════════════════════════════════════════════════════════════
   **הבעיה שהטביעה פותרת.** מראה שמצומצמת למשתמש המחובר בלבד נועדה
   לכך שלא יישבו סיסמאות של כל הצוות על כל מכשיר. הצמצום
   נכון מבחינת חשיפה — ו**פוגע בדרישה תפעולית מחייבת**: משגיחים עובדים
   בישיבה בלי קליטה, וכל משתמש חייב להיכנס אופליין בכל מכשיר, תמיד. בצמצום
   משגיח שקיבל מכשיר שמישהו אחר נכנס בו לאחרונה פשוט **אינו יכול
   להיכנס**. הדרישה קודמת לשיקול האחסון.

   **הפתרון.** המטמון חוזר להחזיק את **כל המשתמשים הפעילים**, אבל בלי
   הסיסמה: לכל משתמש נשמרים `pass_salt` + `pass_fp` — טביעת PBKDF2-SHA256
   ב-`HR_PASS_ITER` סיבובים, עם **מלח פר-משתמש**. מכשיר שאבד חושף טביעות, לא
   סיסמאות; והשהיית ה-100k היא מה שהופך ניחוש-בכוח על העותק שבדיסק ליקר

// ---- מגבלת זמן לשאילתות אימות ----
// supabase-js לא מטיל timeout משלו. ברשת "חצי מחוברת" (פורטל שבוי, אנטנה חלשה)
// ה-fetch לא מצליח ולא נכשל — והספינר היה מסתובב לנצח בלי שום הודעה.
// אימות מחדש שקט אחרי כניסה אופליין — כשהרשת חוזרת
async function hrRevalidateOfflineLogin() {
  if (!AUTH.user || !AUTH.offlineLogin) return;
  try {
    var res = await SB.from('hr_users').select('*').eq('client_id', AUTH.user.client_id).eq('active', true).maybeSingle();
    if (res.error) return; // הרשת עדיין לא יציבה — ננסה בהזדמנות הבאה
    if (!res.data) { toast(MSG_USER_DISABLED_OUT, null, 'bad'); doLogout(); return; }
    AUTH.user = res.data;
    AUTH.offlineLogin = false;
    hrUsersCacheSave(res.data);   // השורה כבר בידינו — אין צורך במשיכה נוספת
    try { loadPerms(); } catch(e2) {}
    console.log('[login] אימות אופליין אושרר מול הענן');
  } catch(e) {}
}

/* ══════════════════════════════════════════════════════════════════════════
   יומן ניסיונות הכניסה
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔⛔ הגרסה **נגזרת** ⛔ ואינה מוקלדת פעם שנייה — ⚠️ ערך שנכתב כאן וגם
 *  ב-`CACHE_NAME` שב-`sw.js` נסחף, ⭐ ו-`sw_version` ביומן הכניסה מדווח
 *  גרסה שאינה הקוד שרץ.
 *  ⭐ **שם המטמון החי הוא הערך** — ⛔ הוא נוצר מ-`CACHE_NAME` עצמו, ⚠️ ולכן
 *  זו קריאה מהמקום שבו הערך נקבע ⛔ ולא מקור שני.
 *  ⛔ **ובזמן עדכון עשויים לחיות שני מטמונים** — ⚠️ הנבחר הוא בעל המספר
 *  הגבוה, ⭐ שהוא הגרסה שהופעלה.
 *  ⛔ **וכשל מחזיר מחרוזת ריקה** ⛔ ולא ערך מוקלד — ⚠️ «לא ידוע» עדיף על
 *  גרסה שגויה שנרשמת כעובדה. */
var HR_APP_VER = '';
var HR_VER_PREFIX = self.APP.id + '-';
async function hrAppVerBoot() {
  try {
    if (!self.caches || !caches.keys) return HR_APP_VER;
    var names = await caches.keys();
    var mine = (names || []).filter(function (n) { return String(n).indexOf(HR_VER_PREFIX) === 0; });
    if (!mine.length) return HR_APP_VER;
    mine.sort(function (a, b) {
      var na = parseInt(String(a).replace(/^.*-v/, ''), 10) || 0;
      var nb = parseInt(String(b).replace(/^.*-v/, ''), 10) || 0;
      return na - nb;
    });
    HR_APP_VER = mine[mine.length - 1];
  } catch (e) { console.warn('[ver] hrAppVerBoot', e); }
  return HR_APP_VER;
}
function hrLoginDetails(username) {
  // לעולם לא רושמים סיסמה — לא גלויה ולא מגובבת
  return { typed_username: username || '', online: !!navigator.onLine, sw_version: HR_APP_VER };
}
// ⚠️ התור והריקון עברו למודול המשותף. המפתח נשאר
// `hr_login_log_queue` **בכוונה** — `LS_CFG.pending()` בודק אותו, ושינוי שמו
// היה מנתק בשקט את ההגנה שמדלגת על פינוי הרשומות הישנות כשיש משהו שטרם עלה.
function hrLoginLog(action, branch, details) {
  logAction(action, branch, 0, details || null);
}
async function hrLoginLogFlush() { return logFlush(); }

// עטיפת ביטחון: doLogin היא async, ולכן כל זריקה בלתי-צפויה בתוכה הופכת
// ל-unhandled rejection — הספינר נשאר מסתובב, ואפס משוב למשתמש.
// כאן כל כישלון מסתיים בהודעה גלויה. ⛔ והכפתור אינו מושבת כאן — ⚠️ הניתוב
// (`actRun`) מנטרל אותו עד שההבטחה נגמרת, ⭐ ומחזיר אותו בכל מסלול.
async function doLogin() {
  try {
    await _doLoginInner();
  } catch (e) {
    console.error('[login] unexpected:', e);
    try {
      var el = document.getElementById('auth-err');
      /*  ⛔ כשל מערכת אינו יושב על משטח המשתמש — ⚠️ `.auth-err` שמור למה
       *  שהמשתמש יכול לתקן בהקלדה: ⭐ והמשטח מתאפס כדי שהטופס יהיה שמיש. */
      if (el) el.textContent = '';
      toast(MSG_LOGIN_ERR + ((e && e.message) || e || MSG_SERVER_ERR), null, 'bad');
      var sp = document.getElementById('auth-spinner'); if (sp) sp.classList.remove('on');
    } catch (e2) {}
  }
}

async function _doLoginInner() {
  /*  ⛔ טעינת המראה רצה כאן ⛔ ולא בפונקציית העלייה — ⚠️ העלייה רצה
   *  **אחרי** הכניסה, ⭐ והקורא הראשון של המראה הוא מסלול הכניסה
   *  האופליין עצמו: ⛔ טעינה שרצה אחריו הייתה מגיעה מאוחר מדי. */
  mirrorLoadOne(HR_USERS_TABLE);
  var username = document.getElementById('auth-user').value.trim();
  var pass = document.getElementById('auth-pass').value.trim();
  var errEl   = document.getElementById('auth-err');
  var spinner = document.getElementById('auth-spinner');
  function showErr(msg){ errEl.textContent=msg; spinner.classList.remove('on'); }
  function startLoad(){ errEl.textContent=''; spinner.classList.add('on'); }
  function stopLoad(){ spinner.classList.remove('on'); }
  function dbg(msg){ console.log('[login] '+msg); }
  errEl.textContent='';
  if (!username || !pass) { showErr(MSG_FILL_LOGIN); return; }
  startLoad();
  dbg('⏳ [1/4] שולח בקשה לשרת...');
  var res = null, netFail = false;
  try {
    // ⭐ השורה נשלפת לפי **שם המשתמש בלבד**, וההשוואה היא מול
    // הטביעה (`hrVerifyOffline`), בדיוק כמו במסלול האופליין. ⛔ סינון
    // ב-`.eq('password_hash', pass)` הופך את הסיסמה הגלויה שבענן **למפתח
    // שפותח את הכניסה**, ⚠️ וכל מי שמחזיק את מפתח ה-anon (שיושב
    // ב-`index.html` הציבורי) יכול לקרוא אותה.
    res = await withTimeout(SB.from('hr_users')
      .select('*')
      .eq('username', username)
      .eq('active', true)
      .maybeSingle());
  } catch(e) {
    // כולל פסק זמן — מבחינתנו "אין רשת שמישה", ולא תקיעה בלי סוף
    console.error('[login] SB threw:', e && e.message);
    netFail = true;
  }
  if (!netFail && res && res.error && isNetErr(res.error)) netFail = true;

  var serverErr = (!netFail && res && res.error) ? res.error : null;
  // תשובה סמכותית של השרת "אין משתמש כזה" — אסור ליפול לעותק מקומי אחריה,
  // אחרת סיסמה שהוחלפה בענן או משתמש שהושבת ימשיכו להיכנס מהמטמון הישן.
  // ⭐ השרת מחזיר את השורה לפי שם המשתמש, וההכרעה נעשית **כאן**
  // מול הטביעה. `authoritativeNo` הוא מעכשיו «אין שורה **או** שהטביעה לא
  // התאימה» — בשני המקרים השרת ענה תשובה סמכותית, ו⛔ אסור ליפול אחריה
  // לעותק המקומי (אחרת סיסמה שהוחלפה בענן הייתה ממשיכה לפתוח מהמטמון).
  var onlineRow = (!netFail && res && !res.error) ? res.data : null;
  var onlineVerdict = onlineRow ? await hrVerifyOffline(onlineRow, pass) : null;
  if (onlineVerdict === 'no-fp') {
    hrLoginLog('login_fail', 'no_fp_online', hrLoginDetails(username));
    showErr(MSG_NO_FP_ONLINE); return;
  }
  if (onlineVerdict === 'no-crypto') {
    hrLoginLog('login_fail', 'no_crypto_online', hrLoginDetails(username));
    showErr(MSG_NO_CRYPTO); return;
  }
  var authoritativeNo = (!netFail && res && !res.error && (!res.data || onlineVerdict === 'bad'));
  var onlineUser = (onlineVerdict === 'ok') ? onlineRow : null;

  if (onlineUser) {
    ctxSwitch();
    AUTH.user = onlineUser;
    AUTH.offlineLogin = false;
    hrLoginLog('login_ok', 'online', hrLoginDetails(username));
    // השורה כבר בידינו מהאימות — נשמרת ישירות, כדי שגם אם הרענון המלא
    // שאחריה ייכשל, המשתמש הזה לפחות יוכל להיכנס אופליין בפעם הבאה.
    hrUsersCacheSave(onlineUser);
    //...ומיד אחריה הרענון המלא: **כל** המשתמשים הפעילים, בלי
    // סיסמאות. זה מה שמאפשר למשגיח אחר להיכנס אופליין באותו מכשיר.
    hrRefreshUsersCache();
    hrLoginLogFlush();     // שלח רשומות שהצטברו באופליין — הרשת מוכחת-עובדת כעת
  } else if (authoritativeNo) {
    hrLoginLog('login_fail', 'wrong_credentials_online', hrLoginDetails(username));
    showErr('❌ ' + MSG_BAD_LOGIN); return;
  } else {
    // אין רשת / פסק זמן / שגיאת שרת (פרויקט מושהה, מפתח פג, RLS) —
    // בכל אלה השרת לא ענה תשובה סמכותית, ולכן מנסים את העותק המקומי.
    dbg(netFail ? 'אין רשת — מנסה אימות מקומי (מראת המשתמשים)'
               : 'שגיאת שרת — מנסה אימות מקומי (מראת המשתמשים)');
    hrLoginLog('login_fail', netFail ? 'net_error' : 'server_error', hrLoginDetails(username));
    var cache = hrUsersCacheGet();
    // Array.isArray ולא cache.length — ערך תקין-כ-JSON שאינו מערך (למשל מחרוזת)
    // עבר את הבדיקה הישנה ואז cache.find זרק TypeError שנבלע: ספינר תקוע בלי הודעה
    if (!Array.isArray(cache) || !cache.length) {
      hrLoginLog('login_fail', 'no_cache_offline', hrLoginDetails(username));
      /*  ⛔ שני סיווגים, שתי קריאות ושני משטחים — ⚠️ שגיאת שרת היא כשל
       *  מערכת ואינה על משטח המשתמש: ⭐ והיעדר מטמון הוא מה שהמשתמש
       *  יכול לפתור — חיבור אחד. */
      if (serverErr) toast(MSG_LOGIN_ERR + (serverErr.message || serverErr.code || MSG_SERVER_ERR), null, 'bad');
      else showErr(MSG_OFF_FIRST_LOGIN);
      return;
    }
    // ⚠️ ארבעה מצבים שונים, וארבע הודעות שונות.
    // «שם המשתמש אינו במטמון» ו«אין למשתמש טביעה» **אינם** אומרים שהסיסמה
    // שגויה — הם אומרים שאין כאן במה לאמת אותה. הודעת «שם משתמש או סיסמה
    // שגויים» במצבים האלה היא שקר שמוביל את המשתמש לנסות סיסמאות שוב ושוב.
    var cu = null;
    try {
      cu = cache.find(function(u){ return u && u.username === username; });
    } catch(eF) { console.warn('[login] cache.find failed:', eF); }
    if (!cu) {
      hrLoginLog('login_fail', 'unknown_user_offline', hrLoginDetails(username));
      showErr(MSG_OFF_UNKNOWN);
      return;
    }
    // ⛔ ההשוואה היא מול **טביעת PBKDF2** ולא מול סיסמה שמורה —
    // אין `password_hash` במטמון כלל. ר' הפרק בראש מודול הכניסה.
    var verdict = await hrVerifyOffline(cu, pass);
    if (verdict === 'no-fp') {
      hrLoginLog('login_fail', 'no_fp_offline', hrLoginDetails(username));
      showErr(MSG_OFF_NO_FP); return;
    }
    if (verdict === 'no-crypto') {
      hrLoginLog('login_fail', 'no_crypto_offline', hrLoginDetails(username));
      showErr(MSG_OFF_NO_CRYPTO); return;
    }
    if (verdict !== 'ok') {
      hrLoginLog('login_fail', 'wrong_credentials_offline', hrLoginDetails(username));
      showErr('❌ ' + MSG_BAD_LOGIN); return;
    }
    var lu = cu;
    ctxSwitch();
    AUTH.user = lu;
    AUTH.offlineLogin = true;
    hrUsersCacheSave(lu);   // מנקה `password_hash` שנשאר ממטמון ישן גם באופליין
    hrLoginLog('login_ok', 'offline', hrLoginDetails(username));
    toast(serverErr ? MSG_SERVER_DOWN_LOCAL
                    : MSG_OFFLINE_LOGIN_LATER, null, 'bad');
  }
  var u = AUTH.user;
  dbg('⏳ [2/4] משתמש אומת — טוען הרשאות...');
  try { await loadPerms(); } catch(e) { console.warn('[login] loadPerms failed:', e); }
  dbg('⏳ [3/4] מנווט לדף הבית...');
  stopLoad();
  // הסתרת מסך הכניסה + מעבר לדף הבית חייבים לרוץ תמיד — לא תלויים בעדכוני תצוגה
  // משניים (שם משתמש/תפקיד). כל אחד מהם עטוף כך ששגיאה בודדת לא תעצור את האתחול
  // (הבאג: data.role — data מוגדר רק בענף האונליין — הפיל את כל הזנב באופליין).
  document.getElementById('auth-screen').classList.add('hidden');
  shellBare(false);
  try {
    var wrap = document.getElementById('user-avatar-wrap');
    var hdru = document.getElementById('hdr-username');
    if (hdru) hdru.textContent = u.full_name;
    if (wrap) wrap.classList.remove('hidden');
    var mn = document.getElementById('user-menu-name');
    if (mn) mn.textContent = u.full_name;
    var mr = document.getElementById('user-menu-role');
    if (mr) mr.textContent = AUTH.ROLE_LABELS[u.role] || u.role;
    var hr = document.getElementById('hdr-role'); if (hr) hr.textContent = AUTH.ROLE_LABELS[u.role] || '';
  } catch(e) { console.warn('[login] header update failed:', e); }
  try { lkReset(); } catch(e) { console.warn('[login] lkReset:', e); }
  try { initDateFields(); } catch(e) { console.warn('[login] initDateFields:', e); }
  dbg('⏳ [4/4] טוען נתונים...');
  showPage('home');
}

// ---- יציאה ----
function doLogout() {
  ctxSwitch();
  AUTH.user = null;
  lkStop();
  document.getElementById('auth-screen').classList.remove('hidden');
  shellBare(true);
  var wrap = document.getElementById('user-avatar-wrap');
  if (wrap) wrap.classList.add('hidden');
  document.getElementById('auth-user').value = '';
  document.getElementById('auth-pass').value = '';
  document.getElementById('auth-err').textContent = '';
  showPageInternal('home');
}

// ---- נעילה אוטומטית ----
// ⭐ המנגנון עבר לליבה המשותפת — `lkReset()` היא הידית שקוד
//    האפליקציה קורא לה, ומאזיני הפעילות יושבים בתוך הליבה.

// ---- טעינת הרשאות מ-Supabase (עם נפילה-חזרה לעותק מקומי באופליין) ----
async function loadPerms() {
  // supabase-js לא זורק בכשל רשת אלא מחזיר {data:null, error:{...}} — לכן ה-catch
  // הישן היה קוד מת, והעותק המקומי מעולם לא נטען. חובה לבדוק error במפורש.
  /*  ⛔ הקריאה עוברת ב-`hrCfgGet` ⛔ ואינה שאילתה שנייה — ⚠️ זו הייתה
   *  נקודת הפעלה שנייה לאותה טבלה, ⭐ ו-`single` שבה סימן על מפתח שאינו
   *  קיים **שגיאה**: ⛔ המסלול נפל לעותק המקומי כאילו אין רשת. */
  var res = null;
  try {
    res = await hrCfgGet('perms', true);
  } catch(e) {
    res = null; // פסק זמן או זריקה אמיתית
  }
  if (res && res.ok && res.value) {
    try {
      // hrApplyPerms שומר גם את העותק המקומי ומחיל על התצוגה — מימוש אחד
      hrApplyPerms(res.value);
      return;
    } catch(eP) { console.warn('[perms] ערך פגום בענן:', eP); }
  }
  // אין רשת / פסק זמן / שגיאת שרת / ערך פגום — עותק מקומי, ואם אין: ברירות מחדל
  try {
    var c = lsGet('hr_perms_cache');
    if (c) {
      hrApplyPerms(JSON.parse(c));
      console.log('[perms] נטען מעותק מקומי', res && res.ok ? '(אין ערך בענן)' : '(אין רשת)');
      return;
    }
  } catch(e2) { console.warn('[perms] עותק מקומי פגום:', e2); }
  console.log('[perms] נטענו ברירות מחדל');
  // ברירות המחדל לא נכתבות ל-hr_perms_cache: היעדר עותק מקומי הוא מידע אמיתי
  // ("מעולם לא נטענה מטריצה"), ואין להסוות אותו כמטריצה שנשמרה.
  AUTH.perms = AUTH.DEFAULT_PERMS;
}

// ---- showPage עם בדיקת הרשאות ----
function showPageInternal(pg) {

  document.querySelectorAll('[data-pg]').forEach(function(b){b.classList.remove('on');});

// דפים בבנייה — רק settings ו-home פתוחים
var UNDER_CONSTRUCTION = ['exams','files','reports'];

function showPage(pg) {
  if (pg === 'home') { showPageInternal('home'); loadDash(); return; }
  if (!AUTH.user) { return; }
  if (UNDER_CONSTRUCTION.indexOf(pg) !== -1) { showConstruction(); return; }
  if (!canAccess(pg)) { showDenied(); return; }
  showPageInternal(pg);
  renderPage(pg);

 *  ⛔ **ומה מפיל**: `showPage` — ⭐ הוא בודק הרשאה ומנווט, ⚠️ ורענון

// ---- לוח שנה עברי ויזואלי לטופס סטאטוס ----
// שמות חודשים / ימים — אותן טבלאות תצוגה של hebDate (מקור אמת יחיד)
/* ══════════════════════════════════════════════════════════════════════════
   בורר התאריך העברי — לוח קופץ (`_hc*`)
   ══════════════════════════════════════════════════════════════════════════ */
function _hcMN(hy){return window.hebMonthNames(hy);};
window._hcVw={};
// בניית נתוני שנה עברית מלוח הדפדפן: {hy,lb,jd (א׳ תשרי),ml[],leap}
window._hrYearCache={};
function hrHebYearInfo(hy){
  hy=+hy;
  if(window._hrYearCache[hy]!==undefined) return window._hrYearCache[hy];
  var info=null;
  try{
    var leap=window.hebIsLeap(hy),nM=leap?13:12,start=null,k,d,r;
    // א׳ תשרי חל תמיד בין 5.9 ל-5.10 בשנה הגרגוריאנית hy-3761
    for(k=0;k<45;k++){
      d=dayNoon(hy-3761,8,1+k);
      r=window.hebIntl(d);
      if(r&&r.hy===hy&&r.mi===0&&r.day===1){start=d;break;}
    }
    if(start){
      var ml=[],cur=start,total=0,ok=true;
      for(var m=0;m<nM;m++){
        var p=new Date(cur.getTime()+29*86400000);
        var pr=window.hebIntl(dayNoon(p));
        if(!pr){ok=false;break;}
        var len=(pr.day===1)?29:30;
        ml.push(len);total+=len;
        var nx=new Date(cur.getTime()+len*86400000);
        cur=dayNoon(nx);
      }
      if(ok&&ml.length===nM&&total>=353&&total<=385)
        info={hy:hy,jd:new Date(start.getFullYear(),start.getMonth(),start.getDate()),ml:ml,leap:leap};
    }
  }catch(e){info=null;}
  window._hrYearCache[hy]=info;
  return info;
};
// מציאת בסיס שנה — לוח הדפדפן, ובנפילה-חזרה טבלת המנוע
// ⛔ הטבלה נקראת דרך `hebYearBase` ⛔ ולא ישירות — ⚠️ `_hcST` הוא מצבו
// הפנימי של המודול, ⭐ וקריאה ישירה בו היא תלות שבורה שאינה זורקת.
function _hcBase(hy){return hrHebYearInfo(hy)||window.hebYearBase(hy);};
// עברי → גרגוריאני Date
// העוגן הוא צהריים ולא חצות: הוספת מכפלות של 24 שעות מחצות "נופלת" ליום הקודם
// במעבר לשעון חורף (24 שעות = 23 שעות שעון) — זה החזיר תאריך מוקדם ביום.
function _hcG(hy,mi,day){
  var b=_hcBase(hy);if(!b)return new Date();
  var c=0;for(var m=0;m<mi;m++)c+=b.ml[m];c+=day-1;
  var anchor=dayNoon(b.jd);
  var d=new Date(anchor.getTime()+c*86400000);
  return dayNoon(d);};
// גרגוריאני → עברי {hy,mi,day} — עובר דרך המקור היחיד
function _hcH(d){
  var h=window.hebDate(d);
  return {hy:h.year,mi:h.monthIndex,day:h.day};};
// תווית שנה — ⛔ הצורה האחת של המנוע
function _hcYL(hy){return window.hebYearLabelFull(hy)||String(hy);};
// פורמט תצוגה
function _hcFmt(hy,mi,day){return window.hebDayLabel(day)+' ב'+(_hcMN(hy)[mi]||'')+' '+_hcYL(hy);};
// ניווט חודש
function _hcNav(pfx,dir){
  var v=window._hcVw[pfx]||{hy:5786,mi:0},mi=v.mi+dir,hy=v.hy;
  var curMax=(_hcBase(hy)||{ml:[]}).ml.length-1;
  if(mi<0){hy--;var pb=_hcBase(hy);if(!pb)return;mi=pb.ml.length-1;}
  if(mi>curMax){hy++;if(!_hcBase(hy))return;mi=0;}
  window._hcVw[pfx]={hy:hy,mi:mi};_hcDraw(pfx);};
// ציור הלוח
function _hcDraw(pfx){
  var v=window._hcVw[pfx],b=_hcBase(v.hy);if(!b)return;
  var pop=document.getElementById(pfx+'_pop');if(!pop)return;
  var mlen=b.ml[v.mi],fdow=_hcG(v.hy,v.mi,1).getDay();
  var selIso=(document.getElementById(pfx+'_iso')||{}).value;
  var selH=selIso?_hcH(new Date(selIso)):null;
  var todH=_hcH(new Date());
  var bs='hc-nav';
  var maxMi=(b.ml.length-1);
  var hasPrev=v.mi>0||!!_hcBase(v.hy-1),hasNext=v.mi<maxMi||!!_hcBase(v.hy+1);
  // בגריד RTL: DOM[0]=ימין=ראשון, DOM[6]=שמאל=שבת
  // מספר תאים ריקים = fdow (0=ראשון → 0 ריקים, 6=שבת → 6 ריקים)
  var rtlOffset=fdow;
  var h='<div class="hc-cal">';
  // כותרת ניווט — חץ ימני=חודש הקודם, שמאלי=הבא
  h+='<div class="hc-head">';
  h+='<button data-act="hc-nav" data-pfx="'+esc(pfx)+'" data-dir="-1" class="'+bs+(hasPrev?'':' hc-nav-off')+'"'+(hasPrev?'':' disabled')+'>›</button>';
  h+='<span class="hc-month">'+_hcMN(v.hy)[v.mi]+'&nbsp;'+_hcYL(v.hy)+'</span>';
  h+='<button data-act="hc-nav" data-pfx="'+esc(pfx)+'" data-dir="1" class="'+bs+(hasNext?'':' hc-nav-off')+'"'+(hasNext?'':' disabled')+'>‹</button>';
  h+='</div>';
  // כותרת ימים: DOM[0]=ימין=א׳(ראשון) → DOM[6]=שמאל=ש׳(שבת)
  h+='<div class="hc-dow-row">';
  ['א','ב','ג','ד','ה','ו','ש'].forEach(function(x){h+='<div class="hc-dow">'+x+'</div>';});
  h+='</div>';
  // תאים
  h+='<div class="hc-grid">';
  for(var i=0;i<rtlOffset;i++)h+='<div></div>';
  for(var d=1;d<=mlen;d++){
    var isSel=selH&&selH.hy===v.hy&&selH.mi===v.mi&&selH.day===d;
    var isToday=todH.hy===v.hy&&todH.mi===v.mi&&todH.day===d;
    var st=isSel?'hc-day-sel':isToday?'hc-day-today':'hc-day';
    h+='<button data-act="hc-pick" data-pfx="'+esc(pfx)+'" data-hy="'+v.hy+'" data-mi="'+v.mi+'" data-day="'+d+'" '+
      'class="hc-day-btn '+st+'">'+window.hebDayLabel(d)+'</button>';
  }
  h+='</div></div>';pop.innerHTML=h;};
/*  ⛔ סוג הסטטוס עובר במחלקה ⛔ ולא בשלוש מפות גוונים — ⚠️ שלוש המפות
 *  החזיקו את אותם שלושה מצבים בשלושה ליטרלים כל אחת, ⭐ והמחלקה מציבה
 *  `--ty` אחד שכל התפקידים קוראים: ⛔ סוג שאינו מוכר נופל לברירת המחדל
 *  שב-`abs-tone`, ⚠️ ואינו מייצר גוון רביעי. */
function tyCls(t) {
  return (t === 'approved' || t === 'suspended' || t === 'left') ? 'abs-tone-' + t : '';
}
/*  ⛔ גוון הסימון עובר במחלקה ⛔ ולא בליטרל — ⚠️ שבעת הקודים חזרו בשש
 *  מפות זהות, ⭐ וכולן ירדו: ⛔ הגוון יושב באסימון `--at-<קוד>`, ⚠️ והמחלקה
 *  מציבה אותו ב-`--at` — ⭐ וקוד שאינו מוכר נשאר בברירת המחדל. */
function atvCls(code) {
  var v = ['p', 'l', 'e', 'x', 'ap', 'ak', 'a'].indexOf(code) < 0 ? '' : 'at-code-' + code;
  return 'at-code' + (v ? ' ' + v : '');
}
/*  ⛔ מצב הפתיחה נקרא מהתצוגה המחושבת ⛔ ולא מהסגנון המוטבע — ⚠️ אלמנט
 *  שהוסתר במחלקה מחזיר מחרוזת ריקה, ⭐ והשוואה ל-`'none'` קוראת אותו
 *  כפתוח: ⛔ ואז הלחיצה הראשונה מסתירה את מה שכבר מוסתר, ⚠️ והשנייה
 *  היא זו שפותחת. ⛔ **והיא פרטית כאן** — ⚠️ בשלוש האחרות אין מסלול
 *  שקורא מצב פתיחה מאלמנט שהוסתר במחלקה. */
function uiShown(el) {
  if (!el) return false;
  return getComputedStyle(el).display !== 'none';
}
// פתיחה/סגירה
function _hcOpen(pfx){
  var pop=document.getElementById(pfx+'_pop');if(!pop)return;
  if(uiShown(pop)){pop.classList.add('hidden');return;}
  document.querySelectorAll('.hc-pop').forEach(function(p){p.classList.add('hidden');});
  var iso=(document.getElementById(pfx+'_iso')||{}).value;
  var vh=iso?_hcH(new Date(iso)):_hcH(new Date());
  window._hcVw[pfx]={hy:vh.hy,mi:vh.mi};_hcDraw(pfx);
  // מיקום fixed — מחושב מהטריגר, חסין לכל overflow:hidden בהורים
  // ⛔ והערכים למשתני CSS ⛔ ולא לתגית — ⚠️ הכלל של `.hc-pop` קורא אותם.
  var trg=document.getElementById(pfx+'_trg');
  if(trg){
    var r=trg.getBoundingClientRect();
    pop.style.setProperty('--pop-top',(r.bottom+4)+'px');
    pop.style.setProperty('--pop-right',(window.innerWidth-r.right)+'px');
  }
  pop.classList.remove('hidden');};
// בחירת יום
function _hcPick(pfx,hy,mi,day){
  var g=_hcG(hy,mi,day);
  var iso=dayIso(g);
  var el=document.getElementById(pfx+'_iso');if(el)el.value=iso;
  var lb=document.getElementById(pfx+'_lbl');
  if(lb){
    var lbTxt=_hcFmt(hy,mi,day);
    if(pfx==='at_date'||pfx==='sfmF'||pfx==='sfmT'){var _AT_DOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];lbTxt='יום '+_AT_DOW[dayNoon(iso).getDay()]+' '+lbTxt;}
    lb.textContent=lbTxt;
  }
  var pop=document.getElementById(pfx+'_pop');if(pop)pop.classList.add('hidden');
  // רענון רשימת סדרים לתאריך הנבחר
  if(pfx==='at_date'&&typeof atRenderTodaySessions==='function') atRenderTodaySessions();};
// קריאת ערך → ISO string
// שדה ריק = "לא נבחר תאריך" → null. הנפילה-חזרה הישנה ל-new Date() הפכה
// "בלי תאריך סיום" ל"מסתיים עכשיו": הסטטוס פג באותו רגע, התלמיד הוצג כנוכח
// ולא הופיע באף רשימת השגחה — בזמן שהוצג "✅ סטאטוס נשמר".
// כל צרכני a.to כבר מפרשים null כ"ללא תאריך סיום".
function _hcGet(pfx){
  var iso=(document.getElementById(pfx+'_iso')||{}).value;
  if(!iso) return null;
  var t=(document.getElementById(pfx+'_t')||{}).value;
  return iso+'T'+(t||'00:00');};
// הצג/הסתר בורר סיום
function _hcToggle(){
  var btn=document.getElementById('sfmT_btn'),wr=document.getElementById('sfmT_wrap');
  if(!btn||!wr)return;
  var open=!uiShown(wr);
  wr.classList.toggle('hidden',!open);
  btn.classList.toggle('on',open);
  if(open){
    btn.textContent='✕ הסר תאריך סיום';
  } else {
    btn.textContent='+ הוסף תאריך סיום';
    // ניקוי הערכים
    var isoEl=document.getElementById('sfmT_iso'),tEl=document.getElementById('sfmT_t'),lbl=document.getElementById('sfmT_lbl');
    if(isoEl)isoEl.value='';if(tEl)tEl.value='';if(lbl)lbl.textContent='בחר תאריך עברי';
  }};
// בניית HTML: כפתור-טריגר + פופאפ + שעה
function _hcBuild(pfx,initH,tv){
  var label;
  if(initH){
    label=_hcFmt(initH.hy,initH.mi,initH.day);
    if(pfx==='sfmF'||pfx==='sfmT'||pfx==='at_date'){var _BD_DOW=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];var _bdG=_hcG(initH.hy,initH.mi,initH.day);label='יום '+_BD_DOW[_bdG.getDay()]+' '+label;}
  }else{label='בחר תאריך עברי';}

      '<span id="'+pfx+'_lbl">'+label+'</span>'+
      '<span class="hc-trigger-ico">📅</span>'+
    '</div>'+
    '<input type="hidden" id="'+pfx+'_iso" value="'+iso+'">'+
    '<div id="'+pfx+'_pop" class="hidden hc-pop-box hc-pop"></div>'+
    (tv!==undefined?'<div class="hc-time-row"><span class="hc-time-lbl">שעה:</span><input type="time" aria-label="שעה" id="'+pfx+'_t" value="'+(tv||'')+'" class="hc-time-inp"></div>':'')+
  '</div>';};
// סגירה בלחיצה מחוץ ללוח
document.addEventListener('mousedown',function(e){

/* ══════════════════════════════════════════════════════════════════════════

function saveStudentStatus(type) {
  var reason = document.getElementById('sfm-reason').value;
  if (!reason) { toast(MSG_PICK_REASON, null, 'bad'); return; }
  var from = _hcGet('sfmF');
  if (!from) { toast(MSG_PICK_START_DATE, null, 'bad'); return; }
  var toWrap = document.getElementById('sfmT_wrap');
  var toOpen = uiShown(toWrap);
  var to = toOpen ? _hcGet('sfmT') : null;
  // שורת סיום פתוחה בלי תאריך נבחר — לא לשמור בשקט כאילו הכול תקין
  if (toOpen && !to) { toast(MSG_PICK_END_DATE, null, 'bad'); return; }
  var sid = window._statusSid;

  var students = getStudents();
  var s = students.find(function(x){return idEq(x.id, sid);});
  if (!s) return;

  if (!Array.isArray(s.absences)) s.absences = [];
  /*  ⛔ חותמת לפריט ⛔ ולא לרשומה בלבד — ⚠️ בלעדיה המיזוג פר-פריט אינו יכול
   *  להכריע, ⭐ ומיזוג ברמת הרשומה היה מחליף את המערך כולו. */
  var nw = {id: Date.now(), type: type, reason: reason, from: from, to: to || null,
            createdBy: hrWho(), updatedAt: Date.now()};
  /*  ⛔ היעדרות באותו ערך אינה נכתבת פעמיים — ⚠️ **וההשוואה על הערך**
   *  ⛔ ולא על ה-`id`: ⭐ המזהה נגזר מהשעון, ולכן שתי לחיצות הן שני
   *  מזהים ופריט אחד — ⛔ והמסך היה מציג אותה היעדרות פעמיים,
   *  ⚠️ והמחיקה מסירה אחת מהן בלבד. */
  if (uniqHas(s.absences.filter(function (a) { return a && !a.deleted; }), nw, hrAbsValueKey)) {
    toast(MSG_ABSENCE_DUP, null, 'bad'); return;
  }
  s.absences.push(nw);
  s.present = false;
  s.updatedAt = Date.now();

  saveStudents(students);
  hrRefreshApprovalMarks(sid); // רענון סדרים פתוחים של היום
  return '✅ סטאטוס נשמר ל-' + s.name + (to ? '' : ' — ללא תאריך סיום');
}

async function confirmSwitch() {
  var pass=document.getElementById('switch-pass').value.trim();
  var errEl=document.getElementById('switch-err');
  if(!pass){errEl.textContent=H(1504,1488,32,1492,1499,1504,1505,32,1505,1497,1505,1502,1488);return;}
  var res=null, netFail=false;
  try {
    // ⭐ לפי מזהה בלבד; ההשוואה היא מול הטביעה, כמו בכניסה.
    res=await withTimeout(SB.from('hr_users').select('*').eq('client_id',window._hrSwitchId).eq('active',true).single());
  } catch(eSw){ netFail=true; } // כולל פסק זמן
  if(!netFail&&res&&res.error&&isNetErr(res.error)) netFail=true;
  var u=null;
  // ‎.single() מחזיר error גם כשאין שורה, ולכן אין כאן תשובה סמכותית להבחין בה:
  // כל כישלון מנסה את העותק המקומי, ורק אם גם הוא לא מתאים מוצגת שגיאה.
  if(netFail){
    // אין רשת / פסק זמן — אימות מול העותק המקומי.
    // ⚠️ המטמון מחזיק את **כל** המשתמשים הפעילים, ולכן מעבר
    // משתמש אופליין עובד. האימות הוא מול **טביעת PBKDF2** — אין כאן
    // סיסמה שמורה להשוות אליה. שלושת מצבי הכישלון שאינם «סיסמה שגויה»
    // מקבלים הודעה משלהם: הודעת סיסמה על מצב שאינו כזה היא **כשל שקט**
    // שמוביל את המשתמש להקליד שוב ושוב סיסמה נכונה לחלוטין.
    var cache=hrUsersCacheGet();
    var cu=null;
    try {
      cu=(Array.isArray(cache)?cache:[]).find(function(x){return x&&String(x.client_id)===String(window._hrSwitchId);});
    } catch(eF){ console.warn('[switch] cache.find failed:', eF); cu=null; }
    if(!cu){errEl.textContent=MSG_OFF_UNKNOWN;return;}
    var verdict=await hrVerifyOffline(cu,pass);
    if(verdict==='no-fp'){errEl.textContent=MSG_OFF_NO_FP;return;}
    if(verdict==='no-crypto'){errEl.textContent=MSG_OFF_NO_CRYPTO;return;}
    if(verdict!=='ok'){errEl.textContent=H(1505,1497,1505,1502,1488,32,1513,1490,1493,1497,1492);return;}
    u=cu;
    AUTH.offlineLogin=true;
  } else {
    if(res.error||!res.data){errEl.textContent=H(1505,1497,1505,1502,1488,32,1513,1490,1493,1497,1492);return;}
    // ⭐ ההכרעה מול הטביעה, בדיוק כמו בענף האופליין שמעל.
    var vOn=await hrVerifyOffline(res.data,pass);
    if(vOn==='no-fp'){errEl.textContent=MSG_NO_FP_ONLINE;return;}
    if(vOn==='no-crypto'){errEl.textContent=MSG_NO_CRYPTO;return;}
    if(vOn!=='ok'){errEl.textContent=H(1505,1497,1505,1502,1488,32,1513,1490,1493,1497,1492);return;}
    u=res.data;
    AUTH.offlineLogin=false;
    // ⚠️ **לפני** ‎AUTH.user=u‎ שלמטה — ולכן שומרים את `u` במפורש ולא קוראים
    // ל-`hrRefreshUsersCache()`, שהייתה מרעננת את המשתמש **הקודם**.
    hrUsersCacheSave(u);
  }
  closeModal();
  ctxSwitch();
  AUTH.user=u;
  // ⚠️ **אחרי** ‎AUTH.user=u‎ ולא לפניו — ר' ההערה בענף האונליין למעלה.
  // הרענון המלא מושך את כל המשתמשים הפעילים; באופליין אין רשת
  // והקריאה נופלת בשקט, ולכן היא מותנית.
  if(!AUTH.offlineLogin) hrRefreshUsersCache();
  await loadPerms();
  var hdru=document.getElementById('hdr-username');
  if(hdru) hdru.textContent=u.full_name;
  var mn=document.getElementById('user-menu-name');
  if(mn) mn.textContent=u.full_name;
  var mr=document.getElementById('user-menu-role');
  if(mr) mr.textContent=AUTH.ROLE_LABELS[u.role]||u.role;
  lkReset();
  showPage('home');
  toast(H(9989,32,1504,1499,1504,1505,1514,32,1499,45)+u.full_name, null, 'good');
}

   מהמשתמש המחובר בלבד, ואין שכבה שנייה מעליה.

   **הנימוק — שתי סיבות, וכל אחת מהן מספיקה לבדה:**
   1. שער כזה הוא **שכבת הרשאה כפולה** — מנגנון שני עם מסך משלו,
      מסלול שינוי משלו ותחזוקה משלו, לאותו אדם.
   2. **בהתקנה טרייה שער כזה נופל חזרה לערך ברירת מחדל** — ⚠️ ונפתח
      לכל מי שמקליד אותו: ⛔ הגנה שתלויה בכך שמישהו הריץ שורת זריעה
      בקובץ הסכימה אינה הגנה.

   ⛔ **ואין לזרוע ערך ברירת מחדל לסיסמה או לתפקיד בשום מקום** — לא
   בסכימה, לא במיגרציה, לא בקוד ולא בקובץ בדיקה. ברירת מחדל
   לסיסמה היא חשבון שסיסמתו ידועה לכל העולם;
   ברירת מחדל לתפקיד היא הרשאה שניתנת למי שאיש לא החליט
   להעניק לו אותה. תפקיד נכתב **במפורש** ביצירת המשתמש.

   ⚠️ **הערה זו זהה בית-לבית בכל האפליקציות** פרט לשורת «כאן:» שבסופה.
   לקח אבטחתי שנלמד באפליקציה אחת נרשם בכולן — גם כשהמנגנון עצמו

function sortUsersByOrder(data) {
  var order = getUserOrder();
  if (!order.length) return data;
  return data.slice().sort(function(a,b) {
    var ia = order.indexOf(String(a.id));
    var ib = order.indexOf(String(b.id));
    if (ia===-1) ia = 9999;
    if (ib===-1) ib = 9999;
    return ia - ib;
  });
}
/* ══════════════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════════════
   ⛔ מזהה רשומה עובר ב-`data-id` ובדלגציה — ⛔ לעולם לא מוטבע ב-`onclick`.
   ⛔ **וכל ערך שחוזר מ-`data-*` הוא מחרוזת** — ⚠️ וזה בדיוק
   המקום שבו ההמרה נשברת בשקט: `idx + dir` על המחרוזת `"-1"` הוא שרשור
   ולא חיבור, ו-`!current` על המחרוזת `"false"` הוא `false`. ⛔ שני
   הארגומנטים האלה מומרים כאן במפורש, ⛔ ואין להסיר את ההמרה.
   ⚠️ **וההמרה הושלמה** — ⛔ אפס אתרי `onclick` בקובץ.

/*  ⛔⛔ **פעולה מגיבה מיד** — ⚠️ הנימוק המדוד: עשרה מסלולים
 *  שמופעלים מלחיצה המתינו לרשת **לפני** כל חיווי — ⭐ המשתמש לחץ, הנתון
 *  נשמר לדיסק, ⛔ והוא לא ראה שזה קרה ⚠️ ולחץ שוב. ⭐ והחיווי יושב
 *  **בנקודת הניתוב האחת** ⛔ ולא בעשרה מסלולים: ⚠️ מטפל שיתווסף מקבל
 *  אותו מעצמו, ⛔ ואין נקודת הפעלה שנייה.
 *  ⛔ **והחיווי מותנה בכך שהמטפל החזיר הבטחה** — ⚠️ מטפל סינכרוני מחזיר
 *  `undefined` ⛔ ואינו מהבהב: ⭐ «⏳» על פעולה מיידית הוא רעש שמלמד
 *  להתעלם ממנו.
 *  ⛔ **ורק על `BUTTON`** — ⚠️ `disabled` על `div` אינו חוסם דבר,
 *  ⭐ והחלפת תוכנו הייתה מוחקת סימון או אייקון. */
/*  ⛔ מאזין הקליק האחד של האפליקציה — ⚠️ ארבעה מסלולים בסדר מוצהר:
 *  ⭐ סגירת התפריטים הצפים קודמת, שהיא חלה על כל לחיצה בדף; ⛔ ואז סגירת
 *  הרקע, ⚠️ שאינה נושאת `data-act`; ⭐ ולבסוף הניתוב. */
document.addEventListener('click', function (ev) {
  var wrap = document.getElementById('user-avatar-wrap');
  if (wrap && !wrap.contains(ev.target)) closeUserMenu();
  var sw = document.getElementById('sw-inner');
  var dd = document.getElementById('search-dropdown');
  if (dd && sw && !sw.contains(ev.target)) dd.classList.remove('open');
  if (modalBackdrop(ev)) return;
  var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var fn = DOM_ACTIONS[el.getAttribute('data-act')];
  if (!fn) return;
  ev.preventDefault();
  actRun(el, fn);
});

/*  ⛔ מאזין המקלדת האחד של האפליקציה — ⚠️ הוא קורא לשני המסלולים
 *  המשותפים בסדר מוצהר: ⭐ שמירה בשדה עריכה קודמת לסגירת המודאל,
 *  ⛔ שאחרת `Escape` בשדה שבתוך מודאל היה סוגר אותו במקום לבטל את השדה. */
document.addEventListener('keydown', function (e) {
  if (ksKey(e)) return;
  modalEsc(e);
  /*  ⛔ `Enter` בשדה הדקות מאשר את האיחור — ⚠️ השדה אינו בהיקף `ksave`,
   *  ⭐ ואין לו כפתור שמירה: ⛔ והמסלול הזה הוא מה שהחליף מטפל בתגית. */
  if (e.key !== 'Enter' || !e.target || !e.target.dataset || !e.target.dataset.kent) return;
  e.preventDefault();
  if (e.target.dataset.kent === 'at-late') atConfirmLate(e.target.dataset.id);
  else if (e.target.dataset.kent === 'sl-late') hrConfirmLate(e.target.dataset.id);
});

/*  ⛔ מאזין ההקלדה האחד — ⚠️ שדות שנבנים ב-JS ונמחקים בכל רינדור:
 *  ⭐ מאזין שנקשר אליהם מת איתם, ⛔ ומטפל בתגית מכריח גשר על `window`. */
document.addEventListener('input', function (e) {
  var el = e.target; if (!el || !el.dataset) return;
  var k = el.dataset.inp;
  if (k === 'search-st') onSearchInput();
  else if (k === 'at-late') atSetLateMin(el.dataset.id, el.value);
  else if (k === 'sl-late') hrSetLateMin(el.dataset.id, el.value);
  else if (k === 'sl-note') hrSetNote(el.dataset.id, el.value);
});

/*  ⛔ מאזין השינוי האחד — ⚠️ בחירת קובץ הייבוא היא האתר היחיד. */
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el && el.dataset && el.dataset.chg === 'import-students') importStudentsFromFile(el);
});

function moveUser(id, dir) {
  var el = document.getElementById('users-list');
  var rows = Array.from(el.querySelectorAll('.ur'));
  var ids = rows.map(function(r){ return r.getAttribute('data-row-id'); });
  var idx = ids.indexOf(String(id));
  if (idx < 0) return;
  var swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= ids.length) return;
  var tmp = ids[idx]; ids[idx] = ids[swapIdx]; ids[swapIdx] = tmp;
  saveUserOrder(ids);
  renderUsersList();
}

async function renderUsersList() {
  var el = document.getElementById('users-list');
  if (!el) return;
  el.innerHTML = '<div class="ld">טוען...</div>';
  // הפירוק הישן `var {data} = await ...` בלע את res.error (supabase-js לא זורק),
  // וכשל רשת הוצג כ"אין משתמשים" — מנהל קורא את זה כאילו הטבלה נמחקה.
  var res;
  try { res = await withTimeout(SB.from('hr_users').select('*').order('full_name')); }
  catch (e) { res = { error: { message: (e && e.message) || 'timeout' } }; }
  if (!res || res.error || !Array.isArray(res.data)) {
    var em = (res && res.error && (res.error.message || res.error.code)) || MSG_NO_LINK;
    el.innerHTML = '<div class="load-err ld">❌ לא ניתן לטעון את רשימת המשתמשים' +
      '<div class="load-err-detail">' + esc(em) + '</div>' +
      '<button data-act="users-render" class="retry-btn">נסה שוב</button></div>';
    return;
  }
  var data = res.data;
  if (!data.length) { el.innerHTML = '<div class="ld">אין משתמשים</div>'; return; }
  data = sortUsersByOrder(data);
  el.innerHTML = data.map(function(u) {
    var roleClass = 'role-'+u.role;
    var roleLabel = AUTH.ROLE_LABELS[u.role] || u.role;
    var activeCls = u.active ? '' : ' is-inactive';
    return '<div class="ur'+activeCls+'" data-row-id="'+esc(u.client_id)+'">' +
      '<div class="ur-name">'+esc(u.full_name)+'<br><small class="user-handle">@'+esc(u.username)+'</small></div>' +
      '<span class="ur-role '+esc(roleClass)+'">'+esc(roleLabel)+'</span>' +
      '<div class="ua">' +
        '<button data-act="user-edit" data-uid="'+esc(u.client_id)+'" data-uname="'+esc(u.full_name)+
        '" data-uusername="'+esc(u.username)+'" data-urole="'+esc(u.role)+'">✏️</button>' +
        '<button data-act="user-up" data-id="'+esc(u.client_id)+'" title="הזז למעלה" class="user-move">⬆️</button>' +
        '<button data-act="user-down" data-id="'+esc(u.client_id)+'" title="הזז למטה" class="user-move">⬇️</button>' +
        '<button data-act="user-toggle" data-id="'+esc(u.client_id)+'" data-active="'+(u.active?'1':'0')+'" title="'+(u.active?'השבת':'הפעל')+'">'+(u.active?'🔴':'🟢')+'</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════════════
   ניהול משתמשים, הרשאות ושינוי סיסמה
   ══════════════════════════════════════════════════════════════════════════
   ⭐ שלושת מסלולי הכתיבה של הסיסמה יושבים כאן: `saveUser` (יצירה ועריכה
   ע"י מנהל), `toggleUserActive` (השבתה) ו-`changeMyPassword` (שינוי
   עצמי). ⛔ בכל אחד מהם הטביעה נגזרת **ליד הסיסמה** ובאותה פעולה
   — טביעה שנגזרת מאוחר יותר, במסלול נפרד, היא חלון שבו הכניסה האופליין
   עובדת עם הסיסמה **הקודמת**.
   ⛔ ואף אחד מהם אינו **קורא** את `password_hash` כדי לאמת ⛔ ואף אינו
   כותב אליה: ⭐ העמודה ירדה בהחלטת המנהל, ⚠️ והחזרת כתיבה אליה תיפול
   על עמודה שאינה קיימת.
   ══════════════════════════════════════════════════════════════════════════ */

/*  ⛔ מגן השליחה הכפולה יושב בנקודת הניתוב ⛔ ולא כאן — ⚠️ היא מחזירה את
 *  ההבטחה, ⭐ והניתוב מנטרל את הכפתור עד שהסתיימה: ⛔ שומר שני הוא שתי
 *  הכרעות על אותה ראיה, ⚠️ והשני שבהם משחרר כפתור שהראשון עוד מחזיק. */
async function saveUser() {
  var id = document.getElementById('um-id').value;
  var fullName = document.getElementById('um-name').value.trim();
  var username = document.getElementById('um-username').value.trim();
  var role = document.getElementById('um-role').value;
  var pass = document.getElementById('um-pass').value.trim();
  var errEl = document.getElementById('um-err');
  errEl.textContent = '';
  if (!fullName || !username) { errEl.textContent = 'שם מלא ושם משתמש הם שדות חובה'; return; }
  var obj = {full_name: fullName, username: username, role: role, active: true};
  if (!id && !pass) { errEl.textContent = 'יש להזין סיסמה עבור משתמש חדש'; return; }
  var noFp = false;
  if (pass) {
    if (!PASS_SIX_RE.test(pass)) { errEl.textContent = MSG_PASS_SIX; return; }
    // ⭐ הטביעה נגזרת ליד הסיסמה, בכל יצירה ובכל שינוי — ⛔ ובנקודת
    // הגזירה האחת, שהאיפוס בכשל יושב בה.
    var made = await hrPassFields(pass);
    obj.pass_salt = made.pass_salt; obj.pass_fp = made.pass_fp;
    if (!made.pass_fp) noFp = true;
  }
  if (!navigator.onLine) { errEl.textContent = MSG_OFF_USER_WRITE; return; }
  var res;
  try {
    res = await writeUser(id, obj);
  } catch (e) { errEl.textContent = MSG_OFF_USER_WRITE; return; }
  if (!res || res.error) { errEl.textContent = 'שגיאה: ' + ((res && res.error && res.error.message) || MSG_SERVER_ERR); return; }
  /*  ⚠️ הנפילה-חזרה על עמודות הטביעה יושבת בבלוק המשותף — ⛔ והדגל שהיא
   *  מחזירה הוא מה שמבדיל «נשמר» מ«נשמר בלי הכנה לכניסה ללא רשת». */
  if (res._noFp) noFp = true;
  /*  ⛔ כתיבת משתמש שהצליחה מקדמת את אות הפולינג — ⚠️ טבלת המשתמשים
   *  נמשכת במשיכה המוצלחת, ⭐ ובלי הקידום השינוי נשאר בלתי-נראה לכל
   *  מכשיר אחר עד לשינוי נתונים אחר. */
  await hrTouchLastChanged();
  closeModal();
  /*  ⛔ שתי קריאות ולא שילוש בקריאה אחת — ⚠️ סיווג ההודעה נגזר מהמסלול,
   *  ⭐ ושתי ההודעות כאן הן שני מסלולים: ⛔ קריאה אחת הייתה צובעת את שניהם
   *  באותו צבע. */
  if (noFp) toast(MSG_USER_SAVED_NO_FP, null, 'bad');
  else toast(MSG_USER_SAVED, null, 'good');
  hrRefreshUsersCache();   // הרשומה החדשה/המעודכנת נכנסת לעותק המקומי מיד
  renderUsersList();
}


async function toggleUserActive(id, current) {

  if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
  var res;
  try { res = await writeUser(id, {active: !current}); }

  if (res && res.error) {
    toast(MSG_ACTION_FAILED + (res.error.message || res.error.code || MSG_NO_LINK), null, 'bad');
    return;
  }
  /*  ⛔ כתיבת משתמש שהצליחה מקדמת את אות הפולינג — ⚠️ טבלת המשתמשים
   *  נמשכת במשיכה המוצלחת, ⭐ ובלי הקידום השינוי נשאר בלתי-נראה לכל
   *  מכשיר אחר עד לשינוי נתונים אחר. */
  await hrTouchLastChanged();
  // משתמש שהושבת חייב לרדת מהעותק המקומי — אחרת הוא נשאר בר-כניסה אופליין

}

function renderPermsTable() {
  var p = AUTH.perms || AUTH.DEFAULT_PERMS;

  var html = AUTH.MODULES.map(function(m) {

        row += '<td><span class="um-edit">✏️ עריכה</span></td>';

  }).join('');

async function savePerms() {
  var p = {};
  AUTH.MODULES.forEach(function(m) {
    p[m.id] = {};
    ['admin','manager','junior'].forEach(function(role) {
      var sel = document.querySelector('.ps[data-mod="'+m.id+'"][data-role="'+role+'"]');
      p[m.id][role] = sel ? sel.value : 'none';
    });
    p[m.id]['admin'] = (m.id === 'settings') ? 'edit' : p[m.id]['admin'];
  });
  // upsert דרך hrCfgSet במקום select-ואז-update/insert: ל-`.single()` יש error
  // גם כשהשורה חסרה וגם בכשל רשת, ולכן כשל זמני נפל לענף ה-insert → שגיאת
  // מפתח כפול → נבלעה → "✅ הרשאות נשמרו!" בזמן שהענן לא השתנה.
  var res = await hrCfgSet('perms', p);
  if (res && res.error) {
    // AUTH.perms לא מתעדכן — עדיף להציג את המטריצה שבאמת בתוקף מאשר כזו שלא נשמרה
    toast(MSG_PERMS_SAVE_FAIL + (res.error.message || res.error.code || MSG_NO_LINK) +
          MSG_WILL_RESEND, null, 'bad');
    return;
  }
  // AUTH.perms + hr_perms_cache + רענון התצוגה — הכל דרך hrApplyPerms
  hrApplyPerms(p);
  // hr_perms נמשך עכשיו ב-hrPullFromCloud, ו-`plTick` במכשירים האחרים משווה
  // **רק** מול hr_last_changed. בלי הקידום הזה עדכון הרשאות היה נשאר בלתי-נראה
  // להם עד היציאה-והכניסה הבאה — בדיוק מה שהמעבר לרענון החי בא לפתור.
  await hrTouchLastChanged();
  toast(MSG_PERMS_SAVED, null, 'good');
}

// ---- שינוי סיסמה אישית ----
/*  ⛔ מגן השליחה הכפולה יושב בנקודת הניתוב ⛔ ולא כאן — ⚠️ היא מחזירה את
 *  ההבטחה, ⭐ והניתוב מנטרל את הכפתור עד שהסתיימה. */
async function changeMyPassword() {
  /*  ⛔⛔ המשתמש נלכד **בכניסה** ⛔ ואינו נקרא מהגלובלי אחרי ההמתנות — ⚠️ בין
   *  אימות הסיסמה הנוכחית לכתיבת הטביעה יש שלוש נסיעות לרשת, ⭐ ונעילת
   *  חוסר-הפעילות או כניסה מחדש בחלון הזה היו מפנות את הכתיבה לשורה של
   *  משתמש **אחר**: ⛔ הסיסמה שהוקלדה כאן הייתה נכתבת על חשבונו. */
  var _u = AUTH.user;
  if (!_u || !_u.client_id) { toast(MSG_NO_USER_SESSION, null, 'bad'); return; }
  var c1 = document.getElementById('mp-cur');
  var n1 = document.getElementById('mp-new');
  var n2 = document.getElementById('mp-new2');
  if (!c1 || !n1 || !n2) { uiNoDialog('changeMyPassword', 'mp-cur'); return; }
  var oldPass = c1.value.trim(), newPass = n1.value.trim(), newPass2 = n2.value.trim();
  if (!navigator.onLine) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
  if (!oldPass || !newPass || !newPass2) { toast(MSG_FILL_ALL_X, null, 'bad'); return; }
  if (!PASS_SIX_RE.test(newPass)) { toast(MSG_PASS_SIX, null, 'bad'); return; }
  // ⛔ אימות ולא נוחות — שגיאת הקלדה בסיסמה החדשה נכתבת כמות
  // שהיא, ומרגע זה המשתמש נעול בחוץ בלי דרך לגלות מה הוקלד בפועל.
  if (newPass !== newPass2) { toast(MSG_PASS_MISMATCH_X, null, 'bad'); return; }
  // אותה משפחה כמו renderUsersList: `var {data}` בלע את השגיאה, וכשל רשת הוצג
  // כ"הסיסמה הנוכחית שגויה"; ה-update לא נבדק כלל והציג "✅ עודכנה" גם בכישלון.
  // ⭐ אימות הסיסמה הנוכחית מול הטביעה ולא מול הטקסט הגלוי.
  var chk;
  try { chk = await withTimeout(SB.from('hr_users').select('client_id,active,pass_salt,pass_fp').eq('client_id', _u.client_id).maybeSingle()); }
  catch (e) { toast(MSG_PASS_NEEDS_NET, null, 'bad'); return; }
  if (chk && chk.error) { toast(MSG_PASS_VERIFY_FAIL + (chk.error.message || MSG_SERVER_ERR), null, 'bad'); return; }
  if (!chk || !chk.data) { toast(MSG_PASS_CUR_BAD, null, 'bad'); return; }
  var vOld = await hrVerifyOffline(chk.data, oldPass);
  if (vOld === 'no-fp')     { toast('❌ ' + MSG_OFF_NO_FP, null, 'bad'); return; }
  if (vOld === 'no-crypto') { toast('❌ ' + MSG_OFF_NO_CRYPTO, null, 'bad'); return; }
  if (vOld !== 'ok')        { toast(MSG_PASS_CUR_BAD, null, 'bad'); return; }
  // ⭐ הטביעה נגזרת בכל שינוי סיסמה, ⛔ ובנקודת גזירה אחת — שתי
  // גזירות מקומיות הן שני מקומות שבהם האיפוס בכשל עלול להישכח.
  var made = await hrPassFields(newPass);
  var updObj = { pass_salt: made.pass_salt, pass_fp: made.pass_fp };
  /*  ⛔ אין כאן נפילה-חזרה כשעמודות הטביעה חסרות — ⚠️ עד היום היא כתבה את
   *  הסיסמה הגלויה במקומן, ⭐ ובלעדיה אין **מה** לכתוב: שינוי שלא נכתב
   *  נכשל בקול ⛔ ואינו מדווח «עודכנה» על סיסמה שלא השתנתה. */
  var upd;
    /*  ⛔ המשתמש המחובר התחלף בזמן השינוי — ⚠️ נכשל-סגור: ⭐ עדיף שינוי
   *  שלא נעשה ⛔ מאשר סיסמה שנכתבה על חשבון זר. */
  if (!AUTH.user || AUTH.user.client_id !== _u.client_id) { toast(MSG_USER_SWITCHED_MID, null, 'bad'); return; }
  try { upd = await writeUser(_u.client_id, updObj); }
  catch (e2) { toast(MSG_OFF_USER_WRITE, null, 'bad'); return; }
  if (upd && upd.error) { toast(MSG_PASS_UPDATE_FAIL + (upd.error.message || MSG_SERVER_ERR), null, 'bad'); return; }
  /*  ⛔ כתיבת משתמש שהצליחה מקדמת את אות הפולינג — ⚠️ טבלת המשתמשים
   *  נמשכת במשיכה המוצלחת, ⭐ ובלי הקידום השינוי נשאר בלתי-נראה לכל
   *  מכשיר אחר עד לשינוי נתונים אחר. */
  await hrTouchLastChanged();
  // ⚠️ בלי זה הטביעה שבמטמון נשארת של הסיסמה **הישנה**, והכניסה האופליין
  // הייתה דוחה את הסיסמה החדשה — או, גרוע מכך, מקבלת את הישנה.
  try {
    hrUsersCacheSave({ client_id: _u.client_id, username: _u.username, full_name: _u.full_name,
                       role: _u.role, active: true,
                       pass_salt: made.pass_salt, pass_fp: made.pass_fp });
  } catch (e3) {}
  /*  ⛔ אין ניקוי שדות לפני הסגירה — ⚠️ `closeModal` מרוקן את גוף המודאל,
   *  ⭐ והשדות חדלים להתקיים איתו. */
  closeModal();
  if (made.pass_fp) toast(MSG_PASS_UPDATED_X, null, 'good');
  else toast(MSG_PASS_UPDATED_NO_FP, null, 'bad');
}






// hebrewDate כבר כולל את שם היום — ⛔ ואין להוסיף אותו כאן: "יום X, יום X,"


// רענון נתוני כרטיסי הסיכום בדף הבית
async function refreshDashStats() {
  var todayIso = dayToday();

  // תלמידים פעילים (active !== false)
  var allSts = getStudents();
  var activeSts = allSts.filter(function(s){ return s.active !== false; });

  // נוכחים היום — פעילים ללא כל סטטוס פעיל
  var presentCount = activeSts.filter(function(s){
    var aa = (typeof getActiveAbsences === 'function') ? getActiveAbsences(s) : [];
    return !aa || aa.length === 0;
  }).length;

  // נתוני נוכחות — משתמש ב-cache (window._atData), hrPullFromCloud מרענן אותו
  // סדר שנמחק (tombstone) לא נספר — כמו ב-atRenderTodaySessions/atRenderArchive
  var atData = ((typeof atLoadData === 'function') ? await atLoadData() : [])
    .filter(function(r){ return !(r && r.deleted); });
  var todaySess = atData.filter(function(r){ return r.date_iso === todayIso; });
  var sessCount = todaySess.length;

  // חיסורים היום (e + x) וסה"כ נוכחות (p + l) — כל סדר נספר בנפרד
  var absCount = 0, presMarks = 0;
  todaySess.forEach(function(rec){
    Object.values(hrMarks(rec)).forEach(function(m){
      if(m.s === 'e' || m.s === 'x') absCount++;
      if(m.s === 'p' || m.s === 'l') presMarks++;
    });
  });

  // % נוכחות: מונה = p+l, מכנה = תלמידים פעילים × מספר סדרים
  var rateStr;
  if(sessCount === 0){
    rateStr = '—';
  } else {
    var denom = activeSts.length * sessCount;
    rateStr = denom > 0 ? Math.round(presMarks / denom * 100) + '%' : '0%';
  }

  var totEl = document.getElementById('s-tot');
  var preEl = document.getElementById('s-pre');
  var absEl = document.getElementById('s-abs');

async function loadDash(){
  // ⭐ שכבת המראה ראשונה — ⛔ הטעינה לפני כל קורא: ⚠️ קורא שרץ
  //    לפניה מקבל `undefined` ונופל לברירת המחדל.
  try { mirrorBoot(); } catch (e) { console.warn('[mirror] mirrorBoot', e); }
  // עמידות אחסון: מדידה + פינוי יזום **לפני** המשיכה מהענן, כדי
  // שהכתיבות של hrPullFromCloud ייפלו כבר לתוך אחסון שיש בו מקום.
  try { lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  // סימוני "ממתין לסנכרון" — נטענים לפני המשיכה, כך שרשומה שלא
  // אושרה בסשן הקודם מוצגת כממתינה כבר בשנייה הראשונה.
  try { pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  try { tombBoot(); } catch (e) { console.warn('[tomb] tombBoot', e); }
  /*  ⛔ בדיקת העידן — ⚠️ נקודת ההפעלה היחידה, פעם אחת לעלייה: ⭐ היא
   *  דוחפת תחילה, ⛔ ואינה זורקת דבר אם אחד משלושת התנאים אינו מתקיים. */
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  // גיבוי יומי ויומן פעולות — נקודת ההפעלה היחידה של המודול.
  // ⛔ אין להחזיר אותה למסלול הדחיפה — ר' ההערה
  //    ב-`hrPushToCloud`; שם היא רצה רק כשמישהו כתב, וזה מה שהשבית אותה.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  // ניסיון חוזר בסנכרון — נקודת ההפעלה היחידה של המודול.
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  // נעילת חוסר-פעילות — נקודת ההפעלה היחידה של המודול.
  try { lkBoot(); } catch (e) { console.warn('[lk] lkBoot', e); }
  // מנגנון המשיכה — נקודת ההפעלה היחידה של המודול.
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  await hrPullFromCloud(); // טוען נתונים + refreshDashStats נקרא בתוכה
  renderStudents();
  // עדכון בזמן אמת: `plTick` רץ כל 3 שניות על שורת החותמת בלבד ומפעיל
  // `hrPullFromCloud` → `refreshDashStats` רק בעת שינוי אמיתי.
}

// ⚠️ המסך חסום: 'reports' נמצא ב-UNDER_CONSTRUCTION, ולכן showPage מציג את
//    דיאלוג "המודול בבנייה" ו**חוזר לפני** showPageInternal. כלומר pg-reports
//    לעולם אינו מוצג, וכפתור "📊 הצג" (btn-rpt) שבתוכו אינו ניתן ללחיצה.
//    loadR נשארת במפת הפעולות רק כדי שהתשתית תהיה שלמה כשהמסך ייפתח.
//
// ⛔ **אין להחזיר שאילתות ל-`students` / `attendance`** — הן אינן מקור אמת.
//
// ⚠️ **מקור הנתונים הנכון הוא הטבלאות המובנות**, דרך הגישונים הקיימים:

//      כל רשומה: `{id, date_iso, session, open, deleted, updatedAt, marks:{sid:{s,min}}}`.
//      הסימונים ב-`marks`: `p` נוכח, `e`/`x` חיסור, `l` איחור (`min` דקות),

//      (רשומה בלי `marks` זרקה ורוקנה מסך שלם) ו**לסנן `!r.deleted`**
//      (סדר מחוק שנספר ניפח את לוח המחוונים ואת התראת ה-20+).

//      את זמן הסדר כ-`refDate`, אחרת החישוב נעשה מול "עכשיו".
//    דוגמה חיה לצבירה נכונה מעל אותם נתונים: `atCheckAlert` (חיסורים/איחורים
//    לחודש עברי) — שווה להתחיל ממנה כשכותבים את הדוח.
//
// מה חסר כדי לכתוב את המסך: אפיון. לא הוגדרו עדיין טווח הדוח (חודש לועזי מול
// חודש עברי — שאר האפליקציה עובדת עברי), אילו עמודות ומדדים מוצגים, האם הוא

// **עד לאפיון — לא לחבר כאן לוגיקת דוח.**
function loadR(){
  var el = document.getElementById('rc');
  if (el) el.innerHTML = '<div class="empty">הדוח בבנייה — טרם אופיין</div>';
}

  try { lsLog('write-fail', String(where) + ' — ' + ((e && e.message) || e), 0); } catch (e2) { }
}

async function hrTouchLastChanged() {
  return await plTouch();
}

// hrCfgSet עם נפילה-חזרה לתור — תחליף שקוף, באותו חוזה
async function hrCfgSet(key, value) {
  // ⛔ לעולם לא להכניס לתור את מפתח החותמת — הוא תמיד נגזר
  if (key === 'last_changed') {
    try { return await _hrCfgSetRaw(key, value); } catch(e) { return {error:{message:e.message}}; }
  }
  try {
    var r = await _hrCfgSetRaw(key, value);
    if (r && r.error) {
      _hrQueueAdd(key, value);
    } else {
      _hrQueueRemove(key);
    }
    hrUpdateQueueBadge();
    return r;
  } catch(e) {
    _hrQueueAdd(key, value);
    hrUpdateQueueBadge();
    return {error: {message: e.message || 'offline'}};
  }
}

function _hrQueueAdd(key, value) {
  try {
    var q = JSON.parse(lsGet(_HR_Q_KEY) || '[]');
    q = q.filter(function(x){return x.key !== key;});
    q.push({key: key, value: value, ts: Date.now()});
    lsSet(_HR_Q_KEY, JSON.stringify(q));
    /*  ⚠️ משפך התור היחיד כאן, ⛔ ולכן זו נקודת הדריכה היחידה של מודול
     *  הניסיון החוזר. ⛔ **ואיתה המתזמן** — ⚠️ הניקוז של התור הזה הוא
     *  מודול הניסיון החוזר, ⭐ אבל הפריט שנכנס אליו הוא כתיבה מקומית
     *  שממתינה לענן: ⛔ משפך שדורך את האחד ולא את השני מייצר שני זמני
     *  תגובה לאותה פעולה. ⚠️ והמתזמן מושהה ומאחד, ⭐ ולכן קריאה נוספת
     *  אינה מחזור סנכרון נוסף. */
    rtyNote();
    schedulePush();
  } catch(e) { console.error('[ys-queue] add error:', e); }
}
function _hrQueueRemove(key) {
  try {
    var q = JSON.parse(lsGet(_HR_Q_KEY) || '[]');
    q = q.filter(function(x){return x.key !== key;});
    lsSet(_HR_Q_KEY, JSON.stringify(q));
  } catch (e) { hrWriteFail('_hrQueueRemove', e); }
}
function _hrQueueGet(key) {
  try {
    var q = JSON.parse(lsGet(_HR_Q_KEY) || '[]');
    var item = q.find(function(x){return x.key === key;});
    return item ? item.value : null;
  } catch(e) { return null; }
}
function hrUpdateQueueBadge() {
  try {
    var badge = document.getElementById('ys-sync-badge');
    if (!badge) return;
    var q = JSON.parse(lsGet(_HR_Q_KEY) || '[]');
    var n = q.length;
    if (n > 0) {
      badge.textContent = '⏳ ' + n + ' רשומות ממתינות לסנכרון';
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  } catch(e) {}
}
// ממזג שני מערכי סדרים לפי מזהה רשומה (פריטים מקומיים בלבד מתווספים בסוף)
/*  ⛔ `keepLocal` נדלק כשהצד המרוחק הוא **חלון** ⛔ ולא הטבלה — ⚠️ רשומה
 *  מקומית שמחוץ לחלון לא נשאלה כלל, ⭐ והיעדרותה אינה עדות: ⛔ בלי הדגל
 *  היא הייתה נופלת כ«שריד בלי חותמת», ⚠️ ומשיכת חודש אחד הייתה גורפת
 *  מהדיסק את כל השאר. */
function _hrSessionsMerge(cloudArr, localArr, logKey, keepLocal) {
  // משודרג: מיזוג ברמת רשומה עם updatedAt + tombstones (היה: הוספה-בלבד לפי id).
  // רשומה מקומית-בלבד ללא updatedAt לא חוזרת (anti-resurrection) — אך מתועדת.
  if (!Array.isArray(cloudArr)) return Array.isArray(localArr) ? localArr : [];
  if (!Array.isArray(localArr)) return cloudArr;
  /*  ⛔ הזוג נגזר מהזרימה ⛔ ואינו מוקלד — ⚠️ מפתח שאין לו שכבת שורות
   *  (הטיפולים) ממוזג ברמת הרשומה, ⭐ כפי שהיה. */
  var pair = HR_MIRROR_STREAMS[logKey] ? hrSessionPairFor(logKey) : null;
  return hrMergeWithDropLog(localArr, cloudArr, function(r){ return r && r.id; }, !!keepLocal, logKey || 'sessions', pair);
}
/* ⛔ שליחת פריט מהתור — ⚠️ שכבת השורות מחזירה `{ok}` והכתיבה להגדרות
   מחזירה `{error}`, ⭐ והתור מכיר חוזה אחד בלבד: ⛔ החזרת `{ok:false}`
   כמות שהיא הייתה נספרת כהצלחה, והפריט היה יורד מהתור בלי שעלה. */
async function _hrQueueSend(key, value) {
  var kind = HR_ROWS_READ_KEYS[key];
  if (!kind) return _hrCfgSetRaw(key, value);

  var r = await pushTable(key, value);
  return (r && r.ok) ? {} : { error: { message: 'rows:' + key } };
}
async function hrFlushQueue() {
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק אחרי כל המתנה — ⚠️ הרישום שאחרי
   *  ה-`await` הוא מה שנזקף לחשבון ההקשר, ⭐ ומשתמש שהתחלף באמצע
   *  היה מקבל לחשבונו את הצלחת הדחיפה של הקודם. */
  var _ep = ctxEpoch();
  var q;
  try { q = JSON.parse(lsGet(_HR_Q_KEY) || '[]'); } catch(e) { return; }
  if (!q.length) return;
  console.log('[ys-queue] flushing', q.length, 'items');
  var failed = [];
  var nOk = 0;
  for (var i = 0; i < q.length; i++) {
    var item = q[i];
    try {
      /* ⛔ היעד נגזר מהמפתח ⛔ ולא מהתור — ⚠️ מפתח שיש לו טבלה חוזר
         **אליה**, ⭐ ומפתח הגדרות ל-`hr_settings`: ⛔ ריקון שכותב הכול
         לאותו מקום היה מחזיר את הרשומות לערך שלם, ⚠️ כלומר למקור אמת שני. */
      var r = await _hrQueueSend(item.key, item.value);
      if (r && r.error) {
        failed.push(item);
      } else {
        nOk++;
        // ה-t0 של פריט בתור הוא **הרגע שבו הוא נכנס אליו** — הערך שנשלח עכשיו
        // הוא הצילום מאותו רגע, ולכן הוא מאשר רק סימונים שקדמו לו.
        if (!ctxStale(_ep)) pendConfirmKv(item.key, item.ts);
        // עֵד הפינוי — אותה עדות בדיוק. הריקון הוא דחיפה שהצליחה.
        if (!ctxStale(_ep)) _hrMarkPushed(item.key);
        /* ⛔ התור נושא מפתחות הגדרות בלבד — ⚠️ הרשומות נכתבות ישירות
           לשכבת השורות, ⛔ ואינן עוברות כאן: ⭐ שכפול של מסלול הכתיבה
           הוא מנוע מיזוג שני, ⛔ והחזרתו לכאן דורסת בערך שנכנס לתור. */
        console.log('[ys-queue] flushed', item.key);
      }
    } catch(e) { failed.push(item); }
  }
  if (nOk > 0) {
    var ts = Date.now();
    // ⛔ כשל חותמת אינו נבלע — `hr_last_changed` הוא האות
    // היחיד שהפולינג במכשירים האחרים משווה מולו, ולכן חותמת
    // שלא נכתבה משמעה שהרשומות עלו ⛔ ואיש לא יידע עליהן. הרשומות
    // עצמן כבר בענן, ולכן זו אזהרה ולא כישלון.
    try { await _hrCfgSetRaw('last_changed', ts); if (!ctxStale(_ep)) _hrLastTs = ts; }
    catch(e){
      console.warn('[sync] חותמת hr_last_changed לא נכתבה:', e && e.message);
      try { hrSyncLog('touch_failed', null, String((e && e.message) || e)); } catch(e2){}
      toast(MSG_UP_SLOW_FANOUT, null, 'bad');
    }
    toast('☁️ ' + nOk + MSG_ROWS_SYNCED, null, 'good');
  }
  lsSet(_HR_Q_KEY, JSON.stringify(failed));
  hrUpdateQueueBadge();
}
// ===== סוף תור האופליין =====

/* ══════════════════════════════════════════════════════════════════════════
   שכבת השורות — טבלאות מובנות, שלב א
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ מפתח `kv` שלם נדרס כולו בכל כתיבה — ⭐ ו-`hr_sessions` הוא המפתח
   הגדול כאן, ⛔ ולכן **סימון נוכחות בודד היה דורס את מלוא הערך**.

   ⛔ הטבלאות הן המאסטר, ⛔ ואין עוד ערך שלם ב-`kv` — ⚠️ השקילות אומתה מול
      המסד לפני המעבר: 345 סדרי נוכחות · 988 סימוני שינה · 71 תלמידים ·
      21 סדרי שינה, ⭐ ובשני הכיוונים.
   ⛔ והכתיבה לשורות **היא** שקובעת הצלחה — ⚠️ עֵד הפינוי (`_hrPushedAt`),
      אישור ה-⏳ ו-`hrTouchLastChanged` נשענים עליה: ⭐ עדות שנשענת על
      כתיבה אחרת מזו שקרתה היא ראיה למשהו שלא נמדד.
   ⛔ וכתיבה שנכשלה חוזרת לתור — ⚠️ `hrRowsUpsert` נכשלת סגור ומדלגת בשקט,
      ⛔ ובלי התור רשומה שנכתבה אופליין לא הייתה מנסה לעלות שוב לעולם.

   ⭐ שתי טבלאות, אב ובן: `hr_sessions` (מטא הסדר) ו-`hr_marks` (שורה
      לסימון). מטא הסדר אינה משוכפלת לכל סימון — `filled_by_name` היה
      חוזר ~48 פעם לכל סדר, וזה ניפוח ישיר של החלון החם המתוכנן.
   ⚠️ `date_iso` משוכפל לתוך `hr_marks` בכוונה — הדוח פר-תלמיד קורא את
      טבלת הבן בלי `join` לאב, ובלי השכפול הוא היה מושך את טבלת האב
      למכשיר רק כדי לדעת מתי היה הסדר.
   ⛔ `deleted` של הסדר יורד לכל שורות הסימון שלו — הדוח פר-תלמיד
      אינו מצטרף לאב, ולכן סימון של סדר מחוק שהיה נשאר `deleted=false`
      היה נקרא כרשומה חיה.
   ══════════════════════════════════════════════════════════════════════════ */
var HR_ROWS = true;

/* ⭐ חותמת ההגדרות נקראת מ-`updated_at` של השורה — ⛔ ולא ממפה בתוך הערך.
  ⛔ העמודה קיימת ב-`hr_settings`, ⚠️ והטריגר בצד השרת דורס כל
   ערך שהגיע מהלקוח: ⭐ שעון מכשיר שנסחף היה קובע מי מנצח.
   ⛔ אין להחזיר את `hr_settings_meta` כמקור חותמת מרוחקת — היא
   הייתה **מנגנון פיצוי** על היעדר העמודה, ונמדד שהיא מתה: הערך בענן הוא
   `{}`, ולכן `rts` היה תמיד 0 ו«האחרון שדוחף מנצח» על שלושת המפתחות.
   ⚠️ המפה **המקומית** נשארת — היא נושאת את `lts`, חותמת הכתיבה של המכשיר
   הזה, שאין לה מקבילה בענן. */

/* ⭐ שלושת מפתחות ההגדרות שההכרעה עליהם היא LWW פר-מפתח.
   ⚠️ הרשימה יושבת כאן ולא בשני אתרי הקריאה, כדי ששני צידי המסלול —
   דחיפה ומשיכה — ⛔ לא ייבדלו בשקט; זה בדיוק ההפרש שנמצא. */
var HR_SETTINGS_LWW_KEYS = ['reasons', 'absence_reasons'];

/* ⭐ שני מסלולי הסדרים — נוכחות ושינה — עוברים באותו קוד.
   ⛔ ואין כאן עותק שני של הדפוס: השינה נוספה כ**תצורה** ולא כהעתקה של
      מסלול הנוכחות — שני עותקים של מסלול הכתיבה הם שתי
      הזדמנויות שאחד מהם ייסחף, בדיוק הלקח של איחוד מנועי המיזוג.
   ⚠️ `note` קיים בשינה בלבד — נמדד: סימון שינה הוא `{s,min,note}` וסימון
      נוכחות `{s,min}`. ⛔ ואין להוסיף `note` גם לנוכחות «לשם אחידות»
       — ל-`hr_marks` אין עמודה כזו, וה-`upsert` היה נדחה כולו. */
var HR_ROWS_KINDS = {
  attend: { parent: 'hr_sessions',       child: 'hr_marks',       pk: PK_AT_SESS, note: false },
  sleep:  { parent: 'hr_sleep_sessions', child: 'hr_sleep_marks', pk: PK_SL_SESS, note: true  }
};

/* מפת חותמות הענן פר-סדר, בזיכרון בלבד, **פר-מסלול**. ⛔ `null` פירושו
   «טרם נמשכה» — ובספק דוחפים: שורה שלא נדחפה חסרה בענן בשקט,
   בעוד שדחיפה מיותרת עולה רק בתעבורה.
   ⛔ ומפה אחת לשני המסלולים הייתה שגויה — מזהי סדר של נוכחות
      ושל שינה חיים במרחבים נפרדים, ומפה משותפת הייתה מדווחת «כבר בענן»
      על סדר שינה שמזההו במקרה זהה לסדר נוכחות. */
var _hrRowsRemote = { attend: null, sleep: null };

/* משיכת מפת החותמות — `client_id` + `updated_at` בלבד.
   ⚠️ זו **אינה** קריאת נתונים: היא לא מזינה שום מסך ולא נכנסת למיזוג, אלא
      רק קובעת מה כבר בענן. מסלול הקריאה נשאר ה-`kv` (ר' כותרת הבלוק). */
async function hrRowsRemoteLoad(kind) {
  kind = kind || 'attend';
  if (!HR_ROWS) return null;
  if (_hrRowsRemote[kind]) return _hrRowsRemote[kind];
  try {
    var res = await withTimeout(SB.from(HR_ROWS_KINDS[kind].parent).select('client_id,updated_at'));
    if (!res || res.error || !Array.isArray(res.data)) return null;
    var map = {};
    res.data.forEach(function (r) { if (r) map[String(r.client_id)] = Number(r.updated_at) || 0; });
    _hrRowsRemote[kind] = map;
    return map;
  } catch (e) { return null; }
}

/* שורת האב. ⚠️ השדות מועתקים אחד לאחד מרשומת ה-`kv`, ו-`date_heb` נשמר
   כמות שהוא — ⛔ אין לגזור אותו מחדש מ-`date_iso`, שחזור תאריך
   עברי הוא שכבת תצוגה בלבד וגזירה כאן הייתה מייצרת מקור אמת שני ללוח. */
function hrSessionRow(rec) {
  if (!rec || rec.id == null) return null;
  return {
    client_id: String(rec.id),
    session: String(rec.session || ''),
    date_iso: String(rec.date_iso || ''),
    date_heb: (rec.date_heb && typeof rec.date_heb === 'object') ? rec.date_heb : null,
    filled_by: (rec.filled_by == null || rec.filled_by === '') ? null : Number(rec.filled_by),
    filled_by_name: rec.filled_by_name == null ? null : String(rec.filled_by_name),
    created_at: rec.created_at == null ? null : String(rec.created_at),
    created_by: rec.createdBy == null ? null : String(rec.createdBy),
    deleted_by: rec.deletedBy == null ? null : String(rec.deletedBy),
    open: (typeof rec.open === 'boolean') ? rec.open : null,
    deleted: !!rec.deleted,
    deleted_at: rec.deleted ? tombAt(_hrRecTs(rec)) : null,
    updated_at: Math.round(Number(_hrRecTs(rec)) || 0)
  };
}

/* שורות הבן. ⚠️ `client_id` נגזר ממפתח הזהות (`<סדר>:<תלמיד>`) ואינו uuid
   חדש — לסימון כבר יש זהות שנוצרה במכשיר, ומזהה שני היה מאפשר לו להתקיים
   פעמיים (הלקח של yoman `002`). ⚠️ לסימון אין חותמת משלו ב-`kv`, ולכן הוא
   יורש את חותמת האב — ⛔ ולא `Date.now()`, שהיה חדש מכל עריכה
   מקומית שטרם עלתה ודורס אותה במיזוג הראשון. */
function hrMarkRows(rec, kind) {
  var out = [];
  if (!rec || rec.id == null) return out;
  var wantNote = !!(HR_ROWS_KINDS[kind || 'attend'] || {}).note;
  var marks = (rec.marks && typeof rec.marks === 'object') ? rec.marks : {};
  var sid = String(rec.id);
  var d = String(rec.date_iso || '');
  var del = !!rec.deleted;
  var ts = Math.round(Number(_hrRecTs(rec)) || 0);
  Object.keys(marks).forEach(function (k) {
    // ⛔ מפתח הסימון עובר כמחרוזת, בלי המרה מספרית —
    //    `hr_marks.student_id` הוא `text`, ומזהה תלמיד
    //    שנוצר במכשיר הוא uuid. `Number(k)` היה מחזיר `NaN` לכל תלמיד
    //    שנוסף ואילך, כלומר סימוניו לא היו מגיעים לשכבת השורות.
    var m = marks[k] || {};
    var row = {
      client_id: sid + ':' + k,
      session_client_id: sid,
      student_id: String(k),
      date_iso: d,
      status: (m.s == null) ? null : String(m.s),
      minutes: Math.round(Number(m.min) || 0),
      deleted: del,
      deleted_at: del ? tombAt(ts) : null,
      updated_at: ts
    };
    // ⛔ `note` נוסף למסלול השינה בלבד — ל-`hr_marks` של הנוכחות
    //    אין עמודה כזו, ושדה עודף ב-`upsert` מפיל את הבקשה **כולה**, לא
    //    רק את השדה. ⚠️ והוא נשלח גם כשהוא ריק — `null` מפורש הוא מה
    //    שמוחק הערה שנמחקה במכשיר, בעוד שהשמטת המפתח הייתה משאירה בענן
    //    את ההערה הישנה.
    if (wantNote) row.note = (m.note == null || m.note === '') ? null : String(m.note);
    out.push(row);
  });
  return out;
}

/* שורת תלמיד. ⚠️ כאן `data` ולא עמודות — רשומת התלמיד היא בעלת צורה
   משתנה (9 שדות אופציונליים נמדדו), ופיצוץ שלה לעמודות היה יוצר מקור
   אמת שני לצורת הרשומה. ⚠️ ואין כאן שיקול משקל: 71 שורות, לא 12,000. */
function hrStudentRow(rec) {
  if (!rec || rec.id == null) return null;
