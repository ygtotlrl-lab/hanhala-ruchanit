  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק אחרי כל המתנה — ⚠️ המחזור פותח כמה
   *  הלוך-ושוב לרשת, ⭐ והמשתמש יכול להתחלף באמצע: ⛔ כל כתיבה שאחריו
   *  כותבת את מה שנמזג עבור הקודם, ⚠️ וכל רישום הצלחה נזקף לחדש. */
  var _ep = ctxEpoch();

  // כל קטגוריה עומדת בפני עצמה. קודם היה try אחד גדול סביב הכול, ולכן ערך
  // localStorage פגום אחד זרק ועצר את הדחיפה לפני שנכתב *שום* מפתח —
  // תלמידים, אישורים והגדרות הפסיקו להסתנכרן בשקט.
  async function step(label, fn) {
    if (ctxStale(_ep)) return;
    try {
      var r = await fn();
      if (ctxStale(_ep)) return;
      if (r && r.error) {
        failed.push(label);
        var m = r.error.message || r.error.code || '';
        if (String(m).indexOf('kv') !== -1) kvMissing = true;
        console.error('[ys-sync] ' + label + ' נכשל:', m);
      } else { pushed++; }
    } catch (e) {
      failed.push(label);
      console.error('[ys-sync] ' + label + ' זרק:', e && e.message);
    }
  }

  // ⛔ אין לתלות את הגיבוי היומי במסלול הדחיפה — ⚠️ תלייה כזו השביתה
  //    אותו ל-25 יום: הוא רץ רק כשמישהו כתב
  //    אחד מארבעת המפתחות. בתקופה שבה הנתונים סטטיים (חופשה) אין דחיפה,
  //    אין גיבוי, ואין שום סימן — בדיוק כשתקלה עוברת בלי שיבחינו בה.
  //    נקודת ההפעלה היא `bkBoot()` ב-`loadDash()`, לצד `lsBoot()`.

  // ---- students: מיזוג ברמת רשומה (id יציב + tombstones) ----
  await step('hr_students_rows', async function() {
    var _t0 = Date.now();   // לפני קריאת המצב המקומי — ראה atSaveData
    var localSt = _hrStudentsRaw();
    if (!localSt.length) localSt = getStudents(); // ריצה ראשונה על ברירות מחדל
    var remoteSt = null; try { remoteSt = await hrCloudGet('hr_students_rows'); } catch(e1) {}
    var mergedSt = hrMergeWithDropLog(localSt, remoteSt, function(r){ return r.id; }, false, 'hr_students_rows',
                                      hrStudentPair);
    if (ctxStale(_ep)) return {};
    _hrStudentsSaveRaw(mergedSt);
    var r = await pushTable('hr_students_rows', mergedSt);
    if (ctxStale(_ep)) return {};
    if (r && r.ok) pendConfirmPush(PK_STUDENT, _t0);
    else if (mergedSt.length) { _hrQueueAdd('hr_students_rows', mergedSt); hrUpdateQueueBadge(); }
    hrSyncLog('push', 'hr_students_rows', hrCount(mergedSt), {local_count: hrCount(localSt), remote_count: hrCount(remoteSt), result_count: hrCount(mergedSt)});
    /* ⛔ `step` מזהה כישלון לפי `error` ⛔ ולא לפי `ok` — ⚠️ החזרת `{ok:false}`
       כמות שהיא הייתה נספרת כהצלחה, ⭐ והמשתמש היה רואה «סונכרן» על דחיפה
       שלא עברה. ⛔ ומערך ריק אינו כישלון — ⚠️ אין מה לדחוף. */
    if (r && r.ok) return {};
    return mergedSt.length ? { error: { message: 'hr_students_rows' } } : {};
  });

  // טבלת kv חסרה — אין טעם להמשיך, בדיוק כמו קודם
  if (kvMissing) { console.log('[ys-sync] kv table missing, skipping push'); return; }

  // ---- approvals: מיזוג אובייקט לפי sid ----
  await step('approvals', async function() {
    var localAp = getApprovals();
    var remoteAp = null; try { remoteAp = await hrCfgGet('approvals'); } catch(e3) {}
    var mergedAp = hrMergeRecords(localAp, remoteAp, null, true);
    if (ctxStale(_ep)) return {};
    hrCfgLocalSet('approvals', mergedAp);
    var r = await hrCfgSet('approvals', mergedAp);
    hrSyncLog('push', 'approvals', hrCount(mergedAp), {local_count: hrCount(localAp), remote_count: hrCount(remoteAp), result_count: hrCount(mergedAp)});
    return r;
  });

  // ---- הגדרות קטנות: LWW ברמת המפתח השלם לפי hr_settings_meta ----
  await step(KV_TABLE, async function() {
    var meta = hrSettingsMeta();
    var settingsKeys = [
      { key: 'reasons',         get: getReasons,                                       set: function(v){ hrCfgLocalSet('reasons', v); } },
      { key: 'absence_reasons', get: function(){ return getAbsenceReasons(); }, set: function(v){ hrCfgLocalSet('absence_reasons', v); } }
    ];
    var lastErr = null;
    for (var i = 0; i < settingsKeys.length; i++) {
      var sk = settingsKeys[i];
      /* ⚠️ הצד המקומי (`lts`) הוא המפה, והמרוחק (`rts`) הוא העמודה — זו
         חותמת הכתיבה של **המכשיר הזה** מול חותמת השורה בענן. */
      var lts = meta[sk.key] || 0;
      var rts = await hrCfgUpdatedAt(sk.key);
      if (rts > lts) {
        // הענן חדש יותר — אמץ מקומית במקום לדרוס
        var rv = null; try { rv = await hrCfgGet(sk.key); } catch(e5) {}
        if (rv != null) { sk.set(rv); meta[sk.key] = rts; }
      } else {
        // מפתח הגדרות אחד שנכשל לא מפיל את השאר
        try { var rr = await hrCfgSet(sk.key, sk.get()); if (rr && rr.error) lastErr = rr.error; }
        catch (e6) { lastErr = {message: e6 && e6.message}; }
      }
    }
    if (ctxStale(_ep)) return {};
    lsSet('hr_settings_meta', JSON.stringify(meta));
    /* ⛔ המפה אינה עולה לענן — מפה שנכתבת לצד `updated_at` היא
       מקור אמת שני.
       ⛔ ומחיקת המפתח מהמסד היא פעולת מנהל ואינה נעשית כאן —
       ⚠️ כיבוי ומחיקה בנפרד, אחרת אין חלון לגלות טעות. */
    return lastErr ? {error: lastErr} : {};
  });

  // חותמת הזמן מתקדמת רק אם משהו באמת עלה — אחרת מכשירים אחרים היו מושכים
  // "שינוי" שלא קיים בענן
  if (pushed > 0 && !ctxStale(_ep)) {
    await hrCfgSet('last_changed', ts);
    if (ctxStale(_ep)) return;
    _hrLastTs = ts;
    console.log('[ys-sync] pushed (merged) ts=' + ts + (failed.length ? ' | נכשלו: ' + failed.join(', ') : ''));
  }

  // אינדיקציה אמיתית למשתמש. hrCfgSet כבר הכניס כל כתיבה שנכשלה לתור הלא-מקוון
  // (ומעדכן את תג התור), ולכן ההודעה מבטיחה שליחה חוזרת — וזה נכון.
  /*  ⛔ תוצאת מחזור הדחיפה נמסרת למודול העידן — ⚠️ המחזור כאן
   *  פר-קטגוריה, ⭐ ו-`failed` הוא מה שלא עלה: ⛔ וקטגוריה אחת שנכשלה
   *  חוסמת את הזריקה כולה. */
  eraNotePush({ ok: !failed.length, still: failed.slice() });
  if (failed.length) {
    if (!_hrPushWarned) {
      _hrPushWarned = true;
      toast(pushed === 0
        ? MSG_CLOUD_SYNC_FAIL
        : MSG_SOME_UNSYNCED_PRE + failed.join(', ') + MSG_SOME_UNSYNCED_POST, null, 'bad');
    }
  } else if (_hrPushWarned) {
    _hrPushWarned = false;
    toast(MSG_SYNC_BACK, null, 'good');
  }
}

/*  ⛔ הציור שאחרי משיכה — ⚠️ רכיבים תלויי-הגדרות שמוצגים כרגע, ⭐ והוא עובר
 *  ב-`pullRender`: ⛔ כמה משתמשים עובדים יחד, ⚠️ ושמירה של אחד מושכת אצל
 *  השני באמצע סימון. */
function hrPullDraw() {
  try {
    if (typeof atFillSessionBtns === 'function' && document.getElementById('at-view-reg')) { atFillSessionBtns(); if (typeof atRenderTodaySessions === 'function') atRenderTodaySessions(); }
    if (typeof hrFillSessionBtns === 'function' && document.getElementById('sl-view-reg')) { hrFillSessionBtns(); if (typeof hrRenderTodaySessions === 'function') hrRenderTodaySessions(); }
  } catch (eRf) { console.error('[pull] רענון בוררי הסדר נכשל', eRf); }
  if (typeof renderStudents === 'function') renderStudents();
  if (typeof refreshDashStats === 'function') refreshDashStats();
}
async function hrPullFromCloud() {
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק לפני כל כתיבה מקומית — ⚠️ המחזור מושך,
   *  ממזג וכותב לדיסק, ⭐ והמשתמש יכול להתחלף בין המשיכה לכתיבה: ⛔ מה
   *  שנמזג עבור הקודם היה יורד לדיסק אחרי שהחדש כבר נכנס. */
  var _ep = ctxEpoch();
  try {
    /* ⭐ מטא הגדרות מהענן — החותמת המרוחקת להכרעת ה-LWW על שלושת מפתחות
       ההגדרות הקטנים, והיא נקראת מ-`updated_at` של השורה.
       ⛔ אין לחזור למפה `hr_settings_meta` — היא `{}` בענן
       כלומר `remoteMeta[k]` היה תמיד 0: התנאי
       `0 >= meta[k]` נכשל לכל מפתח שהמכשיר **ערך אי-פעם**, ⛔ ולכן
       מכשיר שערך הגדרה הפך חירש לצמיתות לשינוי שלה ממכשיר אחר.
       ⚠️ וזה הצד השני של אותו מסלול: צד הדחיפה עבר לעמודה, ומפה מתה
       שנשארת בצד המשיכה היא בדיוק «מקור אמת שני».
       ⛔ נכשל-סגור נשמר — `hrCfgUpdatedAt` מחזירה 0 בכשל, ואפס אינו
       מאמץ ערך מרוחק על מכשיר שערך מקומית. */
    var remoteMeta = {};
    for (var _mi = 0; _mi < HR_SETTINGS_LWW_KEYS.length; _mi++) {
      var _mk = HR_SETTINGS_LWW_KEYS[_mi];
      remoteMeta[_mk] = await hrCfgUpdatedAt(_mk);
    }
    var meta = hrSettingsMeta();

    // students: מיזוג ברמת רשומה במקום דריסה — מכשיר לא מוחק מה שהוא לא מכיר
    var s = await hrCloudGet('hr_students_rows');
    if (ctxStale(_ep)) return;
    if (s !== null && Array.isArray(s)) {
      var mergedS = hrMergeWithDropLog(_hrStudentsRaw(), s, function(r){ return r.id; }, false, 'hr_students_rows');
      _hrStudentsSaveRaw(mergedS);
    }
    // approvals: מיזוג לפי sid עם updatedAt
    var ap = await hrCfgGet('approvals');
    if (ctxStale(_ep)) return;
    if (ap && typeof ap === 'object') {
      hrCfgLocalSet('approvals', hrMergeRecords(getApprovals(), ap, null, true));
    }
    // reasons: LWW ברמת המפתח — אמץ מהענן רק אם אינו ישן מהמקומי
    var rs = await hrCfgGet('reasons');
    if (rs && Array.isArray(rs) && (remoteMeta['reasons'] || 0) >= (meta['reasons'] || 0)) {
      hrCfgLocalSet('reasons', rs);
      if (remoteMeta['reasons']) { meta['reasons'] = remoteMeta['reasons']; lsSet('hr_settings_meta', JSON.stringify(meta)); }
    }
    // טען נתוני סדרים (מודול נוכחות)
    // מיזוג מלא ברמת רשומה: מקומי + pending queue + ענן. tombstones מונעים
    // resurrection; רשומות מקומיות legacy ללא updatedAt לא מוחזרות (anti-resurrection).
    var atSess = await hrCloudGet('hr_sessions');
    if (ctxStale(_ep)) return;
    if (atSess && Array.isArray(atSess)) {
      var _atLocal = hrMirrorRecs('hr_sessions') || [];
      var _atMerge = _hrSessionsMerge(atSess, _atLocal, 'hr_sessions');
      var _atPending = _hrQueueGet('hr_sessions');
      if (_atPending) _atMerge = _hrSessionsMerge(_atMerge, _atPending, 'hr_sessions');
      _hrAtDiskSave(_atMerge);
      window._atData = _atMerge;
      if (_atPending && _atMerge.length > atSess.length) {
        _hrQueueAdd('hr_sessions', _atMerge);
        hrUpdateQueueBadge();
      }
    }
    // טען נתוני שינה
    var hrSess = await hrCloudGet('hr_sleep_sessions');
    if (ctxStale(_ep)) return;
    if (hrSess && Array.isArray(hrSess)) {
      var _hrLocal2 = hrMirrorRecs('hr_sleep_sessions') || [];
      var _hrMerge = _hrSessionsMerge(hrSess, _hrLocal2, 'hr_sleep_sessions');
      var _hrPending = _hrQueueGet('hr_sleep_sessions');
      if (_hrPending) _hrMerge = _hrSessionsMerge(_hrMerge, _hrPending, 'hr_sleep_sessions');
      _hrSlDiskSave(_hrMerge);
      window._hrData = _hrMerge;
      if (_hrPending && _hrMerge.length > hrSess.length) {
        _hrQueueAdd('hr_sleep_sessions', _hrMerge);
        hrUpdateQueueBadge();
      }
    }
    var abR = await hrCfgGet('absence_reasons');
    if (abR && typeof abR === 'object' && !Array.isArray(abR) && (remoteMeta['absence_reasons'] || 0) >= (meta['absence_reasons'] || 0)) {
      hrCfgLocalSet('absence_reasons', abR);
      if (remoteMeta['absence_reasons']) { meta['absence_reasons'] = remoteMeta['absence_reasons']; lsSet('hr_settings_meta', JSON.stringify(meta)); }
    }
    /*  ⛔ `hr_cls_years` אינו נמשך עוד — ⚠️ המחזור נגזר משנת הלימודים,
     *  ואין לו קורא: מפתח שממשיכים למשוך בלי לקרוא הוא נתון שנראה חי.
     *  ⭐ השורה נמחקה מחיקה רכה בענן בהחלטת מנהל, ⛔ ואין להחזיר את
     *  המשיכה: ⚠️ משיכה של שורה מחוקה מחזירה אותה למסך כאילו היא חיה. */
    // רענון הגדרות הסדרים (cfg) — שמות/שעות סדרים שהשתנו ממכשיר אחר
    try {
      var _atCfgV = await hrCfgGet('attend_cfg');
      if (_atCfgV && typeof _atCfgV === 'object') { window._atCfg = _atCfgV; hrCfgLocalSet('attend_cfg', _atCfgV); }
      var _hrCfgV = await hrCfgGet('sleep_cfg');
      if (_hrCfgV && typeof _hrCfgV === 'object') { window._hrCfg = (typeof _hrCleanCfg === 'function') ? _hrCleanCfg(_hrCfgV) : _hrCfgV; hrCfgLocalSet('sleep_cfg', _hrCfgV); }
    } catch (eCfg) { hrWriteFail('hrPullFromCloud', eCfg); }
    // ---- הרשאות: משיכה שוטפת ----
    // עד היום hr_perms נטען **רק** ב-loadPerms בכניסה, ולכן שינוי הרשאות הגיע
    // למשתמש רק אחרי יציאה וכניסה מחדש. עכשיו הוא מגיע תוך שניות (הפולינג של
    // plTick). עטוף בנפרד: כשל כאן לא מפיל את שאר המשיכה, ומטריצה פגומה
    // או ריקה נדחית ב-hrApplyPerms במקום לנעול את המשתמש מחוץ לכל המודולים.
    try {
      var pmV = await hrCfgGet('perms');
      if (ctxStale(_ep)) return;
      if (pmV && typeof pmV === 'object' && !Array.isArray(pmV) && Object.keys(pmV).length) {
        if (hrApplyPerms(pmV)) console.log('[perms] עודכנו מהענן בזמן אמת');
      }
    } catch(ePm) { console.warn('[perms] משיכה נכשלה:', ePm && ePm.message); }
    pullRender(hrPullDraw);
    hrRefreshUsersCache(); // עדכון עותק המשתמשים המקומי בכל משיכה מוצלחת (fire-and-forget)
    hrSyncLog('pull', null, null); // אבחון שלב א: משיכה מוצלחת
  } catch(e) { console.error('[ys-sync] pull error:', e); }
}

// ⛔ אין להחזיר כאן `setInterval` — הפולינג הוא המודול המשותף
//    (`PL_CFG` ו-`plTick`), ונקודת ההפעלה היחידה היא `plBoot()`
//    מ-`loadDash()`: ⚠️ פולינג שרץ לפני הכניסה נגע ברשת בשביל משיכה
//    ש-`hrApplyPerms` ממילא זורקת.

// טעינה ראשונית מהענן בעלייה — עם יצירה אוטומטית של טבלת kv אם חסרה
setTimeout(async function() {
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק אחרי כל המתנה — ⚠️ הרישום שאחרי
   *  ה-`await` הוא מה שנזקף לחשבון ההקשר, ⭐ ומשתמש שהתחלף באמצע
   *  היה מקבל לחשבונו את הצלחת הדחיפה של הקודם. */
  var _ep = ctxEpoch();
  try {
    // מנסה לקרוא — אם הטבלה חסרה, יוצר אותה דרך pg REST
    var r = await withTimeout(SB.from(KV_TABLE).select('value').eq('key', 'last_changed').maybeSingle());
    if (r.error) {
      // ⛔ אין כאן «יצירה אוטומטית» של הטבלה — ⚠️ טבלה חסרה היא תקלת
      // תשתית שמדווחת בקונסול, ⭐ ולא משהו שהלקוח מתקן.
      console.log('[ys-sync] init error:', r.error.message);
      return;
    }
    if (r.data) {
      var remoteTs = parseInt(kvParse('last_changed', r.data.value).value) || 0;
      if (ctxStale(_ep)) return;
      _hrLastTs = remoteTs;
      await hrPullFromCloud();
      await hrFlushQueue(); // שלח פעולות שניצרו אופליין
    }
  } catch(e) { console.log('[ys-sync] init:', e.message||e); }
  hrUpdateQueueBadge(); // הצג תור ממתין מסשלחייה קודמת
}, 1500);

/*  ⛔ מה שנשאר כאן הוא **מה שהפולינג אינו מכסה** — ⚠️ התג ⏳ מצויר מהמאזין
 *  המשותף, ⭐ וריקון התור נדרך מ-`RTY_CFG.flush` באותו אירוע: ⛔ שני אלה
 *  היו כאן מסלול שני לאותה הכרעה.
 *  ⛔ **ואימות הכניסה ושליחת יומן הכניסות אינם באף מסלול אחר** — ⚠️ משתמש
 *  שהושבת בזמן שהמכשיר היה מנותק נשאר מחובר עד הטעינה הבאה, ⭐ ורשומות
 *  היומן שנצברו אופליין נשלחות רק בכניסה מקוונת הבאה. */
window.addEventListener('online', function() {
  console.log('[ys-queue] network online — revalidating session');
  hrRevalidateOfflineLogin();
  hrLoginLogFlush();
});

// ============ סוף סנכרון הענן ============

/* ══════════════════════════════════════════════════════════════════════════
   חיפוש תלמידים — השלמה אוטומטית
   ══════════════════════════════════════════════════════════════════════════ */
function onSearchInput() {
  renderStudents();
  updateSearchDropdown();
}

function updateSearchDropdown() {
  var searchEl = document.getElementById('search-st');
  var dd = document.getElementById('search-dropdown');
  if (!dd || !searchEl) return;
  var q = searchEl.value.trim();
  if (!q) { dd.classList.remove('open'); return; }
  var ql = q.toLowerCase();
  var allStudents = getStudents();
  var matches = allStudents.filter(function(s) {
    return s.name.toLowerCase().indexOf(ql) >= 0;
  }).slice(0, 8);
  if (!matches.length) { dd.classList.remove('open'); return; }
  // בורחים קודם ל-HTML ורק אז בונים את הביטוי הרגולרי, אחרת ההדגשה לא
  // מוצאת שם שעבר בריחה (וגם: שם עם תגית היה נכנס גולמי ל-innerHTML).
  var escaped = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = new RegExp('(' + escaped + ')', 'gi');

    var ox = ord[x && x.cls] != null ? ord[x.cls] : 99;
    var oy = ord[y && y.cls] != null ? ord[y.cls] : 99;
    if (ox !== oy) return ox - oy;

    html+='<span class="cls-badge">'+esc(clsLabel)+'</span>';

    html+='<div class="st-row-tools">';
    html+=presIcon;
    html+=statusBtn;
    html+='</div>';
    html+='</div>';
  });

// -------- מחזור התלמיד --------
// ⛔ המחזור נגזר משנת הלימודים ⛔ ואינו נבחר מרשימת שנים מוקלדת — ⚠️ רשימה
//    מוקלדת נגמרת בשנה האחרונה שמישהו טרח להוסיף, ⭐ ומאותו יום ואילך אין
//    בכלל ערך לבחור; ⛔ והיא גם דורשת שלוש בחירות ידניות בכל ראש שנה, ⚠️
//    ובשנה שבה נשכחו — כל תלמיד שהושבת נרשם על מחזור של השנה שעברה.
// ⚠️ שנת הלימודים מתגלגלת באלול ⛔ ולא בתשרי — הבוגרים עוזבים בסוף אלול,
//    ⭐ והמחזור שנרשם להם הוא זה שנפתח מיד אחריהם.
function hrSchoolYear(now) {
  var h = window.hebDate(now || new Date());
  if (!h.ok) return 0;
  return (h.monthIndex === window.hebMonthNames(h.year).length - 1) ? h.year + 1 : h.year;
}
// ⚠️ המחזור הוא שנת ה**סיום** ולא שנת הכניסה — ⭐ הוא זהה לכל מי שסיים יחד,
//    ולכן ג׳ מקבל את שנת הלימודים עצמה, ב׳ את הבאה אחריה, וא׳ את שלאחריה.
function hrCycleFor(cls, now) {
  var y = hrSchoolYear(now);
  var add = { g: 0, b: 1, a: 2 };
  if (!y || add[cls] == null) return '';
  var hy = y + add[cls];
  // ⚠️ שנה שמאיות עגולה נותנת שתי ספרות אפס ⛔ ואין לה צורה מקוצרת —
  //    התווית המלאה היא מה שנשאר, ⭐ ולא מחרוזת ריקה שנקראת «אין מחזור».
  return window.hebGematria(hy % 100, '״') || window.hebYearLabelFull(hy);
}

  //    מחזור ידנית והוחזר לפעיל וחזר והושבת היה מקבל את המחזור של השנה

function doYearTransition(){
  var students=getStudents();
  var _cycG=hrCycleFor('g');
  var changed=0;
  students.forEach(function(s){
    if(s.active===false) return;
    if(s.cls==='g'){
      s.active=false;
      if(!s.cycle) s.cycle=_cycG;
      s.updatedAt=Date.now(); changed++;
    } else if(s.cls==='b'){
      s.cls='g'; s.updatedAt=Date.now(); changed++;
    } else if(s.cls==='a'){
      s.cls='b'; s.updatedAt=Date.now(); changed++;
    }
  });
  saveStudents(students);
  schedulePush();
  filterClass('all');
  toast(MSG_YEAR_ROLL_DONE+changed+MSG_STUDENTS_UPDATED, null, 'good');
};

/* ══════════════════════════════════════════════════════════════════════════
   היעדרויות ואישורים — חישוב הסטטוס הפעיל של תלמיד
   ══════════════════════════════════════════════════════════════════════════ */
function getActiveAbsences(s, refDate) {
  var now = refDate || new Date();
  if (Array.isArray(s.absences) && s.absences.length > 0) {
    return s.absences.filter(function(a){ return !a.deleted && (!a.from || new Date(a.from) <= now) && (!a.to || new Date(a.to) >= now); });
  }
  if (s.status && ['approved','suspended','left'].indexOf(s.status) !== -1 && (!s.statusFrom || new Date(s.statusFrom) <= now) && (!s.statusTo || new Date(s.statusTo) >= now)) {
    return [{id: 'legacy', type: s.status, reason: s.statusReason, from: s.statusFrom, to: s.statusTo}];
  }
  return [];
}

// מחזירה את כל ההיעדרויות שטרם פגו, כולל עתידיות (לתצוגה בדיאלוג)
function getAllRelevantAbsences(s) {
  var now = new Date();
  if (Array.isArray(s.absences) && s.absences.length > 0) {
    return s.absences.filter(function(a){ return !a.deleted && (!a.to || new Date(a.to) >= now); });
  }
  if (s.status && ['approved','suspended','left'].indexOf(s.status) !== -1 && (!s.statusTo || new Date(s.statusTo) >= now)) {
    return [{id: 'legacy', type: s.status, reason: s.statusReason, from: s.statusFrom, to: s.statusTo}];
  }
  return [];
}

function openCurrentStatusModal() {
  var students = getStudents();

  if (!s) return;
  var TL = {approved:'אישור', suspended:'השעיה', left:'לא שב'};
  var TI = {approved:'✅', suspended:'⚠️', left:'🚪'};
  var _dow = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var fmtDt = function(v){
    if(!v) return '—';
    var d = new Date(v);
    var hd = _hcH(d);
    var hh = d.getHours(), mm = d.getMinutes();
    var timeStr = (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
    return 'יום '+_dow[d.getDay()]+' '+_hcFmt(hd.hy,hd.mi,hd.day)+' '+timeStr;
  };
  var activeAbsences = getAllRelevantAbsences(s);
  var _now = new Date();
  var absencesHtml = activeAbsences.map(function(a) {
    var isFuture = a.from && new Date(a.from) > _now;
    var badgeHtml = isFuture
      ? '<span class="abs-future">⏳ עתידי</span>'
      : '<span class="abs-active">● פעיל</span>';
    var cancelId = a.id === 'legacy' ? '' : String(a.id);
    return '<div class="abs-tone ' + tyCls(a.type) + ' abs-card">' +
      '<div class="abs-card-head">' +
        '<div class="status-head-row">' +
          '<span class="abs-ico">' + (TI[a.type]||'📋') + '</span>' +
          '<span class="abs-type-label">' + esc(TL[a.type]||a.type) + '</span>' +
          badgeHtml +
        '</div>' +
        '<button data-act="status-abs-cancel" data-id="' + esc(cancelId) + '" class="abs-cancel">בטל</button>' +
      '</div>' +
      (a.reason ? '<div class="abs-reason">סיבה: ' + esc(a.reason) + '</div>' : '') +
      '<div class="abs-dates">מ: ' + fmtDt(a.from) + '<br>עד: ' + (a.to ? fmtDt(a.to) : 'ללא תאריך סיום') + '</div>' +
    '</div>';
  }).join('');
  openModal(s.name, absencesHtml +
    '<button data-act="status-picker-open" class="abs-add">➕ הוסף סיבה נוספת</button>', '');
};

function cancelStudentStatus() {
  var sid = window._statusSid;
  var students = getStudents();
  var s = students.find(function(x){return idEq(x.id, sid);});
  if (!s) return;
  s.status = null; s.statusReason = null; s.statusFrom = null; s.statusTo = null;
  // tombstone לכל היעדרות (deleted=true+updatedAt) במקום ריקון פיזי — מונע תחיית-מתים במיזוג
  if (Array.isArray(s.absences)) s.absences.forEach(function(a){ a.deleted = true; a.updatedAt = Date.now(); a.deletedBy = hrWho(); });
  s.present = true;
  s.updatedAt = Date.now();
  saveStudents(students);
  schedulePush();
  hrRefreshApprovalMarks(s.id); // רענון סדרים פתוחים של היום
  renderStudents();
  hrRefreshSupervisionViews(); // רענון מיידי של לשונית ההשגחה הפעילה
  closeModal();
  toast(MSG_STATUS_REVERTED + s.name, null, 'good');
};

function cancelSingleAbsence(absenceId) {
  var sid = window._statusSid;
  var students = getStudents();
  var s = students.find(function(x){return idEq(x.id, sid);});
  if (!s) return;
  if (Array.isArray(s.absences)) {
    // tombstone לפי id — לא הסרה פיזית (מונע חזרת ההיעדרות אחרי מיזוג בין מכשירים)
    s.absences.forEach(function(a){ if (idEq(a.id, absenceId)) { a.deleted = true; a.updatedAt = Date.now(); a.deletedBy = hrWho(); } });
  }
  var stillActive = getActiveAbsences(s);
  if (stillActive.length === 0) s.present = true;
  s.updatedAt = Date.now();
  saveStudents(students);
  schedulePush();
  hrRefreshApprovalMarks(s.id); // רענון סדרים פתוחים של היום
  renderStudents();
  hrRefreshSupervisionViews(); // רענון מיידי של לשונית ההשגחה הפעילה
  if (stillActive.length > 0) {
    openCurrentStatusModal();
  } else {
    closeModal();
    toast(MSG_STATUS_REVERTED + s.name, null, 'good');
  }
};

// -------- היסטוריית הסטטוסים --------
/*  ⛔ ההיסטוריה נקראת מהענן ⛔ ולא מהעותק שבמכשיר — ⚠️ הדיסק מחזיק את מה
 *  ששרד את הפינוי ואת מה שהמכשיר הזה במקרה ראה, ⭐ וסטטוס שנרשם ממכשיר אחר
 *  ולא הגיע לכאן היה נעדר מהרשימה בלי שדבר יסמן שהוא חסר. */
async function openStatusHistory(sid) {
  openModal(MSG_STATUS_HISTORY,
    '<div class="cloud-loading-note">טוען מהענן…</div>', '');
  var rows = null, failed = false;
  try { rows = await hrCloudGet('hr_students_rows'); } catch (e) { failed = true; }
  if (!Array.isArray(rows)) failed = true;
  var box = document.getElementById('modal-body');
  var ttl = document.getElementById('modal-title');
  /*  ⛔ נבדק גם שהכותרת עדיין שלנו ⛔ ולא רק שהמודאל פתוח — ⚠️ מודאל אחר
   *  שנפתח בזמן ההמתנה מקבל את אותו מיכל, ⭐ והתשובה הייתה נשפכת לתוכו. */
  if (!box || !ttl || !modalOpen() || ttl.textContent.indexOf('היסטוריית סטטוסים') === -1) return;
  /*  ⛔ כשל קריאה מוצג כ«אין ראיה» ⛔ ולא כהיסטוריה ריקה — ⚠️ רשימה ריקה
   *  נקראת «מעולם לא היה לו סטטוס», ⭐ והיא בדיוק ההפך ממה שנמדד. */
  if (failed) {
    box.innerHTML = '<div class="hist-err">' +
      '⚠️ לא ניתן לקרוא מהענן כרגע — ⛔ אין ראיה שאין סטטוסים.<br>' +
      '<span class="list-subtitle">נסו שוב כשיש חיבור.</span></div>';
    return;
  }
  var s = rows.find(function (x) { return idEq(x.id, sid); });
  var list = (s && Array.isArray(s.absences)) ? s.absences.slice() : [];
  /*  ⚠️ הכתיב הישן החזיק סטטוס יחיד על הרשומה ⛔ ואינו נשמט מההיסטוריה —
   *  ⭐ תלמיד שלא נגעו בו מאז נראה בלעדיו כמי שמעולם לא היה לו סטטוס. */
  if (s && !list.length && s.status && ['approved', 'suspended', 'left'].indexOf(s.status) !== -1) {
    list.push({ id: 'legacy', type: s.status, reason: s.statusReason || '',
                from: s.statusFrom || '', to: s.statusTo || null });
  }
  var TL = { approved: 'אישור', suspended: 'השעיה', left: 'לא שב' };
  var TI = { approved: '✅', suspended: '⚠️', left: '🚪' };
  var fmt = function (v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return '—';
    var h = window.hebDate(d);
    var hh = d.getHours(), mm = d.getMinutes();
    var t = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    return (h.ok ? (h.dayLabel + ' ' + h.monthName + ' ' + h.yearLabelFull) : '—') + ' · ' + t;
  };
  var ts = function (a) { var d = new Date(a && a.from); return isNaN(d.getTime()) ? 0 : d.getTime(); };
  list.sort(function (a, b) { return ts(b) - ts(a); });
  if (!list.length) {
    box.innerHTML = '<div class="cloud-loading-note">' +
      'לא נרשם אף סטטוס לתלמיד הזה.</div>';
    return;
  }
  box.innerHTML = list.map(function (a) {
    var cancelled = !!a.deleted;
    return '<div class="abs-tone ' + (cancelled ? 'abs-tone-off abs-cancelled' : tyCls(a.type)) +
        ' hist-card">' +
      '<div class="hist-card-head">' +
        '<span class="abs-ico">' + (TI[a.type] || '📋') + '</span>' +
        '<span class="abs-type-label">' +
          esc(TL[a.type] || a.type || '—') + '</span>' +
        (cancelled ? '<span class="hist-cancelled">בוטל</span>' : '') +
      '</div>' +
      (a.reason ? '<div class="abs-reason">סיבה: ' + esc(a.reason) + '</div>' : '') +
      '<div class="abs-dates">' +
        'מ: ' + esc(fmt(a.from)) + '<br>' +
        'עד: ' + (a.to ? esc(fmt(a.to)) : 'ללא תאריך סיום') +
      '</div>' +
      '<div class="hist-meta">' +
        'נרשם ע״י: ' + esc(a.createdBy || '—') +
        (cancelled ? ' · בוטל ע״י: ' + esc(a.deletedBy || '—') : '') +
      '</div>' +
    '</div>';
  }).join('');
};

function saveStudent(){
  var name=(document.getElementById('st-name')||{value:''}).value.trim();
  var cls=(document.getElementById('st-class')||{value:'a'}).value;
  var cycle=(document.getElementById('st-cycle')||{value:''}).value.trim();
  if(!name){toast(H(1504,1488,32,1500,1492,1494,1497,1503,32,1513,1501), null, 'bad');return;}
  var students=getStudents();
  var newId=null;
  if(editingStudentId){
    var idx=students.findIndex(function(s){return idEq(s.id, editingStudentId);});
    if(idx>-1){students[idx].name=name;students[idx].cls=cls;students[idx].cycle=cycle;students[idx].updatedAt=Date.now();}
  } else {
    // ⛔ המזהה הוא uuid ולא `maxId+1` — שני מכשירים שמוסיפים תלמיד
    //    במקביל היו מקצים את אותו מספר לשני אנשים, והמיזוג היה רואה בהם
    //    רשומה אחת. אותו תיקון בדיוק כמו במסלול הייבוא, ובאותו סבב.
    newId = newClientId();
    students.push({id:newId,name:name,cls:cls,cycle:cycle,updatedAt:Date.now(),createdBy:hrWho()});
    students=hrSortStudents(students);
    // אין מיספור-מחדש! id חייב להישאר יציב לצורך מיזוג ברמת רשומה בין מכשירים
  }
  saveStudents(students);
  // ⚠️ התלמיד נשמר במכשיר וסומן ⏳; האישור יגיע מדחיפת `hr_students_rows` הבאה.
  // ⛔ הסימון נגזר מהמזהה עצמו ולא מ-`students[students.length-1]` —
  //    המערך ממוין מיד אחרי ה-push, ולכן האיבר האחרון הוא התלמיד האחרון
  //    **בסדר האלפביתי** ולא זה שנוסף; הסימון נכתב על רשומה אחרת, ושלוש
  //    נקודות הקריאה (`pendTag`, בחירת מה לדחוף, שער הפינוי) לא ראו אותו.
  pendMark(PK_STUDENT + (editingStudentId != null ? editingStudentId : newId));
  return '✅ תלמיד נשמר';
}


// ליבת המחיקה — משותפת למחיקת תלמיד בודד ולמחיקה ההמונית, כדי שלא יהיו שתי
// מימושים שנפרדים אחד מהשני. מחיקה = tombstone (deleted=true + updatedAt),
// לא הסרה פיזית: רשומה שנעלמת מהמערך בלי סימון חוזרת מהענן במיזוג הבא —
// hrMergeRecords מחזיר כל רשומה מרוחקת שאין לה מקבילה מקומית.
// מחזיר את מספר הרשומות שסומנו בפועל.
function hrTombstoneStudents(ids){
  var all=_hrStudentsRaw();
  if(!all.length) all=getStudents(); // ריצה על ברירות מחדל שטרם נשמרו
  var want={};
  (ids||[]).forEach(function(id){ if(id!=null) want[String(id)]=1; });
  var ts=Date.now(), by=hrWho(), n=0;
  all.forEach(function(rec){
    if(!rec||rec.id==null||!want[String(rec.id)]||rec.deleted) return;
    rec.deleted=true; rec.updatedAt=ts; rec.deletedBy=by; n++;
  });
  _hrStudentsSaveRaw(all);
  // מחיקה היא כתיבה לכל דבר — גם היא ממתינה לאישור מהענן.
  (ids||[]).forEach(function(id){ if(id!=null) pendMark(PK_STUDENT+id); });
  return n;
}

/* ══════════════════════════════════════════════════════════════════════════
   ייבוא, מחיקה המונית והדפסת מצבת התלמידים
   ══════════════════════════════════════════════════════════════════════════ */
function importStudentsFromFile(input) {
  if (!input.files || !input.files[0]) return;
  if (typeof XLSX === 'undefined') { toast(MSG_LIB_LOADING, null, 'bad'); return; }
  var file = input.files[0];
  input.value = ''; // אפשר לייבא את אותו קובץ שוב
  var isCsv = file.name.toLowerCase().endsWith('.csv');
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var rows;
      if (isCsv) {
        // CSV: קריאה ישירה כטקסט, פיצול לשורות ועמודות
        var text = e.target.result.replace(/^\uFEFF/,''); // הסרת BOM אם קיים
        rows = text.split(/\r?\n/).map(function(line){ return line.split(','); });
      } else {
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      }
      var existing = getStudents();
      var added = 0, failed = [], skipped = 0, addedIds = [];
      var clsMap = {
        'א':'a',"א'":'a','a':'a','שיעור א':'a',"שיעור א'":'a',
        'ב':'b',"ב'":'b','b':'b','שיעור ב':'b',"שיעור ב'":'b',
        'ג':'g',"ג'":'g','g':'g','שיעור ג':'g',"שיעור ג'":'g'
      };
      // השורה הראשונה היא הכותרת, ולכן מתחילים מזו שאחריה
      for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        // סדר עמודות בתבנית: שיעור(0) | שם פרטי(1) | שם משפחה(2)
        var clsRaw = String(row[0]||'').trim();
        var first  = String(row[1]||'').trim();
        var family = String(row[2]||'').trim();
        var name = (family && first) ? family+' '+first : (family||first);
        if (!name) { skipped++; continue; }
        // מיפוי שיעור — מנסים גולמי, ללא גרש, ותו אחרון
        var clsStripped = clsRaw.replace(/['']/g,'');
        var cls = clsMap[clsRaw] || clsMap[clsStripped] || clsMap[clsStripped.slice(-1)] || null;
        if (!cls) { failed.push(name + ' (' + (clsRaw||'—') + ')'); continue; }
        // ⛔ uuid ולא `maxId++` — שני מכשירים שמייבאים במקביל היו
        //    מקצים את אותם מזהים לתלמידים שונים, והמיזוג היה רואה בהם רשומה
        //    אחת: תלמיד נעלם בשקט, ואין מזה חזרה. ר' `newClientId()`.
        var nid = newClientId();
        existing.push({id:nid, name:name, cls:cls, updatedAt:Date.now(), createdBy:hrWho()});
        addedIds.push(nid);
        added++;
      }
      var wrote = true;
      if (added > 0) {
        existing=hrSortStudents(existing);
        // אין מיספור-מחדש — id חייב להישאר יציב למיזוג בין מכשירים
        // ⛔ תוצאת הכתיבה המקומית נבדקת לפני כל דיווח הצלחה —
        //    באחסון מלא `saveStudents` מחזירה `false`, ⚠️ וסיכום «N תלמידים
        //    נוספו בהצלחה» בכל מקרה הוא כישלון שקט.
        wrote = (saveStudents(existing) !== false);
        if (wrote) {
          // ⛔ סימון ⏳ לכל שורה מיובאת — בלעדיו הייבוא אינו נספר
          //    במונה, אינו נחשב «לדחיפה», ושער הפינוי רשאי לפנות תלמיד
          //    שטרם עלה לענן. כל שאר מסלולי כתיבת התלמידים כבר מסמנים.
          addedIds.forEach(function(id){ pendMark(PK_STUDENT + id); });
          schedulePush();
          renderStudents();
        }
      }
      // הצגת סיכום
      var icon = (!wrote) ? '❌' : (failed.length===0 ? '✅' : '⚠️');
      var title = wrote ? (added + ' תלמידים נוספו בהצלחה')
                        : 'הייבוא נכשל — אין מקום באחסון המכשיר';
      var bodyHtml = '';
      if (!wrote) {
        bodyHtml += '<div class="import-err"><strong>' + added + ' תלמידים לא נשמרו.</strong> ' +
                'הכתיבה המקומית נכשלה, ולכן שום דבר לא נוסף. פנה מקום ונסה שוב.</div>';
      }
      if (wrote && skipped > 0) bodyHtml += '<div>' + skipped + ' שורות ריקות דולגו</div>';
      if (wrote && failed.length > 0) {
        bodyHtml += '<div class="import-fail"><strong>' + failed.length + ' שורות נכשלו</strong> (שיעור לא מוכר):</div>';
        bodyHtml += '<div class="import-fail-list">'+esc(failed.slice(0,10).join(', '))+(failed.length>10?'...':'')+'</div>';
      }
      // ⚠️ הסיכום הוא הדיווח היחיד למשתמש כאן, ולכן הוא נבנה מהאמת ולא
      //    מהכוונה: כשל כתיבה מקומית משנה את האייקון, את הכותרת ואת הגוף.
      openModal(icon + ' ' + title,
        '<div class="import-done">' +
        (bodyHtml || '<div>הכל תקין!</div>') + '</div>',
        '<button class="modal-ok btn" data-act="modal-close">סגור</button>');
    } catch(err) {
      toast(MSG_FILE_READ_FAIL + (err.message||err), null, 'bad');
    }
  };
  if (isCsv) { reader.readAsText(file, 'UTF-8'); } else { reader.readAsArrayBuffer(file); }
};

function hrCachedArr(memKey, lsKey) {

/*  ⛔ קריאת הדיסק היא נקודה אחת — ⚠️ שני קוראים היו נבדלים ברגע שאחד
 *  מהם ילמד לזהות פורמט חדש, ⭐ והשני היה מחזיר null על נתון קיים. */
function _hrDiskArr(lsKey) {
  /*  ⛔ מפתח שיש לו מראה נקרא **ממנה** — ⚠️ `MIRROR` הוא העותק שעל הדיסק,
   *  ⭐ וקריאה ישירה מהמפתח השטוח הייתה מקור אמת שני. */
  if (HR_MIRROR_STREAMS[lsKey]) return hrMirrorRecs(lsKey);
  if (Object.prototype.hasOwnProperty.call(MIRROR, lsKey)) return MIRROR[lsKey];
  try {
    var lc = lsGet(lsKey);
    if (lc) { var p = JSON.parse(lc); if (Array.isArray(p)) return p; }
  } catch (e) {}
  return null;
}
/*  ⛔ כשל רענון מסומן גלוי ⛔ ולא בשקט — ⚠️ מסך שמציג נתון ישן בלי לומר
 *  זאת הוא הכשל השקט עצמו: ⭐ מי שמחליט על סמך המסך חייב לדעת מה גילו
 *  של מה שהוא רואה. ⛔ ונקודת הסימון אחת לשני המודולים — ⚠️ שני מימושים
 *  כמעט-זהים הם בדיוק מה שנסחף. */
function _hrPullStaleMark(el, bad) {
  if (!el) return;
  el.textContent = bad ? '⚠️ הרענון מהענן נכשל — המוצג הוא העותק שבמכשיר' : '';

 *  אי אפשר להסיק ממנה שהרענון עבד: ⛔ וכשל שקט על מסך השגחה הוא החלטה
 *  שמתקבלת על נתון ישן בלי לדעת. */
/*  ⛔ המשיכה נשמרת לדיסק — ⚠️ עד כאן היא ישבה בזיכרון בלבד, ⛔ ולכן בכל
 *  פתיחה של האפליקציה המטמון היה ריק והמסך חזר לחיווי הטעינה. ⛔ והשמירה
 *  **ממזגת ואינה דורסת** — ⚠️ רשומה שנרשמה אופליין וטרם עלתה אינה בענן,
 *  ⭐ ודריסה הייתה מוחקת אותה מהדיסק. */
/*  ⛔ הקורא מוסר את החלון שהוא מציג — ⚠️ ובלעדיו נמשכת הטבלה כולה:
 *  ⭐ מסלול שאין לו חלון מוצהר מוסר `null` במפורש ⛔ ולא משמיט ארגומנט,
 *  ⚠️ שהשמטה נקראת «לא נשאלתי» ⛔ והצהרה נקראת «נמדד ואין». */
async function _atPullSessions(win) {
  var v = null; try { v = await hrCloudGet('hr_sessions', win); } catch (e) {}
  if (!Array.isArray(v)) return false;
  var loc = _hrDiskArr('hr_sessions');
  var out = loc ? _hrSessionsMerge(v, loc, 'hr_sessions', !!win) : v;
  window._atData = out; _hrAtDiskSave(out);
  return true;
}

async function _atPullTreats() {

  if (!r || !r.ok) return false;

   *  היה מוחק טיפולים שנרשמו אופליין וטרם עלו. */
  if (Array.isArray(r.value)) { window._atTreats = r.value; lsSetArray('hr_attend_treats', r.value, _hrRecTs); }
  else if (!Array.isArray(window._atTreats)) window._atTreats = hrCachedArr('_atTreats', 'hr_attend_treats') || [];
  return true;
}

async function atSaveData(data) {
  /*  ⛔ ההקשר נלכד בכניסה ⛔ ונבדק אחרי כל המתנה — ⚠️ הרישום שאחרי
   *  ה-`await` הוא מה שנזקף לחשבון ההקשר, ⭐ ומשתמש שהתחלף באמצע
   *  היה מקבל לחשבונו את הצלחת הדחיפה של הקודם. */
  var _ep = ctxEpoch();
  // t0 נלקח **לפני** קריאת המצב המקומי. רשומה שתסומן אחרי הרגע הזה אינה
  // בתוך הצילום שנדחף, ואישור שלה היה מוריד סימון מרשומה שלא עלתה.
  var _t0=Date.now();
  window._atData=data;
  _hrAtDiskSave(data);
  try {
    // מיזוג עם הענן לפני כתיבה — לא דורסים רשומות של מכשיר אחר
    var _atLocalN=hrCount(data);
    var _atRemote=null; try { _atRemote=await hrCloudGet('hr_sessions'); } catch(eR){}
    if (Array.isArray(_atRemote)) {
      data=_hrSessionsMerge(_atRemote, data, 'hr_sessions');
      window._atData=data;
      _hrAtDiskSave(data);
    }
    /* ⛔ שכבת השורות היא הכתיבה ⛔ ולא עותק שני שלה — ⚠️ עד כאן ה-`kv`
       היה המאסטר והטבלאות בצל: ⭐ מרגע שהשקילות נמדדה, ⛔ כתיבה שנייה
       לערך שלם היא מקור אמת שני, ⚠️ ומיזוג בין השניים הוא הכרעה בלי
       מפתח. ⛔ ומערך ריק אינו כישלון — ⚠️ הוא «אין מה לדחוף». */
    var _rAt=await pushTable('hr_sessions',data);
    /* ⛔ כתיבה שנכשלה חוזרת לתור ⛔ ואינה נשכחת — ⚠️ בלי זה רשומה שנכתבה
       אופליין הייתה יושבת על הדיסק עד העריכה הבאה, ⭐ ואם לא הייתה כזו —
       לנצח: ⛔ הדחיפה היחידה שהייתה מנסה שוב היא זו שהמשתמש יזם. */
    if(!(_rAt&&_rAt.ok)&&hrCount(data)) { _hrQueueAdd('hr_sessions',data); hrUpdateQueueBadge(); }
    // ⚠️ רק כתיבה שהצליחה היא ראיה — ⭐ ואותה עדות בדיוק מזינה את הסימון ⏳
    //    ואת עֵד הפינוי; ר' `_hrPushedAt`.
    if(_rAt&&_rAt.ok&&!ctxStale(_ep)) pendConfirmPush(PK_AT_SESS,_t0);
    hrSyncLog('push','hr_sessions',hrCount(data),{local_count:_atLocalN,remote_count:hrCount(_atRemote),result_count:hrCount(data)});
    // עדכן timestamp — מכשירים אחרים יגלו את השינוי בפולינג הבא
    await hrTouchLastChanged();
  } catch (e) { hrWriteFail('atSaveData', e); }
}
async function atLoadTreats() {
  // ⛔ התוצאה נשמרת בזיכרון — ⚠️ הציור הראשון של מסך ההשגחה קורא
  //    ממנה בלי להמתין, ⛔ ובלעדיה הוא ממתין לרשת לפני שהוא מצייר משהו.
  try { var v=await hrCfgGet('attend_treats'); if(Array.isArray(v)){window._atTreats=v;return v;} } catch(e){}

}

   *  ה-`await` הוא מה שנזקף לחשבון ההקשר, ⭐ ומשתמש שהתחלף באמצע
   *  היה מקבל לחשבונו את הצלחת הדחיפה של הקודם. */
  var _ep = ctxEpoch();

  lsSetArray('hr_attend_treats', data, _hrRecTs);

    // מדריכים שרשמו טיפול במקביל מחקו זה את זה. אותה סמנטיקה כמו הסדרים.
    var _tRemote=null; try { _tRemote=await hrCfgGet('attend_treats'); } catch(eR){}

  } catch (e) { hrWriteFail('atSaveTreats', e); }
  window._atTreats=data;
  return data;

/*  ⛔ הציור הסינכרוני של לשונית הרישום — ⚠️ הוא נקרא פעמיים: מהמטמון
 *  לפני הרשת, ושוב אחרי הרענון; ⛔ ואין בו `await`. */
/* ══════════════════════════════════════════════════════════════════════════

// טעינה ראשית של המודול
async function loadAttend() {
  var el = document.getElementById('at-pullStale');
  window._atMarks={};
  window._atCurrentSessionId=null;
  window._atPendingRec=null;
  /*  ⛔ מציג מיד ⛔ ומרענן ברקע — ⚠️ עד כאן שתי המשיכות ישבו **לפני**
   *  הציור הראשון, ⭐ ולכן חיווי הטעינה של המודול נשאר על המסך כל זמן
   *  הרשת: ⛔ ובתוכו הלשוניות כבר לחיצות, והלשונית שנפתחה ציירה חיווי
   *  שני משלה — ⚠️ שני ספינרים על מסך אחד. ⭐ הציור הראשון סינכרוני,
   *  ⛔ ולכן החיווי היחיד הוא זה של הלשונית עצמה. */
  _hrPullStaleMark(el, false);
  /*  ⛔ העותק נקרא ⛔ ואינו נכתב כברירת מחדל — ⚠️ `_atCfg=atDefaultCfg()`
   *  היה מסמן «נטען», ⭐ והמשיכה שאחריו לא הייתה מחליפה ערך שכבר «יש». */
  atCachedCfg();
  hrCachedArr('_atData','hr_sessions');
  _atPaintReg();
  atShowTab(window._atView||'reg');

  /*  ⛔ שתי המשיכות במקביל ⛔ ולא בזו אחר זו — ⚠️ אין ביניהן תלות,
   *  ⭐ וההמתנה היא של האיטית מבין השתיים ⛔ ולא של סכומן. */
  var _okAt=await Promise.all([_atPullCfg(), _atPullSessions(hrDayWin())]);
  _atPaintReg();
  atShowTab(window._atView||'reg');
  _hrPullStaleMark(el, !(_okAt[0]&&_okAt[1]));

  var _todayIsoR=dayToday();
  var _openRec=(window._atData||[]).find(function(r){return r&&!r.deleted&&r.open&&r.date_iso===_todayIsoR;});
  // סשן פתוח של היום? הצע להמשיך אותו במקום להתחיל חדש
  try {
    /*  ⚠️ ההצעה אינה דורסת מודאל פתוח — ⛔ מיכל אחד, ⭐ ומי שכבר עומד
     *  בדיאלוג אחר לא ימצא אותו מוחלף מתחת לידיו. */
    if(_openRec && !modalOpen()) {
      openModal(MSG_SESSION_OPEN_TODAY,
        '<p class="md-note-center">'+esc(_openRec.session)+' נפתח היום ולא נסגר.<br>להמשיך את הרישום?</p>',
        '<button data-act="modal-close" class="md-btn-ghost">אחר כך</button>'+
        '<button data-act="at-resume-go" data-id="'+esc(_openRec.id)+'" class="md-btn-primary">▶ המשך</button>');
    }
  } catch(eRes){}
  atCheckAlert();
};

// מיון סדרים לפי שעת התחלה
function atSortedSessions(cfg) {
  if(!cfg) cfg=window._atCfg||atDefaultCfg();
  return (cfg.sessions||[]).slice().sort(function(a,b){
    return HE.compare(a.startTime||'', b.startTime||'');

function atFillSessionBtns() {
  var el=document.getElementById('at-sess-btns');

  var cfg=window._atCfg||atDefaultCfg();

  atSortedSessions(cfg).forEach(function(s){
    var btn=document.createElement('button');
    btn.textContent=s.name;
    btn.className='sess-pick-btn';
    btn.dataset.act='at-open-session';btn.dataset.busy=MSG_BUSY_CHECK;btn.dataset.sid=s.id;btn.dataset.sname=s.name;
    el.appendChild(btn);

  ['reg','arc','sup'].forEach(function(t){

// -------- רישום --------
// קביעת מצב אוטומטי לפי סטאטוס התלמיד
// sessDateIso אופציונלי — אם חסר, אישורים תמיד פעילים
function atAutoMark(student, sessDateIso, sessStartTime) {
  // בנה תאריך עזר מזמן הסדר (אם סופק) כדי לבדוק סטטוסים נכון ברישום רטרואקטיבי
  var sessRef = null;
  if (sessDateIso) {
    sessRef = new Date(sessDateIso + 'T' + (sessStartTime || '12:00') + ':00');
  }
  var aa=getActiveAbsences(student, sessRef);
  if(!aa||!aa.length) return null;
  for(var i=0;i<aa.length;i++){
    var t=aa[i].type;
    if(t==='suspended'||t==='left') return 'ak';
    if(t==='approved'){
      if(!sessDateIso) return 'ap'; // ללא תאריך — סמן תמיד
      var fromDate=aa[i].from?(aa[i].from.split('T')[0]):'';
      var toDate=aa[i].to?(aa[i].to.split('T')[0]):'';
      if(fromDate&&sessDateIso<fromDate) continue; // הסדר לפני תחילת האישור — דלג
      if(toDate&&sessDateIso>toDate) continue;     // הסדר אחרי סיום האישור — דלג
      // בדיקת שעה ביום הגבול — למנוע סימון סדרים לפני/אחרי שעת האישור
      if(sessStartTime){
        if(fromDate&&sessDateIso===fromDate){
          var fromTime=aa[i].from&&aa[i].from.indexOf('T')>=0?aa[i].from.split('T')[1].substr(0,5):'00:00';
          if(sessStartTime<fromTime) continue; // הסדר לפני שעת תחילת האישור — דלג
        }
        if(toDate&&sessDateIso===toDate){
          var toTime=aa[i].to&&aa[i].to.indexOf('T')>=0?aa[i].to.split('T')[1].substr(0,5):'23:59';
          if(sessStartTime>toTime) continue;   // הסדר אחרי שעת סיום האישור — דלג
        }
      }
      return 'ap';
    }
  }
  return null;
}

// צבעי כפתורים פעילים — ז׳ סטאטוסים

// הצגת סדרים שנרשמו היום
// רענון סימוני אישור בסדרים פתוחים של היום — נקרא אחרי הוספה/עריכה/מחיקה של
// אישור/היעדרות לתלמיד. מעדכן רק סימון ריק או 'ap' (לעולם לא דורס סימון ידני).
async function hrRefreshApprovalMarks(sid) {
  try {
    var student = getStudents().find(function(x){ return idEq(x.id, sid); });
    if (!student) return;
    var sidKey = String(sid);
    var todayIso = dayToday();

    function refreshSet(lsKey, cfgSessions, dateIso, curId, marksBuf, renderFn, saveFn, withNote) {
      var data = null;
      try { data = JSON.parse(lsGet(lsKey) || 'null'); } catch(e0) {}
      if (!Array.isArray(data)) return;
      var changed = false;
      data.forEach(function(rec){
        if (!rec || rec.deleted || !rec.open || rec.date_iso !== dateIso) return;
        var cur = (rec.marks && rec.marks[sidKey]) ? (rec.marks[sidKey].s || '') : '';
        if (cur !== '' && cur !== 'ap') return; // לא דורסים סימון ידני (נוכח/מאחר וכו')
        var sessTime = '';
        for (var i = 0; i < cfgSessions.length; i++) { if (cfgSessions[i].name === rec.session) { sessTime = cfgSessions[i].startTime || ''; break; } }
        var am = atAutoMark(student, rec.date_iso, sessTime);
        var next = (am === 'ap') ? 'ap' : '';
        if (next === cur) return;
        if (!rec.marks) rec.marks = {};
        rec.marks[sidKey] = withNote ? { s: next, min: 0, note: '' } : { s: next, min: 0 };
        rec.updatedAt = Date.now();
        changed = true;
        // אם הסדר הזה פתוח כרגע על המסך במכשיר הזה — עדכן גם את ה-buffer והתצוגה
        if (curId === rec.id && marksBuf) {
          if (next) marksBuf[sidKey] = withNote ? { s: next, min: 0, note: '' } : { s: next, min: 0 };
          else delete marksBuf[sidKey];
          if (typeof renderFn === 'function') { try { renderFn(); } catch(eR) {} }
        }
      });
      if (changed) {
        lsSet(lsKey, JSON.stringify(data));
        try { saveFn(data); } catch (eS) { hrWriteFail('refreshSet', eS); }
      }
    }

    var atCfg = (window._atCfg && Array.isArray(window._atCfg.sessions)) ? window._atCfg.sessions : [];
    refreshSet('hr_sessions', atCfg, todayIso, window._atCurrentSessionId, window._atMarks, atRenderStudents, function(d){ window._atData = d; atSaveData(d); }, false);

    var hrCfg = (window._hrCfg && Array.isArray(window._hrCfg.sessions)) ? window._hrCfg.sessions : [];
    var hrIso = (typeof hrGetLogicalDate === 'function') ? hrGetLogicalDate() : todayIso;
    refreshSet('hr_sleep_sessions', hrCfg, hrIso, window._hrCurrentSessionId, window._hrMarks, hrRenderStudents, function(d){ window._hrData = d; hrSaveData(d); }, true);
  } catch(e) { console.warn('[approval-refresh]', e); }
}

/*  ⛔ הרשומה נקראת מהמטמון ⛔ ואין המתנה לרשת — ⚠️ הכפתור שנלחץ צויר
 *  מאותו עותק בדיוק, ⭐ ולכן הרשומה נמצאת בו בוודאות: ⛔ `await` כאן היה

async function atEditSession(recId) {
  var data=hrCachedArr('_atData','hr_sessions')||[];
  var rec=data.find(function(r){return idEq(r.id,recId);});
  if(!rec) return;

  window._atMarks={};window._atPending={};window._atCleared={};
  Object.entries(hrMarks(rec)).forEach(function(e){
    var sid=e[0],m=e[1];
    if(m.s){window._atMarks[sid]={s:m.s,min:m.min||0};window._atCleared[sid]=true;}
  });
  // רענון אישורים לתלמידים ללא סימון — לפי השעה הנוכחית (אישור שהוזן אחרי פתיחת הסדר)
  try {
    var _nowT=new Date();
    var _hhmm=('0'+_nowT.getHours()).slice(-2)+':'+('0'+_nowT.getMinutes()).slice(-2);
    // עדיפות ל-startTime של הסדר מההגדרות (עקבי עם hrRefreshApprovalMarks); שעה נוכחית רק כנפילה-חזרה
    var _cfgS=(window._atCfg&&Array.isArray(window._atCfg.sessions))?window._atCfg.sessions:[];
    for(var _ci=0;_ci<_cfgS.length;_ci++){ if(_cfgS[_ci].name===rec.session&&_cfgS[_ci].startTime){_hhmm=_cfgS[_ci].startTime;break;} }
    var _apChanged=false;
    getStudents().forEach(function(st){
      if(st.active===false) return;
      var k=String(st.id);
      if(window._atMarks[k]&&window._atMarks[k].s) return; // יש סימון — לא נוגעים
      var am=atAutoMark(st, rec.date_iso, _hhmm);
      if(am){
        window._atMarks[k]={s:am,min:0};
        window._atCleared[k]=true;
        if(!rec.marks) rec.marks={};
        rec.marks[k]={s:am,min:0};
        _apChanged=true;
      }
    });
    if(_apChanged){
      rec.updatedAt=Date.now();
      _hrAtDiskSave(data);
      window._atData=data;
      atSaveData(data); // דחיפה ממוזגת לענן (fire-and-forget)
    }
  } catch(eAp){ console.warn('[approval-refresh:edit]', eAp); }
  // מלא תאריך
  var dw=document.getElementById('at-date-wrap');

  window._atPendingRec=null;
  window._atCurrentSessionId=recId;
  var hdr=document.getElementById('at-reg-header');
  if(hdr) hdr.innerHTML=
    '<span class="rec-title">'+esc(rec.session)+'</span>'+
    '<span class="rec-date">'+_hcFmt(rec.date_heb.hy,rec.date_heb.mi,rec.date_heb.day)+'</span>';
  document.getElementById('at-reg-picker').classList.add('hidden');
  document.getElementById('at-reg-list').classList.remove('hidden');
  atRenderStudents();
};

/* ══════════════════════════════════════════════════════════════════════════
   מניעת כפילות סדרים — ההגנה בנקודת היצירה
   ══════════════════════════════════════════════════════════════════════════
   נמדד מול הנתונים החיים: חמישה מקרים של שני סדרים לאותו שם-סדר ואותו
   `date_iso`, ובארבעה מהם **שתי הרשומות חיות**. המנהל אישר שזו תקלה ולא
   שימוש מכוון — אין מצב שאותו סדר מתקיים פעמיים ביום.

   ⚠️ דיאלוג הכפילות ב-`atOpenSession` אינו מספיק לבדו — ⛔ הכפילויות
      נוצרו על אפו, ולכן שני החורים שמתחתיו סגורים אף הם:
      א. הבדיקה רצה מול `window._atData` **כפי שהוא בזיכרון**, ו-`atLoadData`
         מחזירה את העותק הטעון בלי לגעת ברשת. מכשיר שטען את היום לפני
         שמכשיר אחר פתח את הסדר פשוט לא ראה אותו.
      ב. הרשומה נכנסת למערך רק בסימון הראשון (`atMarkDirty` — מניעת רישומי
         רפאים), ובין הפתיחה לסימון הפולינג יכול להביא סדר מתחרה. שם
         ה-`push` יצר את הרשומה השנייה בלי שאיש בדק שוב.

   ⛔ כלל אחד לשני המקומות — `atFindLiveSession` היא ההגדרה
      היחידה של «כפילות»; שני מימושים היו נסחפים זה מזה, וזה בדיוק הלקח
      של «בונה אחד לשני מסלולי יצירה».
   ⛔ ואין כאן אינדקס ייחודי על `(session, date_iso)` — הוא היה
      נכשל על ארבעת הזוגות הקיימים, ומפתח הזהות נשאר `id`. המניעה היא
      בקוד; מיזוג הזוגות הקיימים הוא פעולת מנהל נפרדת.
   ⚠️ המודול הזה משרת גם את הנוכחות וגם את השינה — אותו מבנה רשומה בדיוק,
      ואותו חור. הגנה שיושבת רק באחד מהם מגינה רק עליו.
   ══════════════════════════════════════════════════════════════════════════ */
function atFindLiveSession(data, sessName, dateIso, exceptId) {
  if (!Array.isArray(data)) return null;
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    if (!r || r.deleted) continue;
    if (r.session !== sessName || r.date_iso !== dateIso) continue;
    if (exceptId != null && idEq(r.id, exceptId)) continue;
    return r;
  }
  return null;
}

/* משיכת מצב הענן לפני בדיקת הכפילות. ⚠️ נכשלת רכה בכוונה: אין
   רשת ⇒ הבדיקה רצה מול העותק המקומי, בדיוק כפי שרצה עד היום. המסלול
   האופליין ממשיך לעבוד, והבדיקה רק מדויקת יותר כשיש רשת.
   ⛔ המיזוג הוא `_hrSessionsMerge` ולא דריסה — דריסה בענן הייתה
   מוחקת סדר מקומי שטרם עלה, בדיוק לפני שהמשתמש ממשיך לסמן בו. */

/* אימוץ סדר קיים במקום יצירת שני. ⚠️ הסימונים הקיימים נטענים תחילה, וכל
   סימון שהמשתמש כבר סימן גובר עליהם — ⛔ ולא אימוץ בלי טעינה:
   `atSaveLocalNow` בונה את `marks` מחדש מ-`_atMarks` לכל התלמידים
   הפעילים, ולכן אימוץ «יבש» היה מוחק את מה שהמכשיר האחר כבר סימן. */
function atAdoptSession(rec) {
  var ex = hrMarks(rec);
  Object.keys(ex).forEach(function (k) {
    var cur = window._atMarks[k];
    if (!cur || !cur.s) window._atMarks[k] = { s: (ex[k] && ex[k].s) || '', min: (ex[k] && ex[k].min) || 0 };
  });
  window._atCurrentSessionId = rec.id;
}

    if (!cur || !cur.s) window._hrMarks[k] = { s: (ex[k] && ex[k].s) || '', min: (ex[k] && ex[k].min) || 0, note: (ex[k] && ex[k].note) || '' };
  });
  window._hrCurrentSessionId = rec.id;
}
/* ═══ סוף מניעת כפילות סדרים ═══════════════════════════════════════════ */

// פתיחת סדר חדש
async function atOpenSession(sessId, sessName) {
  // מנע פתיחת סדר חדש בזמן שסדר אחר פתוח
  if(window._atCurrentSessionId){toast(MSG_CLOSE_SESSION_FIRST, null, 'bad');return;}
  var dateIso=(document.getElementById('at_date_iso')||{}).value;
  if(!dateIso){toast(MSG_PICK_DATE_FIRST, null, 'bad');return;}

  /*  ⛔ חיווי וכפתור מושבת לאורך ההמתנה — ⚠️ הפתיחה ממתינה למשיכה
   *  **בכוונה**, ⭐ ובלי חיווי ההמתנה נראית כמסך תקוע ולחיצה שנייה שולחת
   *  בקשה נוספת: ⛔ והניטרול בניתוב — ⚠️ רשומת המפה מחזירה את ההבטחה,
   *  ⭐ ו-`data-busy` על הכפתור נותן את התווית. */
  // בדוק כפילות — אותו סדר ואותו יום, מול המצב הטרי ביותר שיש
  /*  ⛔⛔ משיכה **אחת** ⛔ ומסוננת ליום שנבחר — ⚠️ הנימוק המדוד:
   *  כאן היו **שתי** משיכות מלאות בזו אחר זו של אותן טבלאות, ⭐ ואף אחת
   *  מהן בלי חלון: ⛔ 359 סדרים ו-18,329 סימונים בכל אחת — ⚠️ 18,688 שורות
   *  כפול שתיים, ⭐ לפתיחת סדר אחד. ⛔ ובדיקת הכפילות צריכה **יום אחד**,
   *  ⚠️ שהוא 248 שורות.
   *  ⛔ **והבדיקה עצמה נשארת** — ⭐ היא מכריעה אם נוצרת רשומה שנייה לאותו
   *  סדר, ⚠️ ומה שהצטמצם הוא היקף המשיכה ⛔ ולא המדיניות.
   *  ⛔ **וכשל משיכה נופל-חזרה למצב המקומי** ⛔ ואינו פותח סדר בעיוורון —
   *  ⚠️ המיזוג החלוני שומר על רשומות שמחוץ לחלון, ⭐ ולכן `_atData` נשאר
   *  שלם גם אחרי משיכה מסוננת. */
  await _atPullSessions(hrDayWin(dateIso));
  var allData=window._atData||[];
  var existing=atFindLiveSession(allData,sessName,dateIso);
  if(existing){
    openModal(MSG_SESSION_DONE,
      '<p class="md-note-center">'+esc(sessName)+' כבר מולא היום.<br>האם לפתוח לעריכה?</p>',
      '<button data-act="modal-close" class="md-btn-ghost">ביטול</button>'+
      '<button data-act="at-resume-go" data-id="'+esc(existing.id)+'" class="md-btn-primary">ערוך</button>');
    return;
  }

  // אתחול סימונים — סימון אוטומטי לפי סטאטוס + שעת הסדר
  var _oCfg=window._atCfg||atDefaultCfg();
  var _oSessObj=_oCfg.sessions.find(function(s){return s.name===sessName||idEq(s.id, sessId);});
  var _oSessTime=_oSessObj&&_oSessObj.startTime?_oSessObj.startTime:'';
  var students=hrSortStudents(getStudents());
  window._atMarks={};
  window._atPending={};
  window._atCleared={};
  students.filter(function(s){return s.active!==false;}).forEach(function(s){
    var am=atAutoMark(s,dateIso,_oSessTime);
    if(am) window._atMarks[s.id]={s:am,min:0};
  });

  var filler=document.getElementById('at-filler');
  var dateHeb=_hcH(new Date(dateIso));
  // שמור auto-marks ישירות ב-rec.marks כדי שלא יאבדו ביציאה ללא שמירה
  var initMarks={};
  students.filter(function(s){return s.active!==false;}).forEach(function(s){
    var m=window._atMarks[s.id];
    initMarks[String(s.id)]={s:m?m.s:'',min:0};
  });
  var rec={
    id:Date.now()+'_'+Math.random().toString(36).substr(2,5),
    session:sessName,
    date_iso:dateIso,
    date_heb:dateHeb,
    filled_by:AUTH.user?AUTH.user.client_id:'',
    filled_by_name:filler?filler.value:(AUTH.user?AUTH.user.full_name:''),
    marks:initMarks,
    created_at:new Date().toISOString(),
    updatedAt:Date.now(),
    createdBy:hrWho(),
    open:true
  };

  // מניעת רישומי רפאים: הרשומה תישמר רק בסימון הראשון בפועל (atMarkDirty)
  /*  ⛔ ואין כאן קריאת טעינה שנייה — ⚠️ `_atData` כבר הוצב למעלה
   *  מתוצאת המשיכה הטרייה, ⭐ והקריאה החוזרת החזירה את אותו מערך מהמטמון:
   *  ⛔ שורה שנראתה כמו הגנה ⛔ ולא הגנה על דבר. */
  window._atPendingRec=rec;
  window._atCurrentSessionId=rec.id;

  _atMountOpenSession(sessName, dateHeb);
};
/*  ⛔ ההרכבה נפרדת מהבדיקה — ⚠️ הפתיחה **חייבת** להמתין למשיכה: ⭐ היא
 *  מחליטה אם נוצרת רשומה שנייה לאותו סדר, ⛔ וציור לפני התשובה היה פותח
 *  מסך רישום על סדר שכבר קיים במכשיר אחר. ⛔ ולכן ההמתנה אינה במסלול
 *  הציור — ⚠️ ההרכבה עצמה סינכרונית. */
function _atMountOpenSession(sessName, dateHeb) {
  var hdr=document.getElementById('at-reg-header');
  if(hdr) hdr.innerHTML=
    '<span class="rec-title">'+esc(sessName)+'</span>'+
    '<span class="rec-date">'+_hcFmt(dateHeb.hy,dateHeb.mi,dateHeb.day)+'</span>';

  document.getElementById('at-reg-picker').classList.add('hidden');
  document.getElementById('at-reg-list').classList.remove('hidden');
  atRenderStudents();
}

// שמירה מקומית מיידית של הסימונים לתוך רשומת הסשן האמיתית (ללא רשת)
function atSaveLocalNow() {
  if(!window._atCurrentSessionId||!window._atData) return null;
  var rec=window._atData.find(function(r){return idEq(r.id,window._atCurrentSessionId);});
  if(!rec) return null;
  var marks={};
  getStudents().forEach(function(s){
    if(s.active===false) return;
    var m=window._atMarks[s.id];
    marks[s.id]=m?{s:m.s,min:m.s==='l'?(m.min||0):0}:{s:'',min:0};
  });
  rec.marks=marks;
  rec.updatedAt=Date.now();
  // מסלול קריטי — רישום נוכחות. כישלון כאן חייב לעצור את השרשרת: הסימון
  // כבר על המסך, ובלי העצירה המשתמש היה ממשיך כאילו נשמר.
  if(!_hrAtDiskSave(window._atData)) return null;
  // ⚠️ נשמר במכשיר וסומן ⏳ — הסימון יורד רק בדחיפת-מצב מוצלחת.
  pendMark(PK_AT_SESS + rec.id);
  return rec;
}
// שמירה אוטומטית לKV (מקומי + ענן ממוזג)
async function atAutoSaveNow() {
  if(atSaveLocalNow()===null) return;
  await atSaveData(window._atData);
}
// כל סימון: שמירה מקומית מיידית + דחיפה מרוכזת לענן (debounce)
function atMarkDirty() {
  // סימון ראשון בפועל — ממש את רשומת הסשן הממתינה (מניעת רישומי רפאים)
  if(window._atPendingRec && idEq(window._atCurrentSessionId,window._atPendingRec.id)){
    if(!window._atData) window._atData=[];
    // ⛔ הבדיקה חוזרת כאן ולא רק בפתיחה — זו נקודת היצירה בפועל,
    //    והפולינג יכול היה להביא סדר מתחרה מאז שהדיאלוג בדק.
    var _atDup=atFindLiveSession(window._atData,window._atPendingRec.session,
                                 window._atPendingRec.date_iso,window._atPendingRec.id);
    if(_atDup){
      atAdoptSession(_atDup);
      toast(MSG_SESSION_OPEN_ELSEWHERE, null, 'bad');
    } else if(!window._atData.some(function(r){return r&&idEq(r.id,window._atPendingRec.id);})) {
      window._atData.push(window._atPendingRec);
    }
    window._atPendingRec=null;
  }
  atSaveLocalNow();
  clearTimeout(window._atSaveTimer);
  window._atSaveTimer=setTimeout(atAutoSaveNow,3000);
}

// דיאלוג ביטול סטטוס מתוך לשונית הרישום
function atShowOverrideDialog(sid, student) {
  var aa=getActiveAbsences(student);
  var a=aa&&aa[0];
  if(!a) return;
  var TL={approved:'אישור',suspended:'השעיה',left:'לא שב'};
  var TI={approved:'✅',suspended:'⚠️',left:'🚪'};
  var _dow=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var fmtDt=function(v){
    if(!v)return '—';
    var d=new Date(v),hd=_hcH(d);
    var hh=d.getHours(),mm=d.getMinutes();
    return 'יום '+_dow[d.getDay()]+' '+_hcFmt(hd.hy,hd.mi,hd.day)+' '+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  };
  var typeLbl=TL[a.type]||a.type;
  var typeIcon=TI[a.type]||'📋';
  var reasonHtml=a.reason?'<div class="abs-reason-blk">סיבה: '+esc(a.reason)+'</div>':'';
  var datesHtml='<div class="abs-dates-blk">מ: '+fmtDt(a.from)+'<br>עד: '+(a.to?fmtDt(a.to):'ללא תאריך סיום')+'</div>';
  openModal(typeIcon+' '+typeLbl+' — '+student.name,
    '<div class="abs-tone '+tyCls(a.type)+' abs-type-head">'+esc(typeLbl)+'</div>'+
    reasonHtml+
    datesHtml+
    '<div class="md-question">האם לבטל את הסטטוס לגמרי?<br><span class="md-question-warn">אם כן הוא יימחק והתלמיד ייחשב בישיבה כרגיל</span></div>',
    '<button data-act="modal-close" class="md-btn-close">סגור</button>'+
    '<button data-act="at-status-cancel" data-id="'+esc(sid)+'" class="md-btn-danger">בטל סטטוס</button>');
}

// ביטול סטטוס תלמיד מתוך לשונית הרישום
function atCancelStudentStatusFromReg(sid) {
  var students=getStudents();
  var s=students.find(function(x){return String(x.id)===String(sid);});
  if(!s) return;
  s.status=null; s.statusReason=null; s.statusFrom=null; s.statusTo=null;
  // tombstone לכל היעדרות (deleted=true+updatedAt) במקום ריקון פיזי — מונע תחיית-מתים במיזוג
  if(Array.isArray(s.absences)) s.absences.forEach(function(a){ a.deleted=true; a.updatedAt=Date.now(); a.deletedBy=hrWho(); });
  s.present=true;
  s.updatedAt=Date.now();
  saveStudents(students);
  schedulePush();
  // הסר auto-mark מהרישום הנוכחי, החזר ל"לא סומן"
  delete window._atMarks[sid];
  delete window._atCleared[sid];
  delete window._atPending[sid];
  atMarkDirty();
  atRenderStudents();
  renderStudents();
  toast(MSG_STATUS_REVERTED+s.name, null, 'good');
};

// החלת סימון (אחרי אישור אם נדרש)
function atApplyMark(sid, code) {
  var s=String(sid);
  // איחור: min=null → שדה ריק עד שהמשתמש יזין ערך
  window._atMarks[s]={s:code,min:code==='l'?null:0};
  window._atCleared[s]=true;    // מנע חזרת auto-mark
  window._atPending[s]=true;    // השאר למעלה בינתיים
  atRenderStudents();
  if(code!=='l'){
    // לא איחור: הורד לרשימה לאחר 600ms
    setTimeout(function(){
      delete window._atPending[s];
      atRenderStudents();
    },600);
  }
  // איחור: נשאר pending עד לחיצה על ✓ (atConfirmLate)
  atMarkDirty();
};

// אישור איחור — הורדה לרשימת מסומנים
function atConfirmLate(sid) {
  var s=String(sid);
  var inp=document.getElementById('at-min-'+sid);
  var val=readNum(inp, 0);
  if(!val||val<=0){toast(MSG_NEED_MINUTES, null, 'bad');return;}
  if(val>30){toast(MSG_LATE_OVER_30, null, 'bad');return;}
  atSetLateMin(sid,val);
  delete window._atPending[s];
  atRenderStudents();
  atMarkDirty();
};

/* ══════════════════════════════════════════════════════════════════════════
   נוכחות — רשימת התלמידים שבסדר וכפתורי הסימון
   ══════════════════════════════════════════════════════════════════════════ */
function atRenderStudents() {
  var el=document.getElementById('at-students');
  if(!el) return;
  var students=hrSortStudents(getStudents());
  if(!students||!students.length){el.innerHTML='<div class="empty-note">אין תלמידים</div>';return;}

  var active=students.filter(function(s){return s.active!==false;});

  // הפרד: לא סומן / pending (למעלה)  vs.  סומן סופי (למטה)
  var unmarked=[], marked=[];
  active.forEach(function(s){
    var cur=window._atMarks[s.id];
    var isPending=!!window._atPending[s.id];
    if(cur&&cur.s&&!isPending) marked.push(s);
    else unmarked.push(s);
  });

  var bs='mark-btn';
  function mkBtn(sid,code,label){
    var cur=(window._atMarks[sid]||{}).s;
    var isOn=(cur===code);
    var cls=bs+' '+atvCls(code)+(isOn?' mark-on':' mark-off');
    return '<button data-act="at-set-mark" data-id="'+esc(sid)+'" data-code="'+esc(code)+'" class="'+cls+'">'+label+'</button>';
  }
  function mkClearBtn(sid){
    return '<button data-act="at-clear-mark" data-id="'+esc(sid)+'" title="נקה סימון" '+
      'class="at-clear-btn clr-btn">✕</button>';
  }

  function renderRow(s, isMark) {
    var marks=window._atMarks[s.id]||{};
    var isLate=marks.s==='l';
    var hasMark=!!(marks.s);
    var cls=s.cls==='a'?'א':s.cls==='b'?'ב':s.cls==='g'?'ג':s.cls||'';
    var autoHintHtml='';
    var am=atAutoMark(s);
    if(am&&isMark&&!window._atCleared[s.id]){
      var aLbl=am==='ap'?'באישור':am==='ak'?'נעדר ידוע':'';
      if(aLbl) autoHintHtml='<span class="mark-hint">('+aLbl+')</span>';
    }
    var isPendingLate=isLate&&!!window._atPending[String(s.id)];
    var lateFieldHtml=isLate?
      '<div class="late-field">'+
        '<input aria-label="דק׳" type="text" inputmode="numeric" maxlength="2" value="'+(marks.min!=null?marks.min:'')+'" id="at-min-'+s.id+'" placeholder="דק׳" '+
        'data-inp="at-late" data-kent="at-late" data-id="'+esc(s.id)+'" '+
        ' class="late-input">'+
        '<span class="unit-hint">דק׳</span>'+
        (isPendingLate?'<button data-act="at-confirm-late" data-id="'+esc(s.id)+'" class="late-ok-btn">✓ אשר</button>':'')+
      '</div>':'';
    var rowBg=isMark?'mark-row-on':'mark-row';
    return '<div class="'+rowBg+' mark-line">'+
      '<div class="at-row-class">'+esc(cls)+'</div>'+
      '<div class="at-row-name">'+esc(s.name)+autoHintHtml+'</div>'+
      lateFieldHtml+
      '<div class="at-row-marks">'+
        (hasMark?mkClearBtn(s.id):'')+
        mkBtn(s.id,'p','✓')+
        mkBtn(s.id,'l','איחור')+
        mkBtn(s.id,'e','-')+
        mkBtn(s.id,'x','x')+
        mkBtn(s.id,'ap','א')+
        mkBtn(s.id,'ak','ב')+
        mkBtn(s.id,'a','ג')+
      '</div>'+
    '</div>';
  }

  var html='';
  if(unmarked.length) html+=unmarked.map(function(s){return renderRow(s,false);}).join('');
  if(marked.length){
    html+='<div class="at-group-sep">'+
      '<span class="rule-line"></span>סומנו<span class="rule-line"></span></div>';
    html+=marked.map(function(s){return renderRow(s,true);}).join('');
  }
  el.innerHTML=html||'<div class="empty-note">אין תלמידים פעילים</div>';
};

// לחיצה על כפתור סימון — בדיקת override לאוטו-מארק
function atSetMark(sid, code) {
  var student=getStudents().find(function(s){return String(s.id)===String(sid);});
  // חשב auto-mark עם תאריך ושעת הסדר הנוכחי — זהה לחישוב בפתיחת הסדר
  var curRec=window._atData&&window._atCurrentSessionId?
    window._atData.find(function(r){return idEq(r.id,window._atCurrentSessionId);}):null;
  var sessDateIso=curRec?curRec.date_iso:null;
  var _cfg=window._atCfg||atDefaultCfg();
  var sessObj=curRec?(_cfg.sessions||[]).find(function(s){return s.name===curRec.session;}):null;
  var sessTime=sessObj&&sessObj.startTime?sessObj.startTime:'';
  var autoM=student?atAutoMark(student,sessDateIso,sessTime):null;
  var cur=window._atMarks[sid];
  // אם מסומן אוטומטית ולא נוקה — פתח דיאלוג ביטול סטטוס
  if(autoM&&cur&&cur.s===autoM&&!window._atCleared[sid]){
    atShowOverrideDialog(sid,student);
    return;
  }
  atApplyMark(sid,code);
};

// ניקוי סימון — מחזיר תלמיד לרשימה העליונה
function atClearMark(sid) {
  delete window._atMarks[sid];
  delete window._atPending[sid];
  window._atCleared[sid]=true;
  atRenderStudents();
  atMarkDirty();
};

function atSetLateMin(sid, val) {
  var n=parseInt(val)||0;
  if(n<0)n=0;if(n>30)n=30;
  if(!window._atMarks[sid])window._atMarks[sid]={s:'l',min:n};
  else window._atMarks[sid].min=n;
  atMarkDirty();
};

// שמור וסגור — חזרה לבחירת סדר
async function atCloseSession() {
  clearTimeout(window._atSaveTimer);
  // "שמור וסגור" = סימון הסשן כסגור (open=false); הרשומה עצמה כבר נשמרה לאורך הדרך
  var _cRec=window._atData&&window._atData.find(function(r){return idEq(r.id,window._atCurrentSessionId);});
  if(_cRec){_cRec.open=false;}
  await atAutoSaveNow();
  var rec=window._atData&&window._atData.find(function(r){return idEq(r.id,window._atCurrentSessionId);});
  var msg=rec?('✅ '+rec.session+' — '+_hcFmt(rec.date_heb.hy,rec.date_heb.mi,rec.date_heb.day)+' נשמר'):'✅ הסדר נשמר';
  window._atCurrentSessionId=null;
  window._atMarks={};
  window._atPendingRec=null;
  document.getElementById('at-reg-list').classList.add('hidden');
  document.getElementById('at-reg-picker').classList.remove('hidden');
  atRenderTodaySessions();
  toast(msg, null, 'good');
};

// -------- ארכיון --------
/* ══════════════════════════════════════════════════════════════════════════
   נוכחות — ארכיון הסדרים ומחיקתם
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔ מציג מיד ⛔ ומרענן ברקע — ⚠️ עד כאן הארכיון המתין למשיכה לפני הציור
 *  הראשון, ⛔ ולכן ניווט אליו נראה תקוע עד שהרשת חזרה. ⛔ וקורא שמסר
 *  רשומות מקבל אותן כפי שהן — ⚠️ הוא כבר סינן, ⭐ ורענון היה דורס אותו. */
async function atRenderArchive(records) {
  var el=document.getElementById('at-arc-list');
  if(!el) return;
  if(records){ _atPaintArchive(el, records, ''); return; }
  _atPaintArchive(el, hrCachedArr('_atData','hr_sessions')||[], '');
  var _okArc=await _atPullSessions(hrHebYearWin(_hcH(new Date()).hy));
  _atPaintArchive(el, hrCachedArr('_atData','hr_sessions')||[], _okArc?'':'⚠️ הרענון מהענן נכשל — המוצג הוא העותק שבמכשיר');
};
function _atPaintArchive(el, records, warn) {
  var warnHtml=warn?'<div class="warn-note">'+esc(warn)+'</div>':'';
  if(records) records=records.filter(function(r){return !(r&&r.deleted);});
  if(!records||!records.length){
    el.innerHTML=warnHtml+'<div class="empty-note">אין רשומות</div>';return;
  }
  var students=getStudents();
  function nameById(id){var s=students.find(function(x){return String(x.id)===String(id);});return s?s.name:'?';}
  var ARC_LBL={p:'נוכח',l:'איחור',e:'חיסור',x:'היעדרות',ap:'אישור',ak:'בבית',a:'מנוחה'};

  // חודש עברי נוכחי
  var todG=new Date();
  var todayIso=dayToday();
  var todH=_hcH(todG);
  var curHY=todH.hy, curMI=todH.mi;

  // קיבוץ: hy → mi → date_iso → [rec]
  var byYear={};
  records.forEach(function(rec){
    var hd=rec.date_heb;
    if(!hd||!hd.hy){var p=rec.date_iso.split('-');hd=_hcH(new Date(+p[0],+p[1]-1,+p[2]));}
    var hy=hd.hy,mi=hd.mi,iso=rec.date_iso;
    if(!byYear[hy]) byYear[hy]={};
    if(!byYear[hy][mi]) byYear[hy][mi]={};
    if(!byYear[hy][mi][iso]) byYear[hy][mi][iso]=[];
    byYear[hy][mi][iso].push({rec:rec,hd:hd});
  });

  var years=Object.keys(byYear).map(Number).sort(function(a,b){return b-a;});
  var idCtr=0; function uid(){return 'arc-col-'+(idCtr++);}

  var html='<div>';
  years.forEach(function(hy){
    var yId=uid();
    var isYearCur=hy===curHY;
    html+='<div class="arc-year">';
    // כותרת שנה
    html+='<div data-act="toggle-panel" data-panel="'+esc(yId)+'" '+
      ' class="arc-year-head">'+
      '<span class="arc-head-lbl">📅 '+_hcYL(hy)+'</span><span class="arc-year-chev">▾</span>'+
    '</div>';
    html+='<div id="'+yId+'" class="'+(isYearCur?'':'hidden')+' arc-year-body">';

    var months=Object.keys(byYear[hy]).map(Number).sort(function(a,b){return b-a;});
    months.forEach(function(mi){
      var mId=uid();
      var isMonthCur=isYearCur&&mi===curMI;
      var mName=_hcMN(hy)[mi];
      html+='<div class="arc-month">';
      // כותרת חודש
      html+='<div data-act="toggle-panel" data-panel="'+esc(mId)+'" '+
        ' class="arc-month-head">'+
        '<span class="arc-head-lbl">📆 '+mName+'</span><span class="arc-month-chev">▾</span>'+
      '</div>';
      html+='<div id="'+mId+'" class="'+(isMonthCur?'':'hidden')+' arc-month-body">';

      var _arcSessOrder={};
      atSortedSessions().forEach(function(s,i){_arcSessOrder[s.name]=i;});
      var days=Object.keys(byYear[hy][mi]).sort(function(a,b){return HE.compare(b,a);});
      days.forEach(function(iso){
        var dId=uid();
        var entries=byYear[hy][mi][iso].slice().sort(function(a,b){
          var ia=_arcSessOrder[a.rec.session]!=null?_arcSessOrder[a.rec.session]:999;
          var ib=_arcSessOrder[b.rec.session]!=null?_arcSessOrder[b.rec.session]:999;
          return ia-ib;
        });
        var hd0=entries[0].hd;
        var dayLabel=window.hebDayLabel(hd0.day)+' '+mName;
        var isToday=iso===todayIso;
        html+='<div class="arc-day">';
        // כותרת יום
        html+='<div data-act="toggle-panel" data-panel="'+esc(dId)+'" '+
          'class="arc-day-head '+(isToday?'arc-day-today':'arc-day-plain')+'">'+
          '<span class="arc-head-lbl">'+dayLabel+(isToday?' — <span class="arc-today">היום</span>':'')+
          ' <span class="arc-day-count">('+entries.length+' סדרים)</span></span>'+
          '<span class="arc-day-chev">▾</span>'+
        '</div>';
        html+='<div id="'+dId+'" class="'+(isToday?'':'hidden')+' arc-day-body">';

        entries.forEach(function(entry){
          var rec=entry.rec;
          var cnts={};
          Object.values(hrMarks(rec)).forEach(function(m){if(m.s)cnts[m.s]=(cnts[m.s]||0)+1;});
          var summaryHtml=atSummaryHtml(cnts);
          var sId=uid();
          html+='<div class="arc-sess-card">';
          html+='<div class="arc-sess-head" data-act="toggle-panel" data-panel="'+esc(sId)+'">';
          html+='<span class="arc-sess-name">'+esc(rec.session)+'</span>';
          html+='<div class="arc-sess-summary">'+summaryHtml+'</div>';
          html+='<button data-act="at-del-session" data-id="'+esc(rec.id)+'" class="arc-sess-del">✕</button>';
          html+='</div>';
          html+='<div id="'+sId+'" class="arc-sess-body hidden">';
          var _mk2=hrMarks(rec);
          var rows=hrSortStudents(Object.keys(_mk2).map(function(sid2){
            var _st2=students.find(function(x){return String(x.id)===String(sid2);});
            // ⚠️ תלמיד שנמחק אחרי הסדר אינו במצבת ⛔ ואינו נשמט מהשורה —
            //    הסדר שנרשם הוא עובדה, ו«חסר» בארכיון נקרא כמי שלא סומן.
            return _st2||{id:sid2,name:nameById(sid2),cls:''};
          })).map(function(_s2){
            var sid2=String(_s2.id),m2=_mk2[sid2]||{};
            var sn=_s2.name;
            var lbl=m2.s==='l'?('איחור — '+(m2.min||0)+' ד׳'):(ARC_LBL[m2.s]||'לא סומן');
            var mkc=atvCls(m2.s);
            return '<div class="arc-mark-row">'+
              '<span>'+esc(sn)+'</span><span class="'+mkc+' arc-mark">'+esc(lbl)+'</span></div>';
          });
          html+=rows.join('')+'</div></div>';
        });
        html+='</div></div>'; // תוכן היום ועטיפת היום
      });
      html+='</div></div>'; // תוכן החודש ועטיפת החודש
    });
    html+='</div></div>'; // תוכן השנה ועטיפת השנה
  });
  html+='</div>';
  el.innerHTML=warnHtml+html;
}

function atDeleteSession(id) {
  ask(MSG_DEL_SESSION_TITLE, MSG_DEL_SESSION_BODY, MSG_DELETE)
    .then(function (yes) { if (yes) atDeleteSessionConfirmed(id); });
};

async function atDeleteSessionConfirmed(id) {
  var data=await atLoadData();
  // מחיקה = tombstone, לא הסרה פיזית — כדי שהמחיקה תסתנכרן לכל המכשירים
  var _dRec=data.find(function(r){return idEq(r.id,id);});
  if(_dRec){_dRec.deleted=true;_dRec.updatedAt=Date.now();_dRec.deletedBy=hrWho();}
  await atSaveData(data);
  atRenderArchive();
  atRenderTodaySessions();   // רענן גם את רשימת הסדרים בלשונית רישום
  toast(MSG_ROW_DELETED, null, 'good');

async function atExportExcel(fromIso,toIso) {
  try {
    var data=await atLoadData();
    var students=getStudents();
    if(!data||!data.length){toast(MSG_NO_EXPORT_DATA);return;}
    data=data.filter(function(r){return !(r&&r.deleted);});
    if(fromIso) data=data.filter(function(r){return r.date_iso>=fromIso;});
    if(toIso)   data=data.filter(function(r){return r.date_iso<=toIso;});
    if(!data.length){toast(MSG_NO_DATA_IN_RANGE);return;}
    var sorted=data.slice().sort(function(a,b){return HE.compare(a.date_iso,b.date_iso);});
    // SpreadsheetML (Excel 2003 XML) עם ss:RightToLeft=1
    function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function cell(v){return '<Cell><Data ss:Type="String">'+xmlEsc(v)+'</Data></Cell>';}
    function numCell(v){return '<Cell><Data ss:Type="Number">'+xmlEsc(v)+'</Data></Cell>';}
    function hdrCell(v){return '<Cell ss:StyleID="hdr"><Data ss:Type="String">'+xmlEsc(v)+'</Data></Cell>';}
    var HDR=['תאריך','סדר','שם תלמיד','סטאטוס','דקות איחור','ממלא'];
    var xmlRows='<Row>'+HDR.map(hdrCell).join('')+'</Row>';
    sorted.forEach(function(rec){
      var hd=rec.date_heb;
      var dLabel=hd?_hcFmt(hd.hy,hd.mi,hd.day):rec.date_iso;
      Object.entries(hrMarks(rec)).forEach(function(e){
        var sid=e[0],m=e[1];
        var sn=(students.find(function(x){return String(x.id)===String(sid);})||{}).name||sid;
        var lbl=m.s==='p'?'נוכח':m.s==='l'?'איחור':m.s==='e'?'חיסור':m.s==='x'?'היעדרות':m.s==='ap'?'אישור':m.s==='ak'?'בבית':m.s==='a'?'מנוחה':'';
        var mins=m.s==='l'?(m.min||0):'';
        xmlRows+='<Row>'+cell(dLabel)+cell(rec.session)+cell(sn)+cell(lbl)+(mins!==''?numCell(mins):cell(''))+cell(rec.filled_by_name||'')+'</Row>';
      });
    });
    var xml='<?xml version="1.0" encoding="UTF-8"?>';
    xml+='<?mso-application progid="Excel.Sheet"?>';
    xml+='<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"';
    xml+=' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"';
    xml+=' xmlns:x="urn:schemas-microsoft-com:office:excel">';
    xml+='<Styles>';
    xml+='<Style ss:ID="hdr"><Font ss:Bold="1"/><Alignment ss:Horizontal="Right"/></Style>';
    xml+='<Style ss:ID="def"><Alignment ss:Horizontal="Right"/></Style>';
    xml+='</Styles>';
    xml+='<Worksheet ss:Name="סדרים" ss:RightToLeft="1">';
    xml+='<Table ss:DefaultColumnWidth="80">';
    xml+='<Column ss:Width="100"/><Column ss:Width="80"/><Column ss:Width="160"/><Column ss:Width="70"/><Column ss:Width="70"/><Column ss:Width="110"/>';
    xml+=xmlRows;
    xml+='</Table></Worksheet></Workbook>';
    var blob=new Blob(['\uFEFF'+xml],{type:'application/vnd.ms-excel;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='sdariim-'+dayToday()+'.xls';
    document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
    toast(MSG_EXPORT_OK, null, 'good');
  } catch(e){console.error('[Excel ERROR]',e); toast(MSG_EXPORT_FAIL+e.message, null, 'bad');}
};

async function atExportPdf(fromIso,toIso) {

    var data=await atLoadData();

    if(!data.length){toast(MSG_NO_DATA_IN_RANGE);return;}
    var sorted=data.slice().sort(function(a,b){return HE.compare(a.date_iso,b.date_iso);});
    var NB=' ';
    var fontName=hrPdfFont();
    function nb(s){return (s||'').replace(/ /g,NB);}
    function cell(s,opts){return Object.assign({text:nb(String(s)),alignment:'right'},opts||{});}
    var hdrRow=[
      cell('#',{bold:true}),cell('תאריך',{bold:true}),cell('סדר',{bold:true}),
      cell('נוכחים',{bold:true,color:'#276749'}),cell('חיסורים',{bold:true,color:'#742a2a'}),cell('מאחרים',{bold:true,color:'#dd6b20'})
    ];
    var body=[hdrRow];
    sorted.forEach(function(rec,i){
      var hd=rec.date_heb;
      var dLabel=hd?_hcFmt(hd.hy,hd.mi,hd.day):rec.date_iso;

      body.push([cell(i+1),cell(dLabel),cell(rec.session),cell(p),cell(ab),cell(l)]);
    });
    var contentArr=[
      {text:nb('ישיבת תומכי תמימים ראשל"צ'),fontSize:18,bold:true,alignment:'center',margin:[0,0,0,4],color:'#1a3a6b'},
      {text:nb('ארכיון שמירת סדרים'),direction:'rtl',fontSize:11,alignment:'center',color:'#555',margin:[0,0,0,fromIso||toIso?2:14]}
    ];
    if(fromIso||toIso){

        {text:fromIso||'תחילה',direction:'ltr'},
        {text:' — '},
        {text:toIso||'סוף',direction:'ltr'},
        {text:')'}
      ],alignment:'center',fontSize:10,color:'#777',margin:[0,0,0,14]});
    }
    contentArr.push({table:{widths:['auto','auto','*','auto','auto','auto'],body:body},margin:[0,0,0,10]});
    var dd={pageSize:'A4',pageMargins:[40,40,40,40],
      content:contentArr,defaultStyle:{font:fontName,alignment:'right'}};
    pdfMake.createPdf(dd).download('sdariim-'+dayToday()+'.pdf');
  } catch(e){toast(MSG_EXPORT_FAIL+e.message, null, 'bad');}

/* ══════════════════════════════════════════════════════════════════════════
