// נוצר מהתצורה — app.config.js, ב-node tools/gen-app.mjs: אין לערוך ביד
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanhala.ruchanit'
    compileSdk 34

    defaultConfig {
        applicationId "com.hanhala.ruchanit"
        minSdk 21
        targetSdk 34
        versionCode 27
        versionName "16.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — רשימת המקורות של גשר השיתוף נאכפת ב-WebView עצמו, לכל frame
    implementation 'androidx.webkit:webkit:1.11.0'
}
